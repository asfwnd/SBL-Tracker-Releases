      <div class="stat-box"><div class="sv mono">${monthVolume.toLocaleString()}</div><div class="sk">30-day volume</div></div>
      <div class="stat-box" style="grid-column:span 2;"><div class="sv mono">${lifetimeVolume.toLocaleString()}${settings.units}</div><div class="sk">Lifetime volume</div></div>
    </div>
    <div class="section-label">Personal Records</div>
    <div id="prList"></div>
  `;
  const prList = content.querySelector('#prList');
  Object.keys(prMap).sort((a, b) => prMap[a].name.localeCompare(prMap[b].name)).forEach(key => {
    const pr = prMap[key];
    const row = document.createElement('div');
    row.className = 'list-item';
    const bwTxt = pr.bw ? ` · BW ${pr.bw}${settings.units}` : '';
    row.innerHTML = `<div><div class="li-name">${pr.name}</div><div class="li-meta mono">${formatSetLine(pr.set, pr.name)} · est. 1RM ${pr.est}${exerciseUnit(pr.name)}${bwTxt}</div></div><div class="li-right">›</div>`;
    row.onclick = () => { exerciseHistoryName = pr.name; goTo('exercise-history'); };
    prList.appendChild(row);
  });
}

/* ---------- unit conversion ---------- */
function convertWeightValue(val, factor) {
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  return Math.round(n * factor * 10) / 10;
}
/* The unit a given exercise is tracked in — its own override if it has one,
   otherwise the app-wide default. */
function exerciseUnit(name) { return exerciseUnits[nameKey(name)] || settings.units; }
function convertBetweenUnits(val, fromU, toU) {
  if (fromU === toU) return val;
  const factor = toU === 'lb' ? 2.2046226218 : 1 / 2.2046226218;
  return convertWeightValue(val, factor);
}
/* Normalizes one exercise's weight into the app-wide unit — used anywhere
   weights from different exercises get summed together (session/lifetime
   volume), since an overridden exercise's raw numbers are stored in its own
   unit, not necessarily settings.units. */
function toGlobalWeight(weight, name) { return convertBetweenUnits(weight, exerciseUnit(name), settings.units); }
function sessionTotalVolume(exercises) {
  return Math.round((exercises || []).reduce((tot, ex) =>
    tot + (ex.sets || []).reduce((a, s) => a + toGlobalWeight(parseFloat(s.weight) || 0, ex.name) * totalReps(s), 0), 0));
}
/* Per-exercise unit toggle — lives only on that exercise's set-tracking
   screen. Unlike the global Settings toggle, this never touches
   settings.units or any other exercise: it flips (and optionally converts)
   every past and present logged set for THIS exercise name only, across all
   history logs, the in-progress draft, and its cached best-lift, then
   remembers the override in exerciseUnits so future entries for it default
   to the new unit too. */
async function convertExerciseUnit(exName) {
  const from = exerciseUnit(exName);
  const to = from === 'kg' ? 'lb' : 'kg';
  const choice = await showAppConfirm(
    `Convert unit from ${from} to ${to} for "${exName}" only? Every other exercise stays in its current unit.`,
    [
      { label: 'Yes, Change Unit and Convert Data', value: 'convert' },
      { label: 'No, Just Change Unit', value: 'label' },
    ]
  );
  if (!choice) return false;
  const key = nameKey(exName);
  exerciseUnits[key] = to;
  await saveJSON('exerciseUnits', exerciseUnits);
  if (choice === 'convert') {
    const factor = to === 'lb' ? 2.2046226218 : 1 / 2.2046226218;
    const logKeys = listKeys('log:');
    for (const k of logKeys) {
      const log = loadJSON(k, null);
      if (!log) continue;
      let touched = false;
      (log.exercises || []).forEach(ex => {
        if (!sameExName(ex.name, exName)) return;
        (ex.sets || []).forEach(s => {
          if (s.weight !== undefined && s.weight !== '') { s.weight = convertWeightValue(s.weight, factor); touched = true; }
        });
      });
      if (touched) {
        log.totalVolume = sessionTotalVolume(log.exercises);
        await saveJSON(k, log);
      }
    }
    const bestLifts = await loadJSON('bestLifts', {});
    if (bestLifts[key] !== undefined) {
      bestLifts[key] = convertWeightValue(bestLifts[key], factor);
      await saveJSON('bestLifts', bestLifts);
    }
    if (draft) {
      let draftTouched = false;
      (draft.exercises || []).forEach(ex => {
        if (!sameExName(ex.name, exName)) return;
        (ex.sets || []).forEach(s => {
          if (s.weight !== undefined && s.weight !== '') { s.weight = convertWeightValue(s.weight, factor); draftTouched = true; }
        });
      });
      if (draftTouched) await saveJSON('draft', draft);
    }
    historyEntries = []; // force a fresh reload from the converted logs
  }
  return true;
}
/* Scoped unit fix — for correcting one exercise, one session, or one saved
   log when the unit toggle was mispressed, without touching the rest of
   history the way the global Settings toggle does. applyConvert(factor) is
   only invoked if the person confirms the numbers themselves are wrong and
   need recalculating; if the numbers were already correct and only the
   label was wrong, the unit flips with the data left untouched. */
async function runUnitFixFlow(applyConvert) {
  const from = settings.units;
  const to = from === 'kg' ? 'lb' : 'kg';
  const choice = await showAppConfirm(
    `Convert unit from ${from} to ${to}?`,
    [
      { label: `Yes, Change Unit and Convert Data`, value: 'convert' },
      { label: 'No, Just Change Unit', value: 'label' },
    ]
  );
  if (!choice) return false;
  if (choice === 'convert') {
    const factor = to === 'lb' ? 2.2046226218 : 1 / 2.2046226218;
    applyConvert(factor);
  }
  settings.units = to;
  await saveJSON('settings', settings);
  return true;
}
async function convertStoredUnits(oldUnit, newUnit) {
  if (!oldUnit || !newUnit || oldUnit === newUnit) return;
  const factor = newUnit === 'lb' ? 2.2046226218 : 1 / 2.2046226218;

  // Convert every saved workout log (weights, bodyweight, total volume) —
  // covers unilateral sets too, since they use the same `weight` field.
  const logKeys = listKeys('log:');
  for (const k of logKeys) {
    const log = loadJSON(k, null);
    if (!log) continue;
    if (log.bodyweight !== undefined && log.bodyweight !== '') {
      log.bodyweight = convertWeightValue(log.bodyweight, factor);
    }
    (log.exercises || []).forEach(ex => {
      (ex.sets || []).forEach(s => {
        if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor);
      });
    });
    if (typeof log.totalVolume === 'number') {
      log.totalVolume = Math.round(log.totalVolume * factor);
    }
    await saveJSON(k, log);
  }

  // Convert the cached best-lift (est. 1RM) values used for PR detection.
  const bestLifts = await loadJSON('bestLifts', {});
  Object.keys(bestLifts).forEach(name => {
    bestLifts[name] = convertWeightValue(bestLifts[name], factor);
  });
  await saveJSON('bestLifts', bestLifts);

  // Convert the in-progress draft workout, if there is one, so sets already
  // logged today (and the bodyweight field) match the new unit right away.
  if (draft) {
    if (draft.bodyweight !== undefined && draft.bodyweight !== '') {
      draft.bodyweight = convertWeightValue(draft.bodyweight, factor);
    }
    (draft.exercises || []).forEach(ex => {
      (ex.sets || []).forEach(s => {
        if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor);
      });
    });
    await saveJSON('draft', draft);
  }

  historyEntries = []; // force a fresh reload from the converted logs
}

    const wheelWrap = root.querySelector('#colorWheelWrap');
    const wheelCanvas = root.querySelector('#colorWheelCanvas');
    const wheelKnob = root.querySelector('#colorWheelKnob');
    const satSlider = root.querySelector('#satSlider');
    const setSliderFill = (pct) => { satSlider.style.setProperty('--fill', pct + '%'); };

    drawColorWheel(wheelCanvas);
    const positionKnob = (hue, satMult) => {
      const r = wheelCanvas.width / 2;
      const angleRad = hue * Math.PI / 180;
      const dist = satMult * r;
      wheelKnob.style.left = (r + dist * Math.cos(angleRad)) + 'px';
      wheelKnob.style.top = (r + dist * Math.sin(angleRad)) + 'px';
    };
    positionKnob(settings.accentHue ?? 170, settings.accentSat ?? 1);
    let pendingHue = settings.accentHue ?? 170, pendingSat = settings.accentSat ?? 1;
    // Both controls write the same pending{Hue,Sat} + call applyAccentTheme

    // persists + pushes to Supabase — so wheel and slider always agree, and
    // the person sees the real theme change as they move either one, before
    // anything is saved.
    const readWheelPoint = (clientX, clientY) => {
      const rect = wheelCanvas.getBoundingClientRect();
      const r = rect.width / 2;
      const dx = clientX - (rect.left + r), dy = clientY - (rect.top + r);
      const dist = Math.min(r, Math.sqrt(dx * dx + dy * dy));
      pendingHue = Math.round((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360);
      pendingSat = Math.round((dist / r) * 100) / 100;
      positionKnob(pendingHue, pendingSat);
      satSlider.value = Math.round(pendingSat * 100);
      setSliderFill(satSlider.value);
      applyAccentTheme(pendingHue, pendingSat); // live preview while dragging
    };
    let wheelDragging = false;
    wheelWrap.addEventListener('pointerdown', (e) => {
      wheelDragging = true;
      wheelWrap.setPointerCapture(e.pointerId);
      readWheelPoint(e.clientX, e.clientY);
    });
    wheelWrap.addEventListener('pointermove', (e) => {
      if (!wheelDragging) return;
      readWheelPoint(e.clientX, e.clientY);
    });
    const commitTheme = async () => {
      settings.accentHue = pendingHue;
      settings.accentSat = pendingSat;
      settings.activeSwatchId = null; // freeform wheel color — not tied to any saved swatch until "Add" is pressed
      await saveJSON('settings', settings); // 'settings' is a CLOUD_SYNC_KEYS entry — this pushes to Supabase automatically
      renderSettings(root);
    };
    const finishWheelDrag = () => { if (wheelDragging) { wheelDragging = false; commitTheme(); } };
    wheelWrap.addEventListener('pointerup', finishWheelDrag);
    wheelWrap.addEventListener('pointercancel', finishWheelDrag);
    satSlider.addEventListener('input', () => {
      pendingHue = settings.accentHue ?? 170;
      pendingSat = parseInt(satSlider.value, 10) / 100;
      positionKnob(pendingHue, pendingSat);
      setSliderFill(satSlider.value);
      applyAccentTheme(pendingHue, pendingSat); // live preview while sliding
    });
    satSlider.addEventListener('change', commitTheme); // fires once on release
    // Saves whatever color is currently active (wheel + slider, already
    // committed above) as a new, permanent swatch. It's deliberately a
    // fresh entry rather than an edit to any existing swatch — the wheel
    // stays open and still parked on this exact color afterward, so the
    // natural next move is nudging it a bit and hitting Add again to

    root.querySelector('#addCustomColorBtn').onclick = async () => {

  };
  root.querySelectorAll('#autoStartTargetGrid .chip').forEach(btn => {

  root.querySelector('#toggleAutoQueueExercises').onclick = async (e) => {

  };
  root.querySelector('#toggleAutoCarry').onclick = async (e) => {

    const satSlider = root.querySelector('#setupSatSlider');

    const positionKnob = (hue, satMult) => {
      const r = wheelCanvas.width / 2;
      const angleRad = hue * Math.PI / 180;
      const dist = satMult * r;
      wheelKnob.style.left = (r + dist * Math.cos(angleRad)) + 'px';
      wheelKnob.style.top = (r + dist * Math.sin(angleRad)) + 'px';

    positionKnob(settings.accentHue ?? 170, settings.accentSat ?? 1);
    let pendingHue = settings.accentHue ?? 170, pendingSat = settings.accentSat ?? 1;

      const r = rect.width / 2;
      const dx = clientX - (rect.left + r), dy = clientY - (rect.top + r);
      const dist = Math.min(r, Math.sqrt(dx * dx + dy * dy));
      pendingHue = Math.round((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360);
      pendingSat = Math.round((dist / r) * 100) / 100;

      if (!wheelDragging) return;
      readWheelPoint(e.clientX, e.clientY);
    });
    const commitTheme = async () => {
      settings.accentHue = pendingHue;
      settings.accentSat = pendingSat;
      settings.activeSwatchId = null;
      await saveJSON('settings', settings);
      renderSetupAppearance(root);
    };
    const finishWheelDrag = () => { if (wheelDragging) { wheelDragging = false; commitTheme(); } };
    wheelWrap.addEventListener('pointerup', finishWheelDrag);
    wheelWrap.addEventListener('pointercancel', finishWheelDrag);
    satSlider.addEventListener('input', () => {
      pendingHue = settings.accentHue ?? 170;
      pendingSat = parseInt(satSlider.value, 10) / 100;
      positionKnob(pendingHue, pendingSat);
      setSliderFill(satSlider.value);
      applyAccentTheme(pendingHue, pendingSat);
    });
    satSlider.addEventListener('change', commitTheme);
    root.querySelector('#setupAddCustomColorBtn').onclick = async () => {
      const newColor = { id: uid(), hue: settings.accentHue, sat: settings.accentSat };

      showToast('Custom color added');
      renderSetupAppearance(root);

function renderSettingsBackup(root) {
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Backup</div>
    <h1 class="big">Backup & Restore</h1>
    <p class="sub">Export everything as a JSON file, or restore from one. Useful before switching phones.</p>
    <button class="btn-primary" id="exportBtn">Export JSON</button>
    <button class="btn-secondary" id="importBtn">Import JSON</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  `;
  root.querySelector('#backBtn').onclick = () => goBack();
  root.querySelector('#exportBtn').onclick = () => {
    const keys = listKeys('');
    const dump = {};
    for (const k of keys) {
      // Never export the live Supabase session — access_token/refresh_token
      // in here would let anyone holding this file act as this account.
      // Doesn't matter for restoring on your own device either: the device
      // already has its own current session, an old one from the backup
      // would only be stale and redundant.
      if (/^sb-.*-auth-token$/.test(k)) continue;
      // cloudMark:* is this device's private "last known synced version"
      // bookkeeping. Meaningless (or actively misleading, if stale) on any
      // other account or device — the app re-derives it on next sync.
      if (k.startsWith('cloudMark:')) continue;
      const v = localStorage.getItem(k);
      if (v !== null) dump[k] = v;
    }
    // Portable marker: whose account this came from, so an import on a
    // DIFFERENT account/device can tell it's a cross-account share (and
    // must always assign fresh IDs — this app's account never re-syncs
    // someone else's workout IDs), vs restoring your own backup (only
    // legacy/foreign-format IDs need regenerating). Not the same as the
    // 'lastAccountId' storage key — that one is never touched by import.
    if (account) dump.exportedFromAccountId = JSON.stringify(account.id);
    const blob = new Blob([JSON.stringify(dump)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sbl-tracker-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  };
  root.querySelector('#importBtn').onclick = () => root.querySelector('#importFile').click();
  root.querySelector('#importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const dump = JSON.parse(ev.target.result);

        // Defensive, regardless of where this file came from: never let an
        // imported file inject a foreign session token, someone else's
        // sync bookkeeping, or overwrite this device's own account-tracking
        // key. A well-formed export (see exportBtn above) won't contain
        // the first two anyway, but a hand-built or older-format file might.
        for (const k of Object.keys(dump)) {
          if (/^sb-.*-auth-token$/.test(k) || k.startsWith('cloudMark:')) delete dump[k];
        }
        delete dump.lastAccountId;

        // A marker set by this app's own export (see exportBtn) records
        // whose account the file came from. If it's present and doesn't
        // match who's logged in right now, this is someone else's data
        // being handed to a different account — every workout ID must be
        // reassigned, full stop, since this account has no history with
        // those IDs and reusing them risks colliding with whatever the
        // receiving account already has. No marker (older export, or a
        // hand-built file) falls back to the narrower legacy-format check
        // below, since we can't tell ownership either way.
        let exportedFromAccountId = null;
        if (typeof dump.exportedFromAccountId === 'string') {
          try { exportedFromAccountId = JSON.parse(dump.exportedFromAccountId); } catch (e) {}
        }
        delete dump.exportedFromAccountId;
        const crossAccountImport = exportedFromAccountId != null && (!account || exportedFromAccountId !== account.id);

        // Workouts from a foreign/legacy export, OR from any confirmed
        // cross-account import, can carry IDs this app never generates —
        // uid() is always dash-free (timestamp base36 + random suffix), so
        // anything with a dash is not ours. Foreign-format IDs (and, on a
        // cross-account import, ALL IDs — even native-format ones, since
        // they belong to someone else's history, not this account's) are
        // the ones most likely to collide with an already-deleted
        // (tombstoned) row, or with a different row entirely under this
        // account — which would otherwise permanently block them from ever
        // syncing, or worse, silently merge into the wrong workout.
        // Reassign native-format IDs so they always land as brand-new rows.
        for (const k of Object.keys(dump)) {
          if (!k.startsWith('log:')) continue;
          const oldId = k.slice(4);
          if (!crossAccountImport && !oldId.includes('-')) continue;
          try {
            const obj = JSON.parse(dump[k]);
            const newId = uid();
            obj.id = newId;
            dump['log:' + newId] = JSON.stringify(obj);
            delete dump[k];
          } catch (e) {}
        }

        // Before writing the new dump, find any EXISTING local logs that
        // share a date+day with something we're about to import, and drop
        // just the old local copy — no cloud delete, no tombstone, purely
        // local housekeeping so re-imports don't pile up as duplicates.
        const incomingByKey = {};
        for (const k of Object.keys(dump)) {
          if (!k.startsWith('log:')) continue;
          try {
            const incoming = JSON.parse(dump[k]);
            incomingByKey[incoming.date + '|' + incoming.day] = incoming.id;
          } catch (e) {}
        }
        for (const existingKey of listKeys('log:')) {
          const existing = await loadJSON(existingKey, null);
          if (!existing) continue;
          const gkey = existing.date + '|' + existing.day;
          const incomingId = incomingByKey[gkey];
          if (incomingId && incomingId !== existing.id) {
            deleteKey('log:' + existing.id);
            deleteKey('cloudMark:' + existing.id);
          }
        }

        // The file's own pendingSync (if present) can still reference the
        // pre-regeneration IDs above — drop it here, it gets rebuilt below
        // from the corrected log: keys, so nothing dangling gets queued.
        delete dump.pendingSync;

        for (const k of Object.keys(dump)) { localStorage.setItem(k, dump[k]); }

        // Any exercise name in the import that isn't already known
        // (builtin or synced catalog) gets captured exactly like a
        // freshly-typed one would be — so restoring/migrating a backup
        // grows the catalog the same way normal use would have, instead
        // of silently leaving those names uncaptured until re-typed.
        try {
          const seenImportKeys = new Set();
          const captureFromList = (list, day) => {
            (list || []).forEach(item => {
              if (!item || !item.name) return;
              const k = nameKey(item.name);
              if (!k || seenImportKeys.has(k)) return;
              seenImportKeys.add(k);
              captureNewExerciseIfUnknown(item.name, item.unilateral, categoriesForDay(day)[0]);
            });
          };
          if (dump.exercisesByDay) {
            try {
              const byDay = JSON.parse(dump.exercisesByDay);
              Object.entries(byDay || {}).forEach(([day, list]) => captureFromList(list, day));
            } catch (e) {}
          }
          for (const k of Object.keys(dump)) {
            if (!k.startsWith('log:')) continue;
            try {
              const log = JSON.parse(dump[k]);
              captureFromList(log.exercises, log.day);
            } catch (e) {}
          }
        } catch (e) { logClientError('importExerciseCapture', e); }
        // Force every restored workout to re-sync, regardless of what the
        // source device's pendingSync/cloudMark state said — those are
        // meaningless once this data lands under (possibly) a different
        // account or a stale sync state. See comment above.
        const restoredIds = Object.keys(dump).filter(k => k.startsWith('log:')).map(k => k.slice(4));
        restoredIds.forEach(id => restoredLogIds.add(id));
        if (restoredIds.length) {
          const pending = await loadJSON('pendingSync', []);
          const merged = Array.from(new Set([...pending, ...restoredIds]));
          await saveJSON('pendingSync', merged);
        }
        // Push to Supabase right now, in parallel, instead of waiting for
        // the reload-triggered boot() to work through pendingSync one at a
        // time. Only makes sense if we're actually logged in and online —
        // otherwise these just sit in pendingSync and go up via the normal
        // 'online' listener / next-boot retry, same as any offline-logged
        // workout.
        if (restoredIds.length && account && navigator.onLine) {
          Promise.all(
            restoredIds.map(id => {
              const log = loadJSON('log:' + id, null);
              return log ? syncWorkoutToCloud(log) : Promise.resolve();
            })
          ).catch(() => {});
        }
        showToast(
          crossAccountImport
            ? (account && navigator.onLine ? 'Imported to your account — syncing' : 'Imported — will sync when online')
            : (account && navigator.onLine ? 'Restored — syncing' : 'Restored — will sync when online')
        );
        setTimeout(() => boot(), 800);
      } catch (err) { showToast('Invalid backup file'); }
    };
    reader.readAsText(file);
  };
}

/* ---------- rest timer / stopwatch panel ----------
   The control panel is opened from the static "timer" half of the top
   hotbar (see initHotbar() below) instead of a draggable floating button —
   rwOpen/rwPanelEl are declared with the rest of the global state near the
   top of the file. The timer/stopwatch state itself (restEndTime,
   swStartTimestamp, etc.) is unchanged and keeps ticking across every
   screen exactly like before. */
/* Like the old rwFabLabel, but reports every clock that's actually
   running/paused right now (not just which tab is selected in the panel —
   those can differ), so the hotbar can show both a countdown AND a
   stopwatch at once instead of only ever picking one. */
function rwFabStates() {
  const states = [];
  if (restEndTime != null || restPaused) {
    const m = Math.max(0, Math.floor(restRemaining/60));
    const s = Math.max(0, restRemaining%60);
    states.push({ text: `${m}:${s.toString().padStart(2,'0')}`, kind: 'timer' });
  }
  if (swStartTimestamp != null || swElapsedMs > 0) {
    states.push({ text: formatStopwatch(currentStopwatchMs()), kind: 'stopwatch' });
  }
  return states;
}

function rwRenderPanel() {
  if (!rwPanelEl) return;
  const modeToggle = `
    <div class="rw-mode-toggle">
      <button class="rw-mode-btn ${rwMode === 'timer' ? 'active' : ''}" id="rwModeTimerBtn">Timer</button>
      <button class="rw-mode-btn ${rwMode === 'stopwatch' ? 'active' : ''}" id="rwModeStopwatchBtn">Stopwatch</button>
    </div>`;
  if (rwMode === 'stopwatch') {
    const swRunning = swStartTimestamp != null;
    rwPanelEl.classList.remove('rw-paused-state');
    rwPanelEl.innerHTML = `
      <div class="rw-panel-header">
        <span class="rw-panel-title">Stopwatch</span>
        <button class="rw-panel-close" id="rwCloseBtn">&times;</button>
      </div>
      ${modeToggle}
      <div class="rw-display" id="rwDisplay">${formatStopwatch(currentStopwatchMs())}</div>
      <div class="rw-btn-row">
        <button class="rw-btn rw-btn-primary" id="rwActionBtn">${swRunning ? 'Pause' : 'Start'}</button>
        <button class="rw-btn rw-btn-ghost" id="rwResetBtn">Reset</button>
      </div>
    `;
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    swBoundEls = swBoundEls.filter(el => el !== displayEl && el.isConnected);
    swBoundEls.push(displayEl);
    rwPanelEl.querySelector('#rwActionBtn').onclick = () => {
      if (swRunning) pauseStopwatch(); else startStopwatch();
      rwRenderPanel();
    };
    rwPanelEl.querySelector('#rwResetBtn').onclick = () => {
      resetStopwatch();
      rwRenderPanel();
    };
  } else {
    const running = restEndTime != null;
    const idleOrStopped = !running && !restPaused;
    const actionLabel = running ? 'Pause' : (restPaused ? 'Resume' : 'Start');
    rwPanelEl.classList.toggle('rw-paused-state', restPaused);
    rwPanelEl.innerHTML = `
      <div class="rw-panel-header">
        <span class="rw-panel-title">Rest Timer</span>
        <button class="rw-panel-close" id="rwCloseBtn">&times;</button>
      </div>
      ${modeToggle}
      <div class="rw-display" id="rwDisplay">--:--</div>
      <div class="rw-dur-row">
        <button class="rw-dur-btn" id="rwDurMinus">&minus;</button>
        <input type="number" class="rw-dur-input" id="rwDurInput" value="${restDuration}">
        <button class="rw-dur-btn" id="rwDurPlus">+</button>
      </div>
      <div class="rw-btn-row">
        <button class="rw-btn rw-btn-primary" id="rwActionBtn">${actionLabel}</button>
        <button class="rw-btn rw-btn-ghost" id="rwResetBtn">Reset</button>
      </div>
    `;
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    restBoundEls = restBoundEls.filter(el => el !== displayEl && el.isConnected);
    restBoundEls.push(displayEl);
    syncRestDisplayText();
    if (idleOrStopped) displayEl.textContent = '--:--';
    rwPanelEl.querySelector('#rwDurMinus').onclick = () => {
      const inp = rwPanelEl.querySelector('#rwDurInput');
      inp.value = Math.max(5, (parseInt(inp.value,10) || restDuration) - 15);
    };
    rwPanelEl.querySelector('#rwDurPlus').onclick = () => {
      const inp = rwPanelEl.querySelector('#rwDurInput');
      inp.value = (parseInt(inp.value,10) || restDuration) + 15;
    };
    rwPanelEl.querySelector('#rwActionBtn').onclick = () => {
      ensureAudioCtx();
      requestNotifPermission();
      if (running) { pauseRestTimer(); }
      else if (restPaused) { resumeRestTimer(); }
      else {
        const secs = parseInt(rwPanelEl.querySelector('#rwDurInput').value, 10) || restDuration;
        settings.restDefault = secs;
        saveJSON('settings', settings);
        startRestTimer(secs);
      }
      rwRenderPanel();
    };
    rwPanelEl.querySelector('#rwResetBtn').onclick = () => {
      stopRestTimer();
      rwRenderPanel();
    };
  }
  rwPanelEl.querySelector('#rwCloseBtn').onclick = () => rwClosePanel();
  rwPanelEl.querySelector('#rwModeTimerBtn').onclick = () => {
    if (rwMode === 'timer') return;
    rwMode = 'timer';
    saveJSON('rwMode', rwMode);
    rwRenderPanel();
    rwPositionPanel();
    updateHotbarTimerLabel();
  };
  rwPanelEl.querySelector('#rwModeStopwatchBtn').onclick = () => {
    if (rwMode === 'stopwatch') return;
    rwMode = 'stopwatch';
    saveJSON('rwMode', rwMode);
    rwRenderPanel();
    rwPositionPanel();
    updateHotbarTimerLabel();
  };
}

/* Anchors the panel under (or, if there's no room below — e.g. the hotbar
   is in "bottom" mode — above) the "timer" half of the hotbar. Live
   getBoundingClientRect() means this works correctly no matter where the
   hotbar actually sits, without hardcoding per-mode offsets. */
function rwPositionPanel() {
  if (!rwPanelEl || !hbTimerBtn) return;
  const w = window.innerWidth, h = window.innerHeight;
  const panelW = 220;
  const measuredH = rwPanelEl.offsetHeight;
  const panelH = measuredH > 0 ? measuredH : 300;
  const btnRect = hbTimerBtn.getBoundingClientRect();
  let left = btnRect.right - panelW;
  if (left < 8) left = 8;
  if (left + panelW > w - 8) left = w - panelW - 8;
  const spaceBelow = h - btnRect.bottom;
  let top = (spaceBelow >= panelH + 10 || btnRect.top < panelH) ? btnRect.bottom + 10 : btnRect.top - panelH - 10;
  top = Math.max(8, Math.min(top, h - panelH - 8));
  rwPanelEl.style.left = left + 'px';
  rwPanelEl.style.top = top + 'px';
}

function rwOpenPanel() {
  closeNotesPanel();
  closeAnglePanel();
  rwOpen = true;
  rwPanelEl = document.createElement('div');
  rwPanelEl.className = 'rw-panel';
  document.getElementById('restWidget').appendChild(rwPanelEl);
  rwRenderPanel();
  rwPositionPanel();
  setTimeout(() => document.addEventListener('pointerdown', rwOutsideClick), 0);
}
function rwOutsideClick(e) {
  if (rwPanelEl && !rwPanelEl.contains(e.target) && !(hbTimerBtn && hbTimerBtn.contains(e.target))) rwClosePanel();
}
function rwClosePanel() {
  rwOpen = false;
  document.removeEventListener('pointerdown', rwOutsideClick);
  if (rwPanelEl) {
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    restBoundEls = restBoundEls.filter(el => el.isConnected && el !== displayEl);
    swBoundEls = swBoundEls.filter(el => el.isConnected && el !== displayEl);
    rwPanelEl.remove();
    rwPanelEl = null;
  }
}

/* ---------- bench angle finder (hotbar) ----------
   How real bubble-level / angle-finder apps do this (iHandy Level,
   Clinometer, Bubble Level, etc.): they don't assume the phone is lying
   flat. The accelerometer's gravity vector has three components (x, y, z
   in the phone's own frame), and whichever axis gravity is most aligned
   with tells you how the phone is currently resting — flat on its back
   (z dominant), propped up in portrait (y dominant, e.g. leaned against
   an incline bench's backrest), or propped up in landscape (x dominant).
   The other two axes, the ones roughly perpendicular to gravity, are the
   "pivot" plane the tilt actually needs measuring in — so which pair of
   axes feeds the atan2() call switches with the dominant one. That's the
   whole trick: pick the dominant axis, measure tilt off the OTHER two,
   and you get one continuous, correct reading whether the phone is lying
   on the seat or held/propped against the backrest, with no separate
   "vertical mode" toggle for the user to flip themselves.

   Two more things real implementations do that a naive atan2() doesn't:
   - Low-pass filter the raw x/y/z components themselves (not the derived
     angle) — filtering the vector avoids the jumps you'd get smoothing an
     angle across the axis boundaries where it can wrap.
   - Make the dominant-axis switch "sticky" (require a margin, not just
     "greater than") — otherwise, right around the 45° boundary between
     two planes, the reading flickers back and forth between them.

   iOS requires an explicit one-tap permission grant
   (DeviceMotionEvent.requestPermission()) before devicemotion fires at
   all; Android doesn't need this. Panel follows the same
   open/close/position pattern as the rest-timer panel above, anchored to
   its own hotbar button instead. */
let angleOpen = false, anglePanelEl = null;
let angleListening = false, angleMotionHandler = null;
let angleFilt = null;          // { x, y, z } — low-pass filtered gravity vector
let angleActiveAxis = null;    // 'x' | 'y' | 'z' — sticky dominant axis
let angleReading = null;       // latest computeAngleReading() result
let angleZeroOffsets = { x: 0, y: 0, z: 0 }; // calibration, kept separate per axis/mode
let anglePermissionGranted = (typeof DeviceMotionEvent === 'undefined' || typeof DeviceMotionEvent.requestPermission !== 'function');

function angleNeedsPermissionPrompt() {
  return typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' && !anglePermissionGranted;
}
/* Picks the dominant (gravity-aligned) axis and measures tilt off the
   other two — see the block comment above for why. offAxisADeg/offAxisBDeg
   are that pair broken into individual signed angles (each axis's own
   atan2 against the dominant one), which is what the 2D bubble dot uses
   to show *which direction* it's off, not just by how much. */
function computeAngleReading(fx, fy, fz) {
  const absX = Math.abs(fx), absY = Math.abs(fy), absZ = Math.abs(fz);
  const mags = { x: absX, y: absY, z: absZ };
  const trueDominant = absX >= absY && absX >= absZ ? 'x' : (absY >= absZ ? 'y' : 'z');
  // Stickiness: keep the currently-active axis unless a different one now
  // exceeds it by a real margin (15%), so the reading doesn't flicker
  // between "flat" and "vertical" right at the crossover point.
  const dominant = (angleActiveAxis && mags[angleActiveAxis] * 1.15 >= mags[trueDominant]) ? angleActiveAxis : trueDominant;
  angleActiveAxis = dominant;

  let angleDeg, offA, offB, offAxisADeg, offAxisBDeg, label;
  const domAbs = mags[dominant];
  if (dominant === 'z') {
    angleDeg = Math.atan2(Math.sqrt(fx * fx + fy * fy), domAbs) * (180 / Math.PI);
    offA = fx; offB = fy;
    label = fz >= 0 ? 'Flat — screen up' : 'Flat — screen down';
  } else if (dominant === 'y') {
    angleDeg = Math.atan2(Math.sqrt(fx * fx + fz * fz), domAbs) * (180 / Math.PI);
    offA = fx; offB = fz;
    label = fy >= 0 ? 'Vertical — portrait' : 'Vertical — portrait, upside down';
  } else {
    angleDeg = Math.atan2(Math.sqrt(fy * fy + fz * fz), domAbs) * (180 / Math.PI);
    offA = fy; offB = fz;
    label = fx >= 0 ? 'Vertical — landscape' : 'Vertical — landscape, flipped';
  }
  offAxisADeg = Math.atan2(offA, domAbs) * (180 / Math.PI);
  offAxisBDeg = Math.atan2(offB, domAbs) * (180 / Math.PI);
  return { dominant, angleDeg, offAxisADeg, offAxisBDeg, label };
}
function startAngleSensor() {
  if (angleListening) return;
  angleFilt = null;
  angleActiveAxis = null;
  angleReading = null;
  angleMotionHandler = (e) => {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x === null || g.z === null) return;
    // Light low-pass (EMA) on the vector itself — see block comment above
    // for why this beats smoothing the derived angle.
    angleFilt = angleFilt == null
      ? { x: g.x, y: g.y, z: g.z }
      : { x: angleFilt.x * 0.8 + g.x * 0.2, y: angleFilt.y * 0.8 + g.y * 0.2, z: angleFilt.z * 0.8 + g.z * 0.2 };
    angleReading = computeAngleReading(angleFilt.x, angleFilt.y, angleFilt.z);
    updateAngleDisplay();
  };
  window.addEventListener('devicemotion', angleMotionHandler);
  angleListening = true;
}
function stopAngleSensor() {
  if (angleMotionHandler) window.removeEventListener('devicemotion', angleMotionHandler);
  angleMotionHandler = null;
  angleListening = false;
  angleFilt = null;
  angleActiveAxis = null;
  angleReading = null;
}
function updateAngleDisplay() {
  if (!anglePanelEl || !angleReading) return;
  const displayEl = anglePanelEl.querySelector('#angleDisplay');
  const labelEl = anglePanelEl.querySelector('#angleModeLabel');
  const dotEl = anglePanelEl.querySelector('#angleBubbleDot');
  if (!displayEl) return;
  const offset = angleZeroOffsets[angleReading.dominant] || 0;
  const shown = Math.max(0, angleReading.angleDeg - offset);
  displayEl.textContent = shown.toFixed(1) + '°';
  if (labelEl) labelEl.textContent = angleReading.label;
  if (dotEl) {
    // Bubble dot position is deliberately NOT zero-offset — it always
    // shows true physical tilt direction/magnitude (like a real vial),
    // while the number above is the calibrated reading. A dead-center
    // dot with a non-zero number just means the calibration point wasn't
    // quite flat/plumb itself.
    const R = 39, maxDeg = 45; // px the dot can travel; ° that pins it to the edge
    const px = (Math.max(-maxDeg, Math.min(maxDeg, angleReading.offAxisADeg)) / maxDeg) * R;
    const py = (Math.max(-maxDeg, Math.min(maxDeg, angleReading.offAxisBDeg)) / maxDeg) * R;
    dotEl.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
    dotEl.classList.toggle('off-level', shown > 1);
  }
}
function renderAnglePanel() {
  if (!anglePanelEl) return;
  if (angleNeedsPermissionPrompt()) {
    anglePanelEl.innerHTML = `
      <div class="rw-panel-header">
        <span class="rw-panel-title">Bench Angle</span>
        <button class="rw-panel-close" id="angleCloseBtn">&times;</button>
      </div>
      <div class="angle-sub">This device needs motion-sensor permission to read tilt.</div>
      <div class="rw-btn-row">
        <button class="rw-btn rw-btn-primary" id="angleEnableBtn">Enable Sensor</button>
      </div>
    `;
    anglePanelEl.querySelector('#angleCloseBtn').onclick = () => closeAnglePanel();
    anglePanelEl.querySelector('#angleEnableBtn').onclick = () => {
      DeviceMotionEvent.requestPermission().then(state => {
        if (state === 'granted') {
          anglePermissionGranted = true;
          startAngleSensor();
          renderAnglePanel();
          anglePositionPanel();
        } else {
          showToast('Motion permission denied');
        }
      }).catch(() => showToast('Motion permission denied'));
    };
    return;
  }
  anglePanelEl.innerHTML = `
    <div class="rw-panel-header">
      <span class="rw-panel-title">Bench Angle</span>
      <button class="rw-panel-close" id="angleCloseBtn">&times;</button>
    </div>
    <div class="angle-mode-label" id="angleModeLabel">Reading sensor…</div>
    <div class="angle-bubble-wrap">
      <div class="angle-bubble-ring"></div>
      <div class="angle-bubble-cross"></div>
      <div class="angle-bubble-dot" id="angleBubbleDot"></div>
    </div>
    <div class="rw-display" id="angleDisplay">--°</div>
    <div class="angle-sub">Lay it flat on the seat, or stand it against the backrest — mode auto-detects</div>
    <div class="rw-btn-row">
      <button class="rw-btn rw-btn-primary" id="angleZeroBtn">Zero</button>
      <button class="rw-btn rw-btn-ghost" id="angleResetZeroBtn">Reset</button>
    </div>
  `;
  anglePanelEl.querySelector('#angleCloseBtn').onclick = () => closeAnglePanel();
  anglePanelEl.querySelector('#angleZeroBtn').onclick = () => {
    // Calibrates out a bench/backrest/phone-case surface that isn't
    // perfectly flat or plumb itself — zero it out while the phone sits
    // on a known-true spot. Stored per dominant axis, since "flat" and
    // "vertical" calibrations are physically unrelated measurements.
    if (angleReading) angleZeroOffsets[angleReading.dominant] = angleReading.angleDeg;
    updateAngleDisplay();
  };
  anglePanelEl.querySelector('#angleResetZeroBtn').onclick = () => {
    angleZeroOffsets = { x: 0, y: 0, z: 0 };
    updateAngleDisplay();
  };
  startAngleSensor();
  updateAngleDisplay();
}
function anglePositionPanel() {
  if (!anglePanelEl || !hbAngleBtn) return;
  const w = window.innerWidth, h = window.innerHeight;
  const panelW = 220;
  const measuredH = anglePanelEl.offsetHeight;
  const panelH = measuredH > 0 ? measuredH : 340;
  const btnRect = hbAngleBtn.getBoundingClientRect();
  let left = btnRect.right - panelW;
  if (left < 8) left = 8;
  if (left + panelW > w - 8) left = w - panelW - 8;
  const spaceBelow = h - btnRect.bottom;
  let top = (spaceBelow >= panelH + 10 || btnRect.top < panelH) ? btnRect.bottom + 10 : btnRect.top - panelH - 10;
  top = Math.max(8, Math.min(top, h - panelH - 8));
  anglePanelEl.style.left = left + 'px';
  anglePanelEl.style.top = top + 'px';
}
function openAnglePanel() {
  rwClosePanel();
  closeNotesPanel();
  angleOpen = true;
  anglePanelEl = document.createElement('div');
  anglePanelEl.className = 'rw-panel angle-panel';
  document.getElementById('restWidget').appendChild(anglePanelEl);
  renderAnglePanel();
  anglePositionPanel();
  setTimeout(() => document.addEventListener('pointerdown', angleOutsideClick), 0);
}
function angleOutsideClick(e) {
  if (anglePanelEl && !anglePanelEl.contains(e.target) && !(hbAngleBtn && hbAngleBtn.contains(e.target))) closeAnglePanel();
}
function closeAnglePanel() {
  angleOpen = false;
  document.removeEventListener('pointerdown', angleOutsideClick);
  stopAngleSensor();
  if (anglePanelEl) { anglePanelEl.remove(); anglePanelEl = null; }
}

function initRestWidget() {
  let rwResizeDebounce = null;
  window.addEventListener('resize', () => {
    clearTimeout(rwResizeDebounce);
    rwResizeDebounce = setTimeout(() => {
      if (rwOpen) rwPositionPanel();
      if (angleOpen) anglePositionPanel();
    }, 200);
  });

  // Restore any timer that was running or paused before the app closed.
  const saved = loadJSON('restTimer', null);
  if (saved) {
    restDuration = saved.duration || settings.restDefault || 120;
    if (saved.paused) {
      restPaused = true;
      restRemaining = saved.remaining || 0;
      updateRestDisplay();
    } else if (saved.endTime && saved.endTime > Date.now()) {
      restEndTime = saved.endTime;
      restAlarmFired = false;
      tickRestTimer();
      restInterval = setInterval(tickRestTimer, 250);
    } else {
      deleteKey('restTimer');
    }
  } else {
    restDuration = settings.restDefault || 120;
  }

  // Restore any stopwatch that was running or paused before the app closed.
  const savedSw = loadJSON('stopwatch', null);
  if (savedSw) {
    swElapsedMs = savedSw.elapsedMs || 0;
    if (savedSw.startTimestamp) {
      swStartTimestamp = savedSw.startTimestamp;
      swInterval = setInterval(updateStopwatchDisplay, 250);
      updateStopwatchDisplay();
    }
  }
  updateHotbarTimerLabel();
}

/* ---------- top hotbar (timer + notes) ----------
   Each of Timer/Notes can independently be off or on — when on, it lives
   on the hotbar pill only (settings.timerEnabled/notesEnabled). There is
   no floating-widget mode. hbTimerBtn/hbNotesBtn always point at the
   hotbar element that triggers that feature. refreshHotbarLayout()
   rebuilds the hotbar pill any time a relevant setting changes. The
   hotbar container is position:fixed so it never scrolls away. */
/* Whether the hotbar pill itself will show anything at all, given a
   settings object — used to hide the "Hotbar position" setting entirely
   when both Timer and Notes are off, since a position setting for an
   empty/invisible bar makes no sense. */
function hotbarWillHaveContent(s) {
  return s.timerEnabled !== false || s.notesEnabled !== false || s.angleFinderEnabled === true;
}

function initHotbar() {
  refreshHotbarLayout();
  updateHotbarVisibility();
  initHotbarReorder();
}

/* Drag a hotbar button left/right to reorder Timer/Notes/Angle — same live
   pointer-follow approach as the vertical exercise-list drag in
   makeReorderable(), generalized to however many slots are on the bar (was
   a hardcoded 2-item swap; Angle joining as a 3rd slot meant this had to
   become a real "which slot is my live position nearest to" ranking rather
   than a single toggle). Arms instantly on pointerdown (no hold delay,
   matching the exercise drag's handle-starts-immediately feel) and only
   engages once real movement (MOVE_CANCEL_PX) is seen, so an ordinary tap
   still opens Timer/Notes/Angle normally. Uses pointer-event delegation on
   #hotbar itself rather than rebinding per button, since refreshHotbarLayout
   recreates the buttons on every settings change. */
function initHotbarReorder() {
  const hotbar = document.getElementById('hotbar');
  if (!hotbar) return;
  // Was 6px — small enough that ordinary finger jitter during a tap crossed
  // it, arming a "drag" that never actually swapped anything but still set
  // hbSuppressClick and ate the tap's click event. 16px plus the dx>dy check
  // below means only a real, deliberate horizontal drag ever engages.
  const MOVE_CANCEL_PX = 16;
  let armed = false, dragging = false, pointerId = null;
  let items = []; // { el, key, origLeft, origWidth, origCenter } snapshotted at pointerdown
  let dragIndex = -1;
  let liveOrder = []; // keys in current logical (possibly reordered) order

  hotbar.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.hb-btn');
    const pill = btn && btn.closest('.hb-pill');
    if (!btn || !pill || pill.children.length < 2) return;
    hbPressStartX = e.clientX; hbPressStartY = e.clientY;
    dragging = false;
    pointerId = e.pointerId;
    armed = true;
    const pillRect = pill.getBoundingClientRect();
    items = Array.from(pill.children).map(el => {
      const r = el.getBoundingClientRect();
      const left = r.left - pillRect.left;
      return { el, key: el.dataset.hbKey, origLeft: left, origWidth: r.width, origCenter: left + r.width / 2 };
    });
    dragIndex = items.findIndex(it => it.el === btn);
    liveOrder = items.map(it => it.key);
  });

  hotbar.addEventListener('pointermove', (e) => {
    if (pointerId === null || e.pointerId !== pointerId || !armed || dragIndex < 0) return;
    const dx = e.clientX - hbPressStartX, dy = e.clientY - hbPressStartY;
    if (!dragging) {
      // Wait for real movement before engaging — an ordinary tap has near-
      // zero delta, and this keeps a small vertical scroll from being
      // mistaken for a reorder drag.
      if (Math.abs(dx) < MOVE_CANCEL_PX && Math.abs(dy) < MOVE_CANCEL_PX) return;
      if (Math.abs(dy) > Math.abs(dx)) { armed = false; return; }
      dragging = true;
      hbSuppressClick = true;
      const dragEl = items[dragIndex].el;
      try { dragEl.setPointerCapture(pointerId); } catch (err) {}
      dragEl.style.position = 'relative';
      dragEl.style.zIndex = '2';
      dragEl.style.transition = 'none';
      items.forEach((it, i) => { if (i !== dragIndex) it.el.style.transition = 'transform 0.22s var(--ease-glide)'; });
    }
    const dragEl = items[dragIndex].el;
    dragEl.style.transform = `translateX(${dx}px) scale(1.03)`;
    const dragLiveCenter = items[dragIndex].origCenter + dx;
    // Rank every item by position — the dragged one at its live (finger-
    // following) center, everyone else at their original center — to get
    // the target logical order. This is what generalizes past exactly two
    // slots: with only 2 items it degenerates to the old single swap.
    const ranked = items
      .map((it, i) => ({ key: it.key, i, pos: i === dragIndex ? dragLiveCenter : it.origCenter }))
      .sort((a, b) => a.pos - b.pos);
    const newOrder = ranked.map(r => r.key);
    if (newOrder.join('|') !== liveOrder.join('|')) {
      liveOrder = newOrder;
      // Slide every non-dragged item to the original slot its new logical
      // position now implies — items themselves never move in the DOM,
      // only visually via transform, so refreshHotbarLayout() can cleanly
      // rebuild in the committed order once the drag ends.
      items.forEach((it, i) => {
        if (i === dragIndex) return;
        const newSlotIndex = liveOrder.indexOf(it.key);
        if (newSlotIndex === i) { it.el.style.transform = ''; return; }
        const targetOrigLeft = items[newSlotIndex].origLeft;
        it.el.style.transform = `translateX(${targetOrigLeft - it.origLeft}px)`;
      });
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) {}
    }
  });

  function endDrag() {
    if (!dragging) { armed = false; pointerId = null; items = []; dragIndex = -1; liveOrder = []; return; }
    dragging = false; armed = false;
    const dragEl = items[dragIndex] && items[dragIndex].el;
    try { if (dragEl) dragEl.releasePointerCapture(pointerId); } catch (err) {}
    pointerId = null;
    const origOrder = items.map(it => it.key);
    if (liveOrder.length && liveOrder.join('|') !== origOrder.join('|')) {
      // Commit the new order for the "on" items; any currently-off keys
      // get appended after, in their existing relative order — their
      // position only matters again once they're turned back on.
      const offKeys = settings.hotbarOrder.filter(k => !liveOrder.includes(k));
      settings.hotbarOrder = [...liveOrder, ...offKeys];
      saveJSON('settings', settings);
    }
    items.forEach(it => {
      it.el.style.transition = ''; it.el.style.transform = ''; it.el.style.position = ''; it.el.style.zIndex = '';
    });
    refreshHotbarLayout();
    // Safety net: if the DOM under the finger gets swapped mid-touch, the
    // browser sometimes never delivers a matching click to consume this
    // flag — left stuck true it would silently eat the very next real tap.
    setTimeout(() => { hbSuppressClick = false; }, 400);
    items = []; dragIndex = -1; liveOrder = [];
  }

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => hotbar.addEventListener(evt, endDrag));
}

/* Rebuilds the hotbar pill (0/1/2 items — a single item fills the whole
   pill and centers, matching "big, centered" for a lone feature), then
   re-wires its click handlers. Timer and Notes only ever live on the
   hotbar now — there is no floating-widget mode. Call this whenever
   timerEnabled/notesEnabled changes. */
function refreshHotbarLayout() {
  const hotbar = document.getElementById('hotbar');
  if (!hotbar) return;
  const timerOnBar = settings.timerEnabled !== false;
  const notesOnBar = settings.notesEnabled !== false;
  const angleOnBar = settings.angleFinderEnabled === true;

  const barSlots = [
    { key: 'timer', on: timerOnBar, html: `<button class="hb-btn" id="hbTimerBtn" data-hb-key="timer" aria-label="Timer">Timer</button>` },
    { key: 'notes', on: notesOnBar, html: `<button class="hb-btn" id="hbNotesBtn" data-hb-key="notes" aria-label="Notes">Notes</button>` },
    { key: 'angle', on: angleOnBar, html: `<button class="hb-btn" id="hbAngleBtn" data-hb-key="angle" aria-label="Bench Angle">Angle</button>` }
  ].sort((a, b) => settings.hotbarOrder.indexOf(a.key) - settings.hotbarOrder.indexOf(b.key));
  const barItemsList = barSlots.filter(item => item.on);
  const barItems = barItemsList.length;
  if (barItems === 0) {
    hotbar.innerHTML = '';
    hotbar.classList.add('hb-empty');
  } else {
    hotbar.classList.remove('hb-empty');
    hotbar.innerHTML = `
      <div class="hb-pill ${barItems === 1 ? 'hb-single' : ''}">
        ${barItemsList.map(item => item.html).join('')}
      </div>`;
  }

  hbTimerBtn = document.getElementById('hbTimerBtn');
  hbNotesBtn = document.getElementById('hbNotesBtn');
  hbAngleBtn = document.getElementById('hbAngleBtn');
  const timerTap = (e) => {
    ensureAudioCtx();
    // When both are running, the pill shows two slots (Timer / SW). Tap
    // one and the panel opens straight to that tab, instead of whichever
    // tab happened to be selected last. Tapping the same slot again while
    // it's already showing closes the panel, same as a normal toggle tap.
    const slot = e && e.target && e.target.closest ? e.target.closest('.hb-slot') : null;
    const wantMode = slot ? slot.dataset.kind : null;
    if (wantMode) {
      if (rwOpen && rwMode === wantMode) { rwClosePanel(); return; }
      if (rwMode !== wantMode) { rwMode = wantMode; saveJSON('rwMode', rwMode); }
      if (!rwOpen) rwOpenPanel(); else { rwRenderPanel(); rwPositionPanel(); updateHotbarTimerLabel(); }
      return;
    }
    if (rwOpen) rwClosePanel(); else rwOpenPanel();
  };
  const notesTap = () => {
    if (notesOpen) closeNotesPanel(); else openNotesPanel();
  };
  const angleTap = () => {
    if (angleOpen) closeAnglePanel(); else openAnglePanel();
  };
  if (hbTimerBtn) {
    hbTimerBtn.onclick = (e) => {
      if (hbSuppressClick) { hbSuppressClick = false; return; }
      timerTap(e);
    };
  }
  if (hbNotesBtn) {
    hbNotesBtn.onclick = () => {
      if (hbSuppressClick) { hbSuppressClick = false; return; }
      notesTap();
    };
  }
  if (hbAngleBtn) {
    hbAngleBtn.onclick = () => {
      if (hbSuppressClick) { hbSuppressClick = false; return; }
      angleTap();
    };
  }
  // If a feature just got turned off while its panel was open, that
  // trigger no longer exists — close the now-orphaned panel instead of
  // leaving it stranded.
  if (rwOpen && !hbTimerBtn) rwClosePanel();
  if (notesOpen && !hbNotesBtn) closeNotesPanel();
  if (angleOpen && !hbAngleBtn) closeAnglePanel();

  placeHotbar();
  updateHotbarTimerLabel();
}

function updateHotbarTimerLabel() {
  if (hbTimerBtn) {
    const states = rwFabStates();
    // "Shape" = which layout is showing (dual slots / a single value for
    // one specific kind / idle text). This runs on every 250ms tick, and
    // only the numbers actually change tick to tick — the shape itself
    // only changes on a real state transition (something starts/stops).
    // Rebuilding the DOM every tick regardless was exactly the earlier
    // "panel eats your tap" bug, just showing up here now: the very
    // .hb-slot elements a finger is trying to tap were getting torn down
    // and recreated ~4x/second, so a touch could land right as its target
    // vanished and never register. Same fix as before — only replace the
    // DOM on an actual shape change; on an unchanged shape, just patch the
    // existing nodes' text.
    let shape, primary = null;
    if (states.length === 2) {
      shape = 'dual';
    } else if (states.length > 0) {
      primary = states.find(s => s.kind === 'timer') || states[0];
      shape = 'single:' + primary.kind;
    } else {
      shape = 'idle:text';
    }
    if (hbTimerBtn.dataset.hbShape !== shape) {
      hbTimerBtn.dataset.hbShape = shape;
      if (shape === 'dual') {
        // Both running/paused at once — two compact slots side by side
        // instead of the single stacked time+tag, so neither one gets
        // hidden behind the other.
        hbTimerBtn.innerHTML = states.map(s => `<span class="hb-slot" data-kind="${s.kind}"><span class="hb-time">${s.text}</span><span class="hb-mode-tag">${s.kind === 'stopwatch' ? 'SW' : 'Timer'}</span></span>`).join('');
      } else if (shape.startsWith('single:')) {
        // Single value (or the small widget circle, which has no room for
        // two — it shows the countdown, since it's the one with a
        // deadline, and the hotbar/panel carry the full picture when both
        // are active).
        const modeLabel = primary.kind === 'stopwatch' ? 'Stopwatch' : 'Timer';
        hbTimerBtn.innerHTML = `<span class="hb-time">${primary.text}</span><span class="hb-mode-tag">${modeLabel}</span>`;
      } else {
        hbTimerBtn.textContent = rwMode === 'stopwatch' ? 'Stopwatch' : 'Timer';
      }
    } else if (shape === 'dual') {
      const timeEls = hbTimerBtn.querySelectorAll('.hb-time');
      if (timeEls[0]) timeEls[0].textContent = states[0].text;
      if (timeEls[1]) timeEls[1].textContent = states[1].text;
    } else if (shape.startsWith('single:')) {
      const timeEl = hbTimerBtn.querySelector('.hb-time');
      if (timeEl) timeEl.textContent = primary.text;
    }
    hbTimerBtn.classList.toggle('hb-running', states.length > 0);
    hbTimerBtn.classList.toggle('hb-dual', shape === 'dual');
  }
  // Deliberately NOT calling rwRenderPanel() here. This function runs on
  // every 250ms tick of whichever clock is active (via updateRestDisplay/
  // updateStopwatchDisplay below) — a full panel rebuild on that cadence
  // was blowing away in-progress interaction inside the open panel: typing
  // into the rest-duration field got reset every quarter-second (the input
  // re-renders back to the last committed value), and a Pause/Reset tap
  // could land on a button that got replaced out from under the touch
  // mid-tap. That happened whether the panel was showing the clock that
  // was actually ticking OR the other one — either way this function fired
  // on every tick and unconditionally rebuilt whatever tab was open.
  // The live countdown/stopwatch text still updates every tick via
  // syncRestDisplayText()/updateStopwatchDisplay() directly patching the
  // bound elements' textContent, so nothing goes stale — the fix is just
  // to stop the wholesale DOM replacement. Call sites that actually change
  // state (start/pause/resume/reset, switching Timer/Stopwatch tabs, the
  // countdown completing on its own) already call rwRenderPanel() where
  // that state change happens.
}

/* Reads the browser's live safe-area-inset-bottom into a stable, JS-owned
   custom property (--safe-bottom-cached) instead of letting #hotbar's own
   position rule reference env() directly. On Android WebViews that live
   value has been observed to transiently glitch — briefly reporting a
   smaller inset — during events that have nothing to do with the actual
   viewport changing (the hotbar's DOM being rebuilt on foreground/resume,
   a Settings toggle, etc). Wired straight to env(), the hotbar would sink
   toward the screen edge for that instant and then snap back up once the
   real value resolved. Only calling this from genuine resize/orientation
   events (not from every re-render) means the cached value — and the
   hotbar's position — simply can't be disturbed by anything else. */
function cacheSafeAreaBottom() {
  let probe = document.getElementById('__safeAreaProbe');
  if (!probe) {
    probe = document.createElement('div');
    probe.id = '__safeAreaProbe';
    probe.style.cssText = 'position:fixed; left:0; bottom:0; width:0; height:0; padding-bottom:env(safe-area-inset-bottom); pointer-events:none; visibility:hidden;';
    document.body.appendChild(probe);
  }
  const val = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
  document.documentElement.style.setProperty('--safe-bottom-cached', val + 'px');
}
cacheSafeAreaBottom();
// One extra safety-net measurement shortly after cold boot: on a fresh
// launch the very first reading above can run before the WebView has
// finished settling its real safe-area values, and unlike a keyboard
// open/close this case has no resize event to trigger a correction later.
setTimeout(() => { cacheSafeAreaBottom(); updateHotbarReservedSpace(); }, 500);

/* Bottom-only hotbar placement: fixed just above the home indicator /
   gesture bar. #app gets matching reserved padding so content never sits
   underneath it. Called on boot, whenever a relevant setting changes, and
   after login. */
function placeHotbar() {
  const container = document.getElementById('hotbar');
  const app = document.getElementById('app');
  if (!container || !app) return;
  const hotbarHasContent = !container.classList.contains('hb-empty') && !container.classList.contains('hb-hidden');
  container.classList.add('hb-pos-bottom');
  app.classList.remove('app-hb-bottom', 'app-hb-none');
  app.classList.add(hotbarHasContent ? 'app-hb-bottom' : 'app-hb-none');
  if (rwOpen) rwPositionPanel();
  if (notesOpen) positionNotesPanel();
  // Measure synchronously, not on the next frame. getBoundingClientRect()
  // forces the browser to flush layout immediately, so it already reflects
  // the class changes just made above — deferring this to
  // requestAnimationFrame let one frame paint with the old/fallback padding
  // before snapping to the correct value, which is exactly the visible
  // "content starts high, then drops down" jump users were seeing.
  updateHotbarReservedSpace();
}

/* Reserves exactly as much scroll-content space as the hotbar actually
   occupies on THIS device, instead of a guessed px constant. env() safe-area
   values are inconsistently reported across Android WebViews/gesture-nav
   setups, which is what let scrollable content (e.g. a Delete button at the
   bottom of a long edit screen) end up rendered behind/under the fixed pill
   — the pill's z-index also sits above normal content, so an under-reserved
   gap doesn't just look wrong, it makes that content untappable too.
   getBoundingClientRect() reads the pill's real on-screen box (which already
   bakes in whatever safe-area/gesture-bar offset actually applied), so this
   self-corrects per device instead of needing a bigger and bigger guessed
   constant every time a new phone reports safe-area differently. */
function updateHotbarReservedSpace() {
  const container = document.getElementById('hotbar');
  const app = document.getElementById('app');
  if (!container || !app) return;
  const BREATHING_ROOM = 20; // visible gap beyond the pill itself — content should stop clearly above it, not flush against it
  const hotbarHasContent = !container.classList.contains('hb-empty') && !container.classList.contains('hb-hidden');
  if (!hotbarHasContent) {
    app.style.setProperty('--hotbar-reserved-bottom', '0px');
    return;
  }
  const rect = container.getBoundingClientRect();
  app.style.setProperty('--hotbar-reserved-bottom', Math.ceil(window.innerHeight - rect.top + BREATHING_ROOM) + 'px');
}
// Debounced: a keyboard opening/closing (which happens on Edit Exercise,
// Edit Logs, and any screen with a text input) fires several 'resize'
// events on the way — one per animation frame of the keyboard sliding in
// or out, not just one clean event at the end. Re-measuring on every one
// of those meant briefly caching a mid-transition (wrong) safe-area value
// and then correcting again a moment later, which is exactly the
// hotbar-sinks-then-snaps-back-up users were seeing. Waiting until the
// events stop firing for 220ms before measuring means we only ever read
// the real, settled value.
let _safeAreaResizeTimer = null;
function scheduleSafeAreaRemeasure() {
  if (_safeAreaResizeTimer) clearTimeout(_safeAreaResizeTimer);
  _safeAreaResizeTimer = setTimeout(() => {
    _safeAreaResizeTimer = null;
    cacheSafeAreaBottom();
    updateHotbarReservedSpace();
  }, 220);
}
window.addEventListener('resize', scheduleSafeAreaRemeasure);
window.addEventListener('orientationchange', scheduleSafeAreaRemeasure);

/* The hotbar/widgets (and their panels) only make sense once someone is
   signed in and past auth — hidden during loading/register/login so they
   don't appear over the splash/auth screens. */
function updateHotbarVisibility() {
  const container = document.getElementById('hotbar');
  const widgets = document.getElementById('hbWidgets');
  if (!container || !widgets) return;
  if (!loggedIn) {
    if (rwOpen) rwClosePanel();
    closeNotesPanel();
    container.classList.add('hb-hidden');
    widgets.classList.add('hb-hidden');
  } else {
    container.classList.remove('hb-hidden');
    widgets.classList.remove('hb-hidden');
  }
  // Must call placeHotbar(), not just updateHotbarReservedSpace(). The
  // #app.app-hb-bottom/app-hb-none class — which the padding CSS rule is
  // actually keyed on — is only ever set inside placeHotbar(). If
  // placeHotbar() had last run while the hotbar was still hidden (e.g.
  // during login, before this function removes hb-hidden), #app stays
  // stuck on app-hb-none forever: the --hotbar-reserved-bottom variable
  // gets computed correctly, but with no app-hb-bottom class the CSS rule
  // that reads that variable never applies, so padding-bottom silently
  // stays 0 and real content renders underneath the now-visible, higher-
  // z-index hotbar pill — present and painted, just physically covered.
  // Only calling updateHotbarReservedSpace() here fixed the variable but
  // never fixed the stale class.
  placeHotbar();
}

/* ---------- notes panel ----------
   Multiple free-form notes (e.g. a program copied over from WhatsApp),
   shown as tabs — tap a tab to switch, edits auto-save (debounced) as you
   type. Synced via the same app_state cloud-sync path as everything else
   (see CLOUD_SYNC_KEYS / pushCloudAppState). Positioned live under (or,
   if there's no room, above) whichever element currently triggers it —
   the hotbar's "notes" half, or the standalone notes widget button. */
function positionNotesPanel() {
  if (!notesPanelEl || !hbNotesBtn) return;
  // visualViewport shrinks (and offsets) when the on-screen keyboard opens;
  // window.innerHeight/vh in CSS do NOT, on most mobile browsers — using
  // those here is what let the panel stay full-screen-sized and get its
  // bottom half (textarea included) hidden behind the keyboard. Falling
  // back to window.* just means no keyboard is open / API unsupported.
  const vv = window.visualViewport;
  const w = vv ? vv.width : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  const vvTop = vv ? vv.offsetTop : 0;
  const vvLeft = vv ? vv.offsetLeft : 0;
  const panelW = Math.min(376, w - 16);
  // Keep the panel's max-height in sync with the actual visible area —
  // overrides the CSS `min(840px, 105vh)` cap, which doesn't account for
  // the keyboard eating into the viewport.
  notesPanelEl.style.maxHeight = (h - 16) + 'px';
  const rect = hbNotesBtn.getBoundingClientRect();
  // Once the panel has content, anchor using its real rendered height
  // instead of the rough estimate — a short note list shouldn't reserve
  // room (and get pushed further from the button) as if it were tall.
  const measuredH = notesPanelEl.offsetHeight;
  const panelH = Math.min(measuredH > 0 ? measuredH : Math.min(780, h), h - 16);
  let left = rect.right - panelW;
  if (left < vvLeft + 8) left = vvLeft + 8;
  if (left + panelW > vvLeft + w - 8) left = vvLeft + w - panelW - 8;
  // If the trigger button is no longer inside the visible (above-keyboard)
  // area — the common case once the keyboard is up and you've scrolled —
  // anchoring relative to it makes no sense anymore; just pin the panel
  // near the top of whatever's currently visible instead.
  const btnVisible = rect.bottom > vvTop && rect.top < vvTop + h;
  let top;
  if (!btnVisible) {
    top = vvTop + 8;
  } else {
    const spaceBelow = (vvTop + h) - rect.bottom;
    top = (spaceBelow >= panelH + 10) ? rect.bottom + 8 : Math.max(vvTop + 8, rect.top - panelH - 8);
  }
  notesPanelEl.style.left = left + 'px';
  notesPanelEl.style.top = top + 'px';
  notesPanelEl.style.width = panelW + 'px';
}
// Keeps the panel tracking the visible area live as the keyboard opens,
// closes, or the page gets scrolled to bring the focused textarea into
// view — without this, positionNotesPanel() only ever ran once, at open
// time, so the panel just sat there while the keyboard covered it.
function handleNotesViewportChange() { if (notesOpen) positionNotesPanel(); }
function attachNotesViewportListeners() {
  if (!window.visualViewport) return;
  window.visualViewport.addEventListener('resize', handleNotesViewportChange);
  window.visualViewport.addEventListener('scroll', handleNotesViewportChange);
}
function detachNotesViewportListeners() {
  if (!window.visualViewport) return;
  window.visualViewport.removeEventListener('resize', handleNotesViewportChange);
  window.visualViewport.removeEventListener('scroll', handleNotesViewportChange);
}

function openNotesPanel() {
  rwClosePanel();
  closeAnglePanel();
  notesOpen = true;
  notesOverlayEl = document.createElement('div');
  notesOverlayEl.className = 'notes-overlay';
  notesOverlayEl.onclick = () => closeNotesPanel();
  notesPanelEl = document.createElement('div');
  notesPanelEl.className = 'notes-panel';
  document.getElementById('notesRoot').appendChild(notesOverlayEl);
  document.getElementById('notesRoot').appendChild(notesPanelEl);
  positionNotesPanel();
  renderNotesPanel();
  positionNotesPanel();
  attachNotesViewportListeners();
}

function closeNotesPanel() {
  if (notesSaveDebounce) { clearTimeout(notesSaveDebounce); notesSaveDebounce = null; }
  notesOpen = false;
  detachNotesViewportListeners();
  if (notesOverlayEl) { notesOverlayEl.remove(); notesOverlayEl = null; }
  if (notesPanelEl) { notesPanelEl.remove(); notesPanelEl = null; }
}

function persistNotes() { saveJSON('notes', notes); }

function createNote() {
  const n = { id: uid(), title: 'Untitled', text: '', updatedAt: Date.now() };
  notes.push(n);
  activeNoteId = n.id;
  persistNotes();
  renderNotesPanel();
}

function deleteActiveNote() {
  if (!activeNoteId) return;
  appConfirmDelete('Delete this note?').then((ok) => {
    if (!ok) return;
    notes = notes.filter(n => n.id !== activeNoteId);
    activeNoteId = notes.length ? notes[0].id : null;
    persistNotes();
    renderNotesPanel();
  });
}

function renderNotesPanel() {
  if (!notesPanelEl) return;
  const active = notes.find(n => n.id === activeNoteId) || null;
  const tabsHtml = notes.map(n => `
    <button class="notes-tab ${n.id === activeNoteId ? 'active' : ''}" data-id="${n.id}">${(n.title || 'Untitled').replace(/</g,'&lt;')}</button>
  `).join('');
  notesPanelEl.innerHTML = `
    <div class="notes-card">
      <div class="notes-tabs">
        ${tabsHtml}
        <button class="notes-tab-add" id="notesAddBtn" aria-label="New note">+</button>
        <button class="notes-close-btn" id="notesCloseBtn" style="margin-left:auto;">&times;</button>
      </div>
      ${active ? `
        <div class="notes-body">
          <div class="notes-title-row">
            <input class="notes-title-input" id="notesTitleInput" value="${(active.title || '').replace(/"/g,'&quot;')}" placeholder="Note title">
            <button class="notes-delete-btn" id="notesDeleteBtn" title="Delete note">${ICON_TRASH_SVG}</button>
          </div>
          <textarea class="notes-textarea" id="notesTextArea" placeholder="Paste or write your program here...">${active.text || ''}</textarea>
          <div class="notes-save-state" id="notesSaveState"></div>
        </div>
      ` : `
        <div class="notes-body">
          <div class="notes-empty">
            No notes yet — add one to keep your program, cues, or anything else handy from any screen.
            <div><button class="chip wide" id="notesEmptyAddBtn">+ New note</button></div>
          </div>
        </div>
      `}
    </div>
  `;
  notesPanelEl.querySelector('#notesCloseBtn').onclick = () => closeNotesPanel();
  notesPanelEl.querySelector('#notesAddBtn').onclick = () => createNote();
  const emptyAddBtn = notesPanelEl.querySelector('#notesEmptyAddBtn');
  if (emptyAddBtn) emptyAddBtn.onclick = () => createNote();
  notesPanelEl.querySelectorAll('.notes-tab').forEach(tab => {
    tab.onclick = () => {
      activeNoteId = tab.dataset.id;
      renderNotesPanel();
    };
  });
  if (active) {
    const titleInput = notesPanelEl.querySelector('#notesTitleInput');
    const textArea = notesPanelEl.querySelector('#notesTextArea');
    const saveStateEl = notesPanelEl.querySelector('#notesSaveState');
    const scheduleSave = () => {
      if (saveStateEl) saveStateEl.textContent = 'Saving...';
      if (notesSaveDebounce) clearTimeout(notesSaveDebounce);
      notesSaveDebounce = setTimeout(() => {
        active.title = titleInput.value.trim() || 'Untitled';
        active.text = textArea.value;
        active.updatedAt = Date.now();
        persistNotes();
        // Only the tab label needs to reflect a title change live; re-rendering
        // the whole panel here would steal focus mid-type.
        const tabEl = notesPanelEl.querySelector(`.notes-tab[data-id="${active.id}"]`);
        if (tabEl) tabEl.textContent = active.title;
        if (saveStateEl) saveStateEl.textContent = 'Saved';
      }, 500);
    };
    titleInput.oninput = scheduleSave;
    textArea.oninput = scheduleSave;
    notesPanelEl.querySelector('#notesDeleteBtn').onclick = () => deleteActiveNote();
  }
}

/* ---------- boot ---------- */
// loadJSON is just a localStorage read under the hood (see its definition
// above), so it's available synchronously here — pull the user's saved
// settings into the module-level `settings` var *before* initHotbar()'s
// first placeHotbar() call. Hotbar is bottom-only, so there's no position
// to migrate anymore.
settings = loadJSON('settings', settings);
delete settings.hotbarPosition; // drop any legacy saved value
// refreshHotbarLayout() indexes into hotbarOrder directly (no defensive
// check), so this migration — normally done later in boot() — has to run
// here too, or a settings object saved before hotbarOrder existed crashes
// the very first placeHotbar() call with "Cannot read properties of
// undefined (reading 'indexOf')".
if (!Array.isArray(settings.hotbarOrder)) settings.hotbarOrder = ['timer', 'notes', 'angle'];
else ['timer', 'notes', 'angle'].forEach(k => { if (!settings.hotbarOrder.includes(k)) settings.hotbarOrder.push(k); });
initHotbar();
initRestWidget();
boot();
// Instant press feedback for icon buttons — CSS :active can lag on touch
// devices (browsers wait a beat to rule out a scroll gesture), so we flip
// a class ourselves on pointerdown, which always fires immediately.
const ICON_BTN_SELECTOR = '.icon-square-btn, .icon-edit-btn, .gear-btn, .lightbox-close, .back-btn';
document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest(ICON_BTN_SELECTOR);
  if (btn) btn.classList.add('is-pressed');
}, true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  document.addEventListener(evt, () => {
    document.querySelectorAll('.is-pressed').forEach(el => el.classList.remove('is-pressed'));
  }, true);
});
</script>
</body>
</html>
