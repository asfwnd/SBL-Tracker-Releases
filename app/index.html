<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SBL Tracker</title>
<style>
  :root {
    --bg: #0a0f0f; --panel: #10181a; --panel-2: #141f21; --border: #1e2c2d; --btn-bg: transparent;
    --teal: #14f0cc; --teal-dim: #159685; --teal-glow: rgba(20,240,204,0.5);
    --text: #e4efed; --text-dim: #6e8886; --amber: #e0a860; --danger: #e5484d; --danger-glow: rgba(229,72,77,0.5);
    --gold: #ffcf5c; --gold-glow: rgba(255,207,92,0.5); --blue: #7ab8f5; --blue-glow: rgba(122,184,245,0.4);
    --ease-glide: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-press: cubic-bezier(0.32, 0, 0.67, 0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* Hide scrollbars everywhere — any element that scrolls (the page itself,
     modals, media lists, etc.) still scrolls fine via touch/wheel, it just
     never shows the OS/browser scrollbar track. */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  html, body { height: 100%; background: var(--bg); overscroll-behavior: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  ::placeholder { color: #3d5250; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #app * { min-width: 0; }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 0 18px 30px; }
  .screen.centered { justify-content: center; }
  .screen.anim-default { animation: fadeIn 0.56s var(--ease-glide); }
  .screen.anim-slide-back { animation: slideBack 0.62s var(--ease-glide); }
  .screen.anim-slide-forward { animation: slideForward 0.62s var(--ease-glide); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(22px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes slideBack { from { opacity: 0; transform: translateX(-9%) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes slideForward { from { opacity: 0; transform: translateX(9%) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }

  button { touch-action: manipulation; transition: transform .48s var(--ease-bounce), opacity .38s var(--ease-glide), box-shadow .42s var(--ease-glide), border-color .38s var(--ease-glide), background-color .38s var(--ease-glide); }
  button:active { transform: scale(0.895); transition: transform .14s var(--ease-press), opacity .14s var(--ease-press), box-shadow .14s var(--ease-press), border-color .14s var(--ease-press), background-color .14s var(--ease-press); }

  .eyebrow { font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--teal); font-weight: 800;
    text-shadow: 0 0 14px var(--teal-glow);
    padding-top: max(env(safe-area-inset-top), 34px); margin-bottom: 6px; display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
  .back-btn { background: none; border: none; color: var(--teal); cursor: pointer; padding: 6px 16px 6px 0;
    display: inline-flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0 8px var(--teal-glow));
    transition: transform .48s var(--ease-bounce), opacity .38s var(--ease-glide); }
  .back-btn svg { width: 34px; height: 34px; }
  .back-btn:active, .back-btn.is-pressed { transform: scale(0.79); opacity: 0.7; transition: transform .14s var(--ease-press), opacity .14s var(--ease-press); }

  .gear-btn { background: var(--btn-bg); border: none; color: var(--teal); font-size: 18px; border-radius: 14px; width: 42px; height: 42px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: none; transition: transform .48s var(--ease-bounce), border-color .38s var(--ease-glide), color .38s var(--ease-glide); }
  .gear-btn:active, .gear-btn.is-pressed { border-color: var(--border); color: var(--teal); transform: scale(0.82) rotate(-27deg); transition: transform .14s var(--ease-press), border-color .14s var(--ease-press), color .14s var(--ease-press); }
  .home-topbar { display: flex; justify-content: space-between; align-items: center; padding-top: max(env(safe-area-inset-top), 22px); }
  .time-readout { font-family: "SF Mono", ui-monospace, monospace; font-size: 44px; font-weight: 700; color: var(--teal); text-shadow: 0 0 24px var(--teal-glow); letter-spacing: 0.01em; margin: 26px 0 4px; }
  .date-readout { color: var(--text-dim); font-size: 19.5px; margin-bottom: 30px; }
  .yn-row { display: flex; gap: 12px; margin-top: 4px; margin-bottom: 8px; }
  #resumeBtn { margin-bottom: 22px; }
  .yn-btn { flex: 1; height: 54px; padding: 0 12px; border-radius: 14px; border: 1.75px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .48s var(--ease-bounce), box-shadow .42s var(--ease-glide), border-color .38s var(--ease-glide); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .yn-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .yn-btn.yes { border-color: var(--border); color: var(--teal); box-shadow: none; }
  .yn-btn.yes:active { box-shadow: none; transform: scale(0.91); transition: transform .14s var(--ease-press), box-shadow .14s var(--ease-press); }
  .progress-card { touch-action: manipulation; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 9px; cursor: pointer; transition: transform .38s var(--ease-bounce), border-color .3s var(--ease-glide); }
  .progress-card:active { transform: scale(0.97); transition: transform .14s var(--ease-press); }
  .progress-card .pc-name { font-size: 15px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
  .progress-card .pc-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .progress-card .pc-arrow { color: var(--text-dim); font-size: 17px; }
  .progress-help { font-size: 12.5px; color: var(--text-dim); margin: -4px 0 12px; line-height: 1.45; }
  .badge { font-family: "SF Mono", ui-monospace, monospace; font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 9px; white-space: nowrap; }
  .badge.up { color: var(--teal); background: rgba(20,240,204,0.16); box-shadow: 0 0 10px -4px var(--teal-glow); }
  .badge.down { color: var(--danger); background: rgba(229,72,77,0.14); }
  .badge.flat { color: var(--text-dim); background: var(--panel-2); }

  .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 26px; }
  .section-header-row h1.big { margin: 0; }
  .icon-edit-btn { background: var(--btn-bg); border: none; color: var(--teal); border-radius: 13px;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: none; flex-shrink: 0; }
  .icon-edit-btn svg { width: 24px; height: 24px; }
  .icon-edit-btn:active, .icon-edit-btn.is-pressed { transform: scale(0.775) rotate(-12deg); transition: transform .14s var(--ease-press); }
  .icon-edit-btn.danger { border-color: var(--border); color: var(--danger); box-shadow: none; }
  .icon-edit-btn.text-mode { width: auto; padding: 0 18px; font-size: 15px; font-weight: 700; }
  .icon-edit-btn.text-mode:active { transform: scale(0.94); }

  .btn-media { width: 100%; background: var(--panel); border: 1.75px solid var(--border); color: var(--text-dim);
    padding: 14px; border-radius: 13px; font-size: 14px; cursor: pointer; margin-top: 14px; font-weight: 600; }
  .btn-media:active { border-color: #3d5250; transform: scale(0.955); }

  .media-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .media-thumb { position: relative; width: 76px; height: 76px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--panel-2); }
  .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media-thumb .rm { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff;
    border: none; border-radius: 6px; font-size: 11.5px; width: 18px; height: 18px; cursor: pointer; line-height: 1;
    box-shadow: 0 0 8px -2px var(--danger-glow); }

  .set-media-btn { background: var(--btn-bg); border: none; color: var(--teal); border-radius: 11px;
    width: 100%; align-self: stretch; min-height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: none; position: relative; }
  .set-media-btn svg { width: 24px; height: 24px; position: relative; top: -2px; }
  .set-media-btn.has-media { border-color: var(--border); }
  .set-media-btn .dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal-glow); }

  .log-media-thumb { width: 84px; height: 84px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--panel-2); display: inline-block; }
  .log-media-thumb img, .log-media-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .log-media-tag { font-size: 11.5px; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; display: inline-block; }

  h1.big { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 34px 0 26px; letter-spacing: -0.01em; }
  h1.brand { font-size: 34px; font-weight: 800; text-align: center; color: var(--teal); text-shadow: 0 0 30px var(--teal-glow); letter-spacing: 0.02em; }
  .loading-wrap { display: flex; flex-direction: column; align-items: center; }
  .loading-sub { color: #fff; font-size: 15px; font-weight: 500; letter-spacing: 0.02em; margin-top: 32px; }
  .loading-spinner { margin-top: 16px; width: 32px; height: 32px; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0) 0%, #ffffff 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3.5px));
    animation: spin 0.85s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p.sub { color: var(--text-dim); font-size: 15px; margin-bottom: 22px; line-height: 1.5; }

  .field-block { margin-bottom: 14px; }
  label.lbl { font-size: 11.5px; color: var(--text-dim); display: block; margin: 0 0 6px; letter-spacing: 0.05em; text-transform: uppercase; }
  input, select, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 13px 12px; border-radius: 12px; font-size: 16px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--border); }

  .btn-primary {
    width: 100%; height: 54px; background: var(--teal); color: #06201c; border: none; padding: 0 16px;
    border-radius: 13px; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 14px;
    box-shadow: 0 6px 22px -8px var(--teal-glow); display: flex; align-items: center; justify-content: center;
  }
  .btn-primary:active { transform: translateY(1.5px) scale(0.94); transition: transform .14s var(--ease-press); }
  .btn-primary.ghost { background: none; border: 1.75px solid var(--border); color: var(--teal); box-shadow: none; }
  .btn-secondary {
    width: 100%; background: none; border: 1.75px solid var(--border); color: var(--text-dim);
    padding: 14px; border-radius: 13px; font-size: 15px; cursor: pointer; margin-top: 10px;
  }
  .btn-danger { color: var(--danger); border-color: var(--border); box-shadow: none; }
  .btn-tertiary {
    width: 100%; background: rgba(20,240,204,0.08); border: 1.75px solid var(--border); color: var(--teal);
    padding: 14px; border-radius: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: transform .48s var(--ease-bounce), border-color .38s var(--ease-glide), background-color .38s var(--ease-glide);
  }
  .btn-tertiary svg { width: 17px; height: 17px; flex-shrink: 0; }
  .btn-tertiary:active { transform: scale(0.965); background: rgba(20,240,204,0.16); transition: transform .14s var(--ease-press), background-color .14s var(--ease-press); }
  .link-quiet { display: block; text-align: center; margin-top: 20px; color: var(--text-dim); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .update-banner { background: var(--teal); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px 0;
    box-shadow: 0 6px 22px -8px var(--teal-glow); }
  .update-banner-text { color: #06201c; font-size: 14.5px; font-weight: 800; text-align: center; margin-bottom: 11px; line-height: 1.3; }
  .update-banner-actions { display: flex; gap: 10px; }
  .update-banner-btn { flex: 1; border: none; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .update-banner-btn.yes { background: #06201c; color: var(--teal); }
  .update-banner-btn.later { background: rgba(6,32,28,0.18); color: #06201c; }
  .update-banner-btn:active { transform: scale(0.965); transition: transform .14s var(--ease-press); }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 6px; }
  .chip { padding: 15px 20px; border-radius: 14px; border: 1.75px solid var(--border); background: var(--panel); color: var(--teal); font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: none; transition: transform .48s var(--ease-bounce), border-color .38s var(--ease-glide), color .38s var(--ease-glide), background-color .38s var(--ease-glide), box-shadow .42s var(--ease-glide); }
  .chip:active { border-color: var(--border); transform: scale(0.91); transition: transform .14s var(--ease-press), border-color .14s var(--ease-press); }
  .chip.selected { border-color: var(--border); color: var(--teal); background: rgba(20,240,204,0.16); box-shadow: none; }
  .chip.previewing, .list-item.previewing { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal-glow); }
  .preview-ind { display: inline-block; font-size: 11px; opacity: 0.75; letter-spacing: 0; margin-left: 2px; }
  .chip.wide { width: 100%; text-align: center; }

  .select-list { display: flex; flex-direction: column; }
  .select-btn {
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; border: none; cursor: pointer;
    background: var(--teal); color: #06201c;
    padding: 18px 18px; border-radius: 14px; margin-bottom: 14px;
    font-size: 16px; font-weight: 700;
    box-shadow: 0 6px 20px -8px var(--teal-glow);
    transition: transform .48s var(--ease-bounce), box-shadow .42s var(--ease-glide), opacity .38s var(--ease-glide);
  }
  .select-btn:active { transform: scale(0.925); box-shadow: 0 3px 14px -6px var(--teal-glow); transition: transform .14s var(--ease-press), box-shadow .14s var(--ease-press); }
  .select-btn .sb-name { display: flex; align-items: center; gap: 10px; }
  .select-btn .sb-arrow { font-size: 20px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .select-btn .li-check { color: #06201c; font-size: 16px; }
  .select-btn.ex-pick { background: var(--panel); color: var(--teal); border: 1.75px solid var(--border); box-shadow: none; padding: 12px 16px; margin-bottom: 8px; font-size: 15px; }
  .select-btn.ex-pick:active { box-shadow: none; }
  .select-btn.ex-pick .li-check { color: var(--teal); }
  .select-btn .li-progress-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); flex-shrink: 0; animation: pulseDot 1.1s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .list-item { touch-action: manipulation; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 16px; background: var(--panel); border: 1.75px solid var(--border); border-radius: 14px; margin-bottom: 15px; cursor: pointer; box-shadow: none; transition: transform .48s var(--ease-bounce), border-color .38s var(--ease-glide), box-shadow .42s var(--ease-glide), background-color .38s var(--ease-glide); }
  #exerciseDayList .list-item { margin-bottom: 9px; }
  .list-item:not(.static):not(.dragging):active { transform: scale(0.955); transition: transform .14s var(--ease-press); }
  .list-item.static { border-color: var(--border); box-shadow: none; cursor: default; }
  .list-item .li-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
  .list-item:not(.static) .li-name { color: var(--teal); }
  .list-item .li-check { color: var(--teal); font-size: 16px; }
  .list-item .li-meta { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .list-item .li-right { display: flex; gap: 10px; align-items: center; color: var(--text-dim); flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .drag-handle { background: none; border: none; color: var(--text-dim); cursor: grab; padding: 6px 10px 6px 0; margin-right: 2px; display: flex; align-items: center; justify-content: center; touch-action: none; flex-shrink: 0; transition: color .38s var(--ease-glide), transform .48s var(--ease-bounce); }
  .drag-handle:active { cursor: grabbing; color: var(--teal); transform: scale(1.225); transition: color .14s var(--ease-press), transform .14s var(--ease-press); }
  .list-item.dragging { border-color: var(--border); box-shadow: 0 10px 26px -6px rgba(0,0,0,0.55); cursor: grabbing; }
  .list-item.item-entering { animation: itemSlideUp 0.42s var(--ease-glide); }
  @keyframes itemSlideUp { from { opacity: 0; transform: translateY(28px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .list-item.item-removing { animation: itemSlideOut 0.32s var(--ease-glide) forwards; pointer-events: none; }
  @keyframes itemSlideOut { from { opacity: 1; transform: scale(1); max-height: 200px; margin-bottom: 15px; } to { opacity: 0; transform: scale(0.9); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; } }

  .list-item.compact { padding: 9px 14px; margin-bottom: 7px; }
  .list-item.compact .li-name { font-size: 15px; }

  .row-inline { display: flex; gap: 8px; align-items: stretch; }
  .icon-btn { display: flex; align-items: center; justify-content: center; background: var(--btn-bg); border: none; color: var(--text-dim); border-radius: 11px; padding: 8px 13px; font-size: 15px; cursor: pointer; flex-shrink: 0; }
  .icon-btn[data-act="rename"] { padding: 8px 11px; font-size: 14px; }
  .icon-btn.danger { color: var(--danger); border-color: var(--border); box-shadow: none; }
  .row-inline #newExBtn { padding: 8px 22px; }
  .uni-toggle { display: flex; align-items: center; justify-content: center; background: var(--btn-bg); border: none; color: var(--text-dim); border-radius: 11px; padding: 8px 13px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: border-color .38s var(--ease-glide), color .38s var(--ease-glide), background-color .38s var(--ease-glide); }
  .uni-toggle.on { border-color: var(--border); color: var(--teal); background: rgba(20,240,204,0.14); }
  .uni-tag { font-size: 11px; color: var(--teal-dim); border: 1px solid var(--border); border-radius: 8px; padding: 2px 6px; margin-left: 8px; }

  .ex-pick-search-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 10px; margin-bottom: 4px; }
  .ex-pick-search-wrap input { font-size: 15.5px; }
  .ex-pick-group-label { font-size: 14px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--teal); margin: 12px 0 6px; }
  .ex-pick-group-label:first-child { margin-top: 4px; }
  .ex-pick-row { touch-action: manipulation; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 13px; background: var(--panel); border: 1.75px solid var(--border); border-radius: 13px;
    margin-bottom: 6px; cursor: pointer; color: var(--text); font-size: 15px; font-weight: 600;
    transition: transform .3s var(--ease-bounce), border-color .3s var(--ease-glide), color .3s var(--ease-glide), background-color .3s var(--ease-glide); }
  .ex-pick-row:active { transform: scale(0.97); }
  .ex-pick-row.selected { color: var(--teal); border-color: var(--border); background: rgba(20,240,204,0.16); font-weight: 700; }
  .ex-pick-row .ex-pick-name { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-pick-row .ex-pick-check { flex-shrink: 0; color: var(--teal); }
  .ex-pick-row .uni-toggle { padding: 6px 10px; font-size: 12px; }
  .ex-pick-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ex-pick-drag { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
    color: var(--teal); cursor: grab; touch-action: none; flex-shrink: 0; }

  .rw-panel {
    position: fixed; z-index: 245; width: 220px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; box-shadow: 0 14px 34px -10px rgba(0,0,0,0.55);
    animation: rwPanelIn .28s var(--ease-glide);
  }
  @keyframes rwPanelIn { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .rw-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .rw-panel-title { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
  .rw-panel-close { background: none; border: none; color: var(--text-dim); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
  .rw-mode-toggle { display: flex; gap: 4px; background: #041413; border: 1px solid var(--border); border-radius: 11px; padding: 3px; margin-bottom: 14px; }
  .rw-mode-btn { flex: 1; background: none; border: none; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 7px 6px; border-radius: 8px; cursor: pointer; }
  .rw-mode-btn.active { background: var(--teal); color: #06201c; }
  .rw-display { font-family: "SF Mono", ui-monospace, monospace; font-size: 34px; font-weight: 800; color: var(--teal); text-align: center; margin-bottom: 12px; }
  .rw-panel.rw-paused-state .rw-display { color: var(--amber); }
  .rw-dur-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .rw-dur-btn { width: 30px; height: 30px; border-radius: 9px; background: var(--btn-bg); border: none; color: var(--text-dim); font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rw-dur-input { width: 64px; text-align: center; background: #041413; border: 1px solid var(--border); color: var(--text); padding: 8px 4px; border-radius: 10px; font-size: 16px; font-family: inherit; }
  .rw-btn-row { display: flex; gap: 8px; }
  .rw-btn { flex: 1; padding: 11px 8px; border-radius: 11px; border: none; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  .rw-btn-primary { background: var(--teal); color: #06201c; }
  .rw-btn-ghost { background: var(--btn-bg); border: none; color: var(--text-dim); }
  .media-thumb-wrap { position: relative; display: inline-block; }
  .media-thumb-del { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--danger); color: #fff; border: 2px solid var(--bg); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0;
    box-shadow: 0 0 8px -2px var(--danger-glow); }
  .add-media-btn { width: 84px; height: 84px; border-radius: 12px; border: 1.75px dashed var(--border);
    background: var(--btn-bg); color: var(--teal); display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 300; cursor: pointer; flex-shrink: 0; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f0f">
<!-- iOS doesn't read manifest.json for install behavior — it needs these
     specific tags to treat "Add to Home Screen" as a real full-screen app
     instead of just a bookmark with a Safari address bar. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SBL Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<script>
  // Makes the site work after the very first visit even with zero signal —
  // same "opens instantly at the gym" goal as the native app, just via a
  // browser cache instead of an installed APK. Safe to no-op inside the
  // Capacitor native app too (service workers just aren't used there).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

<script>
/* ---------- self-update system ----------
   The app is distributed as a sideloaded APK (Google Drive, not Play
   Store), and it needs to keep opening instantly even with zero signal
   (gym use) — so it can't just load itself from a website every time
   (that would mean no internet = app won't even open). Instead this uses
   the @capgo/capacitor-updater plugin's "manual" mode: the app always
   opens from what's already on the phone, and separately — only when
   there's a connection — checks a tiny hosted file for a newer version.
   If one exists, it downloads the new bundle in the background and swaps
   it in, all without ever needing the Play Store or a rebuild.

   ONE-TIME native setup required (see the setup notes given alongside
   this file) before this does anything:
     npm install @capgo/capacitor-updater
     npx cap sync
   Then rebuild the APK and share it one last time — every APK after that
   one updates itself automatically.

   UPDATE_MANIFEST_URL points at a tiny JSON file you control, e.g. hosted
   on GitHub, shaped like:
     { "version": "1.1.0", "url": "https://github.com/you/repo/releases/download/v1.1.0/dist.zip" }
   Bump APP_VERSION below to match, zip this same index.html, upload both
   to a new GitHub Release, and update this JSON file's version + url to
   point at it — that's the entire release process from then on. */
const APP_VERSION = '1.1.0';
const UPDATE_MANIFEST_URL = 'https://sbltracker.pages.dev/app/version.json';
let updateAvailableVersion = null;
let updateBundleUrl = null;

async function checkForAppUpdate() {

  try {
    const res = await fetch(UPDATE_MANIFEST_URL + (UPDATE_MANIFEST_URL.includes('?') ? '&' : '?') + '_v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const manifest = await res.json();
    if (manifest && manifest.version && manifest.url && manifest.version !== APP_VERSION) {
      updateAvailableVersion = manifest.version;
      updateBundleUrl = manifest.url;
      updateBannerDismissed = false;
      if (screen === 'home') render();

async function applyAppUpdate() {
  const CU = getCapUpdater();
  if (!CU) {
    showToast("This install can't self-update yet — it needs one more manual reinstall with the updater built in. After that, updates apply automatically.");
    return;
  }
  showProgressToast('Downloading update…');
  try {
    const bundle = await CU.download({ version: updateAvailableVersion, url: updateBundleUrl });
    hideProgressToast();
    await CU.set(bundle); // swaps in the new bundle and reloads the app right back to where it opens
  } catch (e) {
    hideProgressToast();
    showToast('Update failed: ' + (e && e.message ? e.message : e));
  }
}

function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function saveJSON(key, val) {

    localStorage.setItem(key, JSON.stringify(val));
    if (CLOUD_SYNC_KEYS.includes(key)) pushCloudAppState(key, val); // fire-and-forget, doesn't block UI
    return true;
  }
  catch (e) { showToast('Save failed'); return false; }
}

/* ---------- app_state cloud sync ----------
   programType/programDays/exercisesByDay were only ever written to
   localStorage, so a fresh device had no way to know onboarding was already
   done — it always fell through to select-program. These keys now
   also mirror to the app_state table (user_id, key, value) so any device
   can pull them down before boot() decides which screen to show. */
// Persists failures to a Supabase table instead of only console.error, which
// nobody ever sees for a real user's device. Fire-and-forget, never throws,
// never blocks the UI. Read them from the Supabase dashboard (client_errors
// table) — RLS is write-only from the client on purpose.
function logClientError(context, err) {
  try {
    console.error(context, err);
    if (!account || !account.id) return;
    const message = err && err.message ? String(err.message) : String(err);
    supabase.from('client_errors').insert({
      user_id: account.id, context, message: message.slice(0, 2000), app_version: APP_VERSION
    }).then(() => {}).catch(() => {}); // best-effort — never let logging itself throw
  } catch (e) {}
}

const CLOUD_SYNC_KEYS = ['programType', 'programDays', 'exercisesByDay', 'settings'];

async function pushCloudAppState(key, val) {
  if (!account || !account.id) return;
  try {
    const { error } = await supabase
      .from('app_state')
      .upsert({ user_id: account.id, key, value: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id,key' });
    if (error) throw error;
    const pending = await loadJSON('pendingAppState', {});
    if (key in pending) { delete pending[key]; await saveJSON('pendingAppState', pending); }
  } catch (e) {
    logClientError('pushCloudAppState:' + key, e);
    const pending = await loadJSON('pendingAppState', {});
    pending[key] = val; // last-write-wins if it fails more than once before reconnecting
    await saveJSON('pendingAppState', pending);
  }
}

// Retry any app_state pushes that failed earlier (offline, transient error).
// Called on boot and the moment connectivity returns, same as workout sync.
async function syncPendingAppState() {
  if (!account) return;
  const pending = await loadJSON('pendingAppState', {});
  for (const key of Object.keys(pending)) {
    await pushCloudAppState(key, pending[key]);
  }
}

async function pullCloudAppState() {
  if (!account || !account.id) return;
  try {
    const { data, error } = await supabase
      .from('app_state')
      .select('key, value')
      .eq('user_id', account.id)
      .in('key', CLOUD_SYNC_KEYS);
    if (error) throw error;
    const pending = await loadJSON('pendingAppState', {});
    for (const row of (data || [])) {
      if (row.key in pending) continue; // local has an unpushed change for this key — don't stomp it with a possibly-stale cloud read
      await saveJSON(row.key, row.value);
    }
  } catch (e) { logClientError('pullCloudAppState', e); }
}
function listKeys(prefix) {
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k !== null && (!prefix || k.startsWith(prefix))) keys.push(k);
    }
  } catch (e) {}
  return keys;
}

async function hashPassword(pw) {
  try {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch (e) {
    let h = 0; for (let i=0;i<pw.length;i++){ h = (h*31 + pw.charCodeAt(i)) | 0; } return 'fallback' + h;
  }
}

/* App-themed replacement for window.confirm() / prompt-with-choices — native

   app's visual identity entirely. opts is an array of {label, value, danger?}
   button descriptors; resolves with the chosen value, or null if dismissed
   via the Cancel link/backdrop. */
function showAppConfirm(message, opts, cancelable) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-card">
        <div class="confirm-msg">${message}</div>
        <div class="confirm-btns">
          ${opts.map((o, i) => `<button class="yn-btn ${o.danger ? 'danger' : 'yes'}" data-i="${i}">${o.label}</button>`).join('')}
        </div>
        ${cancelable !== false ? `<button class="confirm-cancel" id="confirmCancel">Cancel</button>` : ''}
      </div>`;
    document.body.appendChild(overlay);
    const close = (val) => { document.body.removeChild(overlay); resolve(val); };
    overlay.querySelectorAll('.confirm-btns button').forEach((b) => {
      b.onclick = () => close(opts[parseInt(b.dataset.i, 10)].value);

    const cancelBtn = overlay.querySelector('#confirmCancel');

   done for 13-15 reps. Brzycki tracks real capacity much better in that range.
   RIR/RPE (reps still "in the tank") are folded in as extra effective reps —
   a set with reps left is further from a true max than the same reps at 0 RIR,
   so it should feed a smaller 1RM estimate. RPE is converted to RIR (10-RPE)
   when RIR itself wasn't logged. Formula is undefined at 37 reps, so effective
   reps is capped at 36. */

    if (!r && !l) return 0;

    return Math.min(r, l);

/* The single set that represents an exercise's effort in a session. Picking

async function boot() {

  // isn't installed yet (pre-update-system installs).

  // splash screen right away — otherwise the OS-level splash (plain
  // background + app icon) can sit on screen for its default duration while
  // this content is already ready underneath it.

      window.Capacitor.Plugins.SplashScreen.hide();

  if (!session) { screen = 'register'; render(); return; }

  loggedIn = true;
  // Nothing in this app was ever scoped by account — log:*, settings,
  // programType/programDays/exercisesByDay, draft, bestLifts, all lived as
  // flat global keys. On a device/browser that's had a different account
  // signed in before, that meant the new login inherited the previous
  // person's workouts, settings, and program outright (this is what showed
  // up as another user's logs appearing, and as "wipes my sets/settings" —
  // it's the same bucket being overwritten both ways). Wipe the local

  if (lastAccountId === null) {

    // record of who was last signed in here, so treat it as "this account,
    // always" rather than wiping every existing user's data on their next
    // ordinary update.
    await saveJSON('lastAccountId', account.id);
  } else if (lastAccountId !== account.id) {
    const staleKeys = listKeys('').filter(k => k !== 'lastAccountId' && k !== 'rwMode');
    staleKeys.forEach(k => deleteKey(k));
    await saveJSON('lastAccountId', account.id);
  }

  // always, and anything new from the cloud (or anything that failed to
  // sync earlier, e.g. logged offline at the gym) merges in silently.

  syncPendingDeletes();
  syncPendingAppState();
  ensureOnlineSyncListener();
  ensureRealtimeSync();
  checkForAppUpdate();

  if (settings.customAlarmName === undefined) settings.customAlarmName = null;

  if (settings.autoCarry === undefined) settings.autoCarry = true;

/* If a session was left open (never hit Finish Tracking) and the calendar
   day has since rolled over, silently close it out as its own log instead
   of letting it carry into today — otherwise tapping "Track Workout" today
   resumes yesterday's half-finished session instead of starting a fresh one,
   and today's numbers get mixed into it. */
async function autoFinishStaleDraft() {
  if (!draft || !draft.startTime) return;
  const draftDateStr = new Date(draft.startTime).toISOString().slice(0, 10);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (draftDateStr === todayStr) return;

  const staleDay = draft.day;
  const cleanExercises = draft.exercises
    .map(ex => ({ name: ex.name, unilateral: !!ex.unilateral, sets: ex.sets.filter(s => !setLacksPerformanceData(s, ex.unilateral)) }))
    .filter(ex => ex.sets.length > 0);

  if (cleanExercises.length === 0) {
    draft = null;
    deleteKey('draft');
    return;
  }

  let bodyweight = draft.bodyweight;
  if (bodyweight === undefined || bodyweight === '') {
    await loadHistory();
    const prior = historyEntries.find(e => e.bodyweight !== undefined && e.bodyweight !== '');
    bodyweight = prior ? prior.bodyweight : '';
  }

  let totalVolume = 0;
  let prHit = null;
  const prevBest = await loadJSON('bestLifts', {});
  cleanExercises.forEach(ex => {
    ex.sets.forEach(s => {
      const w = parseFloat(s.weight) || 0;
      totalVolume += w * totalReps(s);
      const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
      const key = nameKey(ex.name);
      if (!prevBest[key] || est > prevBest[key]) { prevBest[key] = est; prHit = ex.name; }
    });
  });

    id: uid(), date: draftDateStr,
    day: staleDay, startTime: draft.startTime, endTime: draft.startTime,
    durationMin: 0, // real end time was never recorded — the session was closed automatically

    bodyweight,

  await saveJSON('log:' + log.id, log);
  syncWorkoutToCloud(log);
  draft = null;
  deleteKey('draft');
  showToast(`${staleDay} session from ${draftDateStr} was auto-saved`);
}

    'ap-count-switch': (r) => renderSplitCountPicker(r, { type: 'AP', max: 2, title: 'How many Anterior/Posterior splits?', isSwitch: true }),
    'fb-count-switch': (r) => renderSplitCountPicker(r, { type: 'FB', max: 4, title: 'How many Full Body templates?', isSwitch: true })
  };
  const centeredScreens = ['loading','register','login','select-program'];
  if (centeredScreens.includes(screen)) wrap.classList.add('centered');
  (map[screen] || renderLoading)(wrap);
  app.appendChild(wrap);
  // Navigating to a genuinely different screen should always start at the
  // top — otherwise the new screen inherits whatever scroll position the
  // previous (often longer) screen was left at. Same-screen re-renders
  // (toggling units, adding a set, etc.) must NOT be affected, or the page
  // would jump to the top mid-interaction, so this only fires on an actual
  // screen change.
  if (screen !== lastRenderedScreen) window.scrollTo(0, 0);
  lastRenderedScreen = screen;
  updateRestWidgetVisibility();
}

/* ---------- hardware back button ----------
   Capacitor apps commonly fire the hardware/software back button (and,
   on Android, the edge-swipe / predictive-back gesture — the OS treats
   that as the same "back invoked" signal) through TWO separate channels
   at once: the legacy Cordova-style 'backbutton' DOM event AND the modern
   Capacitor App plugin's 'backButton' event. With both wired to goBack()
   independently, a single physical back press/swipe called goBack() twice,
   which popped two screens off navStack instead of one — from anywhere
   close to the top of the stack that reads as "back button doesn't work,
   it just dumps me at home." This guard collapses any duplicate firings
   for the same press into a single navigation. */
let _lastHardwareBackAt = 0;
function handleHardwareBack() {
  const now = Date.now();
  if (now - _lastHardwareBackAt < 400) return;
  _lastHardwareBackAt = now;
  // At the root of the nav stack there's nowhere left to go back to —
  // goBack() would just silently no-op here, which is what made the
  // hardware/gesture back button feel dead on the home screen instead of
  // backgrounding the app like every other Android app does at its root.
  if (navStack.length === 0) {
    try {
      const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      if (CapApp && CapApp.minimizeApp) { CapApp.minimizeApp(); return; }
      if (CapApp && CapApp.exitApp) { CapApp.exitApp(); return; }
    } catch (e) {}
    return;
  }
  goBack();
}
document.addEventListener('backbutton', handleHardwareBack, false);
try {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
    window.Capacitor.Plugins.App.addListener('backButton', handleHardwareBack);
  }
} catch (e) {}

/* Builds the list of program days for a given split type + how many times
   the user wants to rotate through it. Each generated day name is distinct
   (e.g. "Push 1" / "Push 2"), so every split gets its own independently
   sortable and editable exercise list. */
function buildSplitDays(type, count) {
  if (type === 'PPL') {
    if (count <= 1) return ['Push','Pull','Legs'];
    const days = [];
    for (let s = 1; s <= count; s++) days.push('Push '+s, 'Pull '+s, 'Legs '+s);
    return days;
  }
  if (type === 'UL') {
    if (count <= 1) return ['Upper','Lower'];
    const days = [];
    for (let s = 1; s <= count; s++) days.push('Upper '+s, 'Lower '+s);
    return days;
  }
  if (type === 'AP') {
    if (count <= 1) return ['Anterior','Posterior'];
    const days = [];
    for (let s = 1; s <= count; s++) days.push('Anterior '+s, 'Posterior '+s);
    return days;
  }
  if (type === 'BS') {
    if (count <= 1) return ['Chest','Back','Shoulders','Arms','Legs'];
    const days = [];
    for (let s = 1; s <= count; s++) days.push('Chest '+s, 'Back '+s, 'Shoulders '+s, 'Arms '+s, 'Legs '+s);
    return days;
  }
  if (type === 'FB') {
    const days = [];
    for (let s = 1; s <= count; s++) days.push('FB'+s);
    return days;
  }
  return [];
}

/* Drag-to-reorder for the "Selected" group during exercise setup. Grabbing
   the hamburger handle and dragging up/down swaps the row's DOM position
   live as the finger crosses a neighboring row's midpoint — plain instant
   swaps, no floating/animation, so no re-render is needed mid-drag (which
   would drop pointer capture). setupTemp's order is resynced from the
   final DOM order once per drag, on release. */
function attachExPickDrag(listEl) {
  listEl.querySelectorAll('[data-act="drag"]').forEach(handle => {
    handle.onpointerdown = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const row = handle.closest('.ex-pick-row');
      row.classList.add('ex-dragging');
      handle.setPointerCapture(e.pointerId);
      const onMove = (ev) => {
        const y = ev.clientY;
        const siblings = Array.from(listEl.querySelectorAll('.ex-pick-row.selected')).filter(r => r !== row);
        for (const sib of siblings) {
          const r = sib.getBoundingClientRect();
          const mid = r.top + r.height / 2;
          const sibIsAfterRow = !!(row.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
          if (sibIsAfterRow && y > mid) listEl.insertBefore(row, sib.nextSibling);
          else if (!sibIsAfterRow && y < mid) listEl.insertBefore(row, sib);
        }
      };
      const onUp = (ev) => {
        row.classList.remove('ex-dragging');
        try { handle.releasePointerCapture(ev.pointerId); } catch (e) {}
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        const newOrder = Array.from(listEl.querySelectorAll('.ex-pick-row.selected')).map(r => r.dataset.name);
        setupTemp.sort((a, b) => newOrder.indexOf(a.name) - newOrder.indexOf(b.name));
      };
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    };
  });
}
function renderExPickList(root, day) {
  const listEl = root.querySelector('#exPickList');
  const q = setupSearchQuery.trim().toLowerCase();
  const cats = categoriesForDay(day);
  const seen = new Set();
  const pool = [];
  EXERCISE_LIBRARY_FLAT.filter(item => cats.includes(item.category)).forEach(item => {
    const k = nameKey(item.name);
    if (!seen.has(k)) { seen.add(k); pool.push(item); }
  });
  const selectedKeys = new Set(setupTemp.map(e => nameKey(e.name)));
  const matches = (name) => !q || name.toLowerCase().startsWith(q) ||
    name.toLowerCase().split(/[\s(),/-]+/).some(word => word.startsWith(q));
  let html = '';
  if (setupTemp.length > 0) {
    html += `<div class="ex-pick-group-label">Selected</div>`;
    setupTemp.forEach(entry => {
      html += `<div class="ex-pick-row selected" data-act="deselect" data-name="${entry.name.replace(/"/g,'&quot;')}">
        <span class="ex-pick-name"><span class="ex-pick-check">✓</span>${entry.name}</span>
        <div class="ex-pick-row-right">
          <button class="uni-toggle no-pop ${entry.unilateral ? 'on' : ''}" data-act="uni" data-name="${entry.name.replace(/"/g,'&quot;')}" title="One side at a time, tracked as separate R/L reps">Uni</button>
          <span class="ex-pick-drag" data-act="drag" data-name="${entry.name.replace(/"/g,'&quot;')}" title="Drag to reorder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </span>
        </div>
      </div>`;
    });
  }
  const availableByCat = {};
  pool.forEach(item => {
    if (selectedKeys.has(nameKey(item.name))) return;
    if (!matches(item.name)) return;
    (availableByCat[item.category] = availableByCat[item.category] || []).push(item);
  });
  const catOrder = [...cats];
  let anyAvailable = false;
  catOrder.forEach(cat => {
    const items = availableByCat[cat];
    if (!items || items.length === 0) return;
    anyAvailable = true;
    html += `<div class="ex-pick-group-label">${cat}</div>`;
    items.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
      html += `<div class="ex-pick-row" data-act="select" data-name="${item.name.replace(/"/g,'&quot;')}">
        <span class="ex-pick-name">${item.name}</span>
      </div>`;
    });
  });
  if (q && !pool.some(item => nameKey(item.name) === nameKey(setupSearchQuery.trim()))) {
    html += `<div class="ex-pick-row ex-pick-add-row" data-act="add-custom">+ Add "${setupSearchQuery.trim()}" as a new exercise</div>`;
  } else if (!anyAvailable && setupTemp.length === 0) {
    html += `<div class="ex-pick-empty">No matching exercise</div>`;
  }
  listEl.innerHTML = html;
  listEl.querySelectorAll('[data-act="select"]').forEach(row => {
    row.onclick = () => {
      setupTemp.unshift({ name: row.dataset.name, unilateral: false });
      renderExPickList(root, day);
    };
  });
  listEl.querySelectorAll('[data-act="deselect"]').forEach(row => {
    row.onclick = (e) => {
      if (e.target.closest('[data-act="uni"]') || e.target.closest('[data-act="drag"]')) return;
      const i = setupTemp.findIndex(x => sameExName(x.name, row.dataset.name));
      if (i > -1) setupTemp.splice(i, 1);
      renderExPickList(root, day);
    };
  });
  attachExPickDrag(listEl);
  listEl.querySelectorAll('[data-act="uni"]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const entry = setupTemp.find(x => sameExName(x.name, btn.dataset.name));
      if (entry) { entry.unilateral = !entry.unilateral; btn.classList.toggle('on', entry.unilateral); }
    };
  });
  const addRow = listEl.querySelector('[data-act="add-custom"]');
  if (addRow) addRow.onclick = () => {
    const val = setupSearchQuery.trim();
    if (!val) return;
    setupTemp.unshift({ name: val, unilateral: false });
    setupSearchQuery = '';
    root.querySelector('#exPickSearch').value = '';
    renderExPickList(root, day);
  };
}

/* Strength trend (e1RM % change) for one exercise: compares the top set in
   the given session against the exercise's all-time PR — the single best
   set ever logged for it (excluding this session), same PR definition used
   on the exercise-history screen — rather than just the previous session. */
function exerciseStrengthTrend(name, currentEntryId) {
  const current = historyEntries.find(e => e.id === currentEntryId);
  if (!current) return null;
  const curEx = (current.exercises || []).find(e => sameExName(e.name, name));
  const curTop = curEx ? topSetByEst(curEx.sets.filter(hasSetData)) : null;
  if (!curTop || !curTop.est) return null;
  let prEst = 0;
  historyEntries.forEach(session => {
    if (session.id === currentEntryId) return;
    const ex = (session.exercises || []).find(e => sameExName(e.name, name));
    if (!ex) return;
    (ex.sets || []).filter(hasSetData).forEach(s => {
      const w = parseFloat(s.weight) || 0;
      const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
      if (est > prEst) prEst = est;
    });
  });
  if (prEst <= 0) return null;
  return ((curTop.est - prEst) / prEst) * 100;
}
/* Average estimated 1RM for an exercise across every set of every other
   logged session (this session excluded) — the baseline "overall
   performance" compares against, as opposed to exerciseStrengthTrend's
   all-time-PR baseline. Averages over every individual set, not just each
   session's single top set, so a 5-set session counts 5x and a 1-set
   session counts 1x — true average output, not one cherry-picked number
   per session. */
function exerciseAverageEst(name, excludeEntryId) {
  let sum = 0, count = 0;
  historyEntries.forEach(session => {
    if (session.id === excludeEntryId) return;
    const ex = (session.exercises || []).find(e => sameExName(e.name, name));
    if (!ex) return;
    ex.sets.filter(hasSetData).forEach(s => {
      const w = parseFloat(s.weight) || 0;
      const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
      if (est) { sum += est; count++; }
    });
  });
  return count > 0 ? sum / count : null;
}
/* Overall session performance: for each exercise, this session's top set
   (by est. 1RM) is compared against that exercise's historical average
   across every set of every other session, giving a per-exercise %
   difference; those per-exercise percentages are then averaged into one
   overall session number. */
function overallPerformancePct(entry) {
  const pcts = [];
  (entry.exercises || []).forEach(ex => {
    const top = topSetByEst((ex.sets || []).filter(hasSetData));
    if (!top || !top.est) return;
    const avg = exerciseAverageEst(ex.name, entry.id);
    if (avg && avg > 0) pcts.push(((top.est - avg) / avg) * 100);
  });
  if (!pcts.length) return null;
  return pcts.reduce((a, b) => a + b, 0) / pcts.length;
}
/* Labels the home-screen card by how many calendar days back the most
   recently tracked session was — "Today's Workout" / "Yesterday's Workout"
   for the two closest cases, "Last Tracked Workout" for anything older
   (day before yesterday and beyond). */
function homeProgressLabel(dateStr) {
  const entryDate = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((today - entryDate) / 86400000);
  if (diffDays <= 0) return "Today's Workout";
  if (diffDays === 1) return "Yesterday's Workout";
  return 'Last Tracked Workout';
}

/* pct-based badge with a ~1% deadzone (see trendStatus) so noise doesn't
   flip-flop between up/down on essentially-identical numbers. */
function badgeFor(pct, label) {
  if (pct === null) return `<span class="badge flat">${label ? label + ' ' : ''}—</span>`;
  const rounded = Math.round(pct*10)/10;
  if (Math.abs(rounded) < 1) return `<span class="badge flat">${label ? label + ' ' : ''}steady</span>`;
  const sign = rounded > 0 ? '+' : '';
  const cls = rounded > 0 ? 'up' : 'down';
  return `<span class="badge ${cls}">${label ? label + ' ' : ''}${sign}${rounded}%</span>`;
}

  // been done. Untouched exercises stay below in their normal order.
  const touchedAt = new Map();
  (draft.exercises || []).forEach(ex => {
    if (exerciseHasLoggedData(ex)) touchedAt.set(ex.name, ex.lastTouched || 0);
  });
  const sortedList = [...list].sort((a, b) => {
    const aTouched = touchedAt.has(a.name), bTouched = touchedAt.has(b.name);
    if (aTouched && bTouched) return touchedAt.get(b.name) - touchedAt.get(a.name);
    if (aTouched) return -1;
    if (bTouched) return 1;
    return 0;
  });
  sortedList.forEach(item => {
    const trackEntry = draft.exercises.find(e => sameExName(e.name, item.name));
    const hasData = trackEntry && exerciseHasLoggedData(trackEntry);
    const isDone = hasData && trackEntry.done;
    const inProgress = hasData && !trackEntry.done;
    // Tick = pressed Done while tracking; blinking dot = still tracking,
    // not yet confirmed done. Neither shows until real data (reps/RIR/RPE,
    // not just a weight) has actually been logged for the exercise.
    const marker = isDone
      ? '<span class="li-check">✓</span>'

    const el = document.createElement('div');
    el.className = 'select-btn ex-pick';

      if (draft.bodyweight !== undefined && draft.bodyweight !== '') {
        draft.bodyweight = convertWeightValue(draft.bodyweight, factor);
      }
      (draft.exercises || []).forEach(ex => {
        (ex.sets || []).forEach(s => { if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor); });
      });
    });
    if (changed) { persistDraft(); render(); }
  };
  root.querySelector('#finishBtn').onclick = async () => {
    const cleanExercises = (draft.exercises || [])
      .map(ex => ({
        name: ex.name,
        sets: (ex.sets || [])
          .filter(s => !setLacksPerformanceData(s, ex.unilateral))
          .map(s => { const { baseline, ...rest } = s; return rest; })
      }))
      .filter(ex => ex.sets.length > 0);
    if (cleanExercises.length === 0) { showToast('Log at least one set before finishing'); return; }
    if (draft.bodyweight === undefined || draft.bodyweight === '') {
      await loadHistory();
      const prior = historyEntries.find(e => e.bodyweight !== undefined && e.bodyweight !== '');
      if (prior) draft.bodyweight = prior.bodyweight;
    }
    persistDraft();
    goTo('session-review');
  };
}

/* When unilateral is toggled for an exercise from the Edit Exercises list,
   any already-in-progress logged sets for that exercise today (in `draft`)
   need to be converted too — otherwise the set-log page keeps showing the
   old Reps field (or old Reps R/Reps L) because `ex.unilateral` on the
   draft's exercise entry only gets initialized once, the first time that
   exercise is opened for the day. Converting bilateral -> unilateral copies
   the existing reps value into both sides; converting back takes Reps R as
   the single reps value (mirroring how it was copied going the other way). */
function syncDraftUnilateral(entry) {
  if (!draft || draft.day !== editingDay) return;
  const ex = draft.exercises.find(e => sameExName(e.name, entry.name));
  if (!ex || ex.unilateral === entry.unilateral) return;
  if (entry.unilateral) {
    ex.sets.forEach(s => { s.repsR = s.reps ?? ''; s.repsL = s.reps ?? ''; delete s.reps; });
  } else {
    ex.sets.forEach(s => { s.reps = s.repsR ?? ''; delete s.repsR; delete s.repsL; });
  }
  ex.unilateral = entry.unilateral;
  if (activeExerciseName === entry.name) activeExerciseUnilateral = entry.unilateral;
  persistDraft();
}

function renderExerciseEdit(root) {

      </button>

      <div class="li-right">
        <button class="uni-toggle no-pop ${entry.unilateral ? 'on' : ''}" data-act="uni" title="Toggle unilateral tracking">Uni</button>
        <button class="icon-btn no-pop" data-act="rename">Rename</button>

    item.querySelector('[data-act="uni"]').onclick = (e) => {
      const i = indexOfItem(item);
      list[i].unilateral = !list[i].unilateral;
      persistEditList();
      e.currentTarget.classList.toggle('on', list[i].unilateral);
      syncDraftUnilateral(list[i]);
    };
    item.querySelector('[data-act="rename"]').onclick = () => {
      const nameDiv = item.querySelector('.li-name');
      const i = indexOfItem(item);
      const current = list[i].name;
      nameDiv.innerHTML = `<input type="text" class="rename-input" value="${current.replace(/"/g,'&quot;')}" style="width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius: 9px; font-size: 16px; font-weight:700; font-family:inherit;">`;
      const inp = nameDiv.querySelector('input');
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
      let committed = false;
      const commit = () => {
        if (committed) return;
        const idx = indexOfItem(item);
        const v = inp.value.trim();
        if (v && list.some((other, j) => j !== idx && sameExName(other.name, v))) {
          showToast(`${v} is already in this day's list`);
          inp.focus();
          return;
        }
        committed = true;
        if (vvCleanup) vvCleanup();
        if (v) list[idx].name = v;
        persistEditList();
        nameDiv.innerHTML = `${list[idx].name}`;
      };
      // Mobile keyboards can be dismissed (tapping the down-chevron, tapping
      // outside the input's own focus chain, etc.) without the input ever
      // actually receiving a blur event — the keyboard visually closes but
      // the field stays focused with the cursor still blinking. Watching the
      // visual viewport catches that: once it grows back to roughly full
      // height, the keyboard is gone, so force a real blur (which then runs
      // the same commit path as a normal blur).
      let vvCleanup = null;
      if (window.visualViewport) {
        const vv = window.visualViewport;
        const fullHeight = window.innerHeight;
        const onVVResize = () => {

      }
      inp.onblur = commit;
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }

      item.addEventListener('animationend', () => item.remove(), { once: true });
    };
    return item;

  list.forEach(entry => editList.appendChild(buildItem(entry)));
  makeReorderable(editList, list, () => persistEditList());

  // Same lingering-focus issue as the rename input above: dismissing the
  // on-screen keyboard via its own dismiss control (rather than tapping
  // elsewhere / blurring the field) doesn't always fire a blur event, so the
  // input can stay focused with the keyboard hidden. Force a real blur once
  // we detect that, so focus state always matches keyboard visibility.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fullHeight = window.innerHeight;
    const onVVResizeNew = () => {
      if (vv.height > fullHeight * 0.85 && document.activeElement === newExInput) newExInput.blur();
    };
    vv.addEventListener('resize', onVVResizeNew);
  }
  // Whether to re-focus after Add (for quick multi-add) depends on whether
  // the keyboard was actually still open right before the tap. mousedown
  // fires before the browser shifts focus to the button, so this is the
  // last point where activeElement still reflects the pre-click state —
  // by the time the click handler runs, focus has already moved to the
  // button regardless of whether the keyboard was open or closed.
  let wasInputFocused = false;
  newExBtn.addEventListener('mousedown', () => { wasInputFocused = document.activeElement === newExInput; });
  newExBtn.addEventListener('touchstart', () => { wasInputFocused = document.activeElement === newExInput; });
  newExBtn.onclick = () => {
    const input = newExInput;
    const val = input.value.trim();
    if (!val) return;
    if (list.some(other => sameExName(other.name, val))) {
      showToast(`${val} is already in this day's list`);
      return;
    }
    const entry = { name: val, unilateral: newUniToggle.classList.contains('on') };
    list.push(entry);
    persistEditList();
    const item = buildItem(entry);
    item.classList.add('item-entering');
    editList.appendChild(item);
    item.addEventListener('animationend', () => item.classList.remove('item-entering'), { once: true });
    input.value = '';
    newUniToggle.classList.remove('on');
    if (wasInputFocused) input.focus();
  };
}

/* Touch/mouse drag reordering for a vertical list of .list-item rows, driven
   by a .drag-handle inside each row. `list` is the backing array (same order
   as the DOM children); it is mutated in place and `onDrop` is called once
   the reorder is committed. Rows are shifted with CSS transforms while
   dragging (no DOM moves) and the array + DOM are only reconciled on
   release, so it stays smooth and simple. */
function makeReorderable(container, list, onDrop) {
  let dragEl = null, dragHandle = null, startY = 0, startTop = 0, rowSpacing = 0;
  let order = null, dragPos = null, dragOriginalIdx = null, dragItems = null;

  // Delegated listener on the container itself, rather than one listener
  // per row bound at setup time with that row's index frozen into a
  // closure. The old per-row binding went stale the moment the list
  // changed shape (add/delete/reorder) — rows kept firing with whatever
  // index they happened to have when they were first built, so drags
  // could move the wrong row, drag two rows in tandem, or (for any row
  // added after initial render, e.g. via "+ Add exercise") do nothing at
  // all because it never got a listener in the first place. Delegating to
  // the container means every row — old or newly added — is draggable,
  // and looking the index up fresh in onPointerDown means it's always
  // correct for the list's current, actual order.
  container.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || !container.contains(handle)) return;
    const item = handle.closest('.list-item');
    if (!item || item.parentElement !== container) return;
    const idx = Array.from(container.children).indexOf(item);
    if (idx === -1) return;
    onPointerDown(e, item, handle, idx);
  });

  function onPointerDown(e, item, handle, idx) {
    e.preventDefault();
    const items = Array.from(container.children);
    if (items.length < 2) return;
    dragEl = item;
    dragHandle = handle;
    dragOriginalIdx = idx;
    order = items.map((_, i) => i);
    dragItems = items;
    dragPos = idx;
    const rect = item.getBoundingClientRect();
    startTop = rect.top;
    startY = e.clientY;
    rowSpacing = items.length > 1
      ? Math.abs(items[1].getBoundingClientRect().top - items[0].getBoundingClientRect().top)
      : rect.height + 15;
    dragEl.classList.add('dragging');
    dragEl.style.position = 'relative';
    dragEl.style.zIndex = '20';
    dragEl.style.transition = 'none';
    try { dragHandle.setPointerCapture(e.pointerId); } catch (err) {}
    dragHandle.addEventListener('pointermove', onPointerMove);
    dragHandle.addEventListener('pointerup', onPointerUp);
    dragHandle.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (!dragEl) return;
    const deltaY = e.clientY - startY;
    dragEl.style.transform = `translateY(${deltaY}px) scale(1.03)`;
    const items = Array.from(container.children);
    const targetPos = Math.max(0, Math.min(items.length - 1, dragOriginalIdx + Math.round(deltaY / rowSpacing)));
    if (targetPos !== dragPos) {
      order.splice(dragPos, 1);
      order.splice(targetPos, 0, dragOriginalIdx);
      dragPos = targetPos;
      items.forEach((el, originalIdx) => {
        if (el === dragEl) return;
        const newPos = order.indexOf(originalIdx);
        const offset = (newPos - originalIdx) * rowSpacing;
        el.style.transition = 'transform 0.38s cubic-bezier(0.22,1,0.36,1)';
        el.style.transform = `translateY(${offset}px)`;
      });
    }
  }

  function onPointerUp(e) {
    if (!dragEl) return;
    dragHandle.removeEventListener('pointermove', onPointerMove);
    dragHandle.removeEventListener('pointerup', onPointerUp);
    dragHandle.removeEventListener('pointercancel', onPointerUp);
    try { dragHandle.releasePointerCapture(e.pointerId); } catch (err) {}
    const reordered = order.map(origIdx => list[origIdx]);
    list.length = 0;
    list.push(...reordered);
    const settleEl = dragEl;
    const finalOrder = order, finalItems = dragItems;

    // FLIP "First": where every row is actually sitting on screen right
    // now (the dragged row mid-pointer-follow, the rest already nudged
    // into their target slots via transform).
    const firstRects = new Map();
    finalItems.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

    // Do the real reorder immediately — no more waiting 460ms while rows
    // sit with stale transforms.
    finalItems.forEach(el => { el.style.transition = 'none'; el.style.transform = ''; });
    finalOrder.forEach(origIdx => container.appendChild(finalItems[origIdx]));

    // FLIP "Last" vs "First": each row now naturally sits in its real new
    // slot. Instantly (no transition) offset it back to where it visually
    // was a moment ago, then release that offset with a transition next
    // frame — this reads as one continuous slide into place instead of a
    // snap-back followed by an unanimated jump.
    finalItems.forEach(el => {
      const last = el.getBoundingClientRect();
      const first = firstRects.get(el);
      const dy = first.top - last.top;
      el.style.transform = dy ? `translateY(${dy}px)` : '';
    });
    void container.offsetHeight; // force reflow so the instant offset above paints first

    finalItems.forEach(el => {
      el.style.transition = el === settleEl
        ? 'transform 0.46s cubic-bezier(0.34,1.56,0.64,1)'
        : 'transform 0.38s cubic-bezier(0.22,1,0.36,1)';
      el.style.transform = '';
    });
    settleEl.classList.remove('dragging');

    dragEl = null; dragHandle = null; order = null; dragPos = null; dragOriginalIdx = null;
    setTimeout(() => {
      settleEl.style.position = '';
      settleEl.style.zIndex = '';
      settleEl.style.transition = '';
      settleEl.style.transform = '';
      finalItems.forEach(el => { el.style.transition = ''; el.style.transform = ''; });
      onDrop();
    }, 460);
  }
}

/* ---------- set logging ---------- */
/* ---------- carry-over prefill + progress arrows ----------
   Finding the exact numbers a lifter used last time (and letting them just
   overwrite what changed) beats re-typing everything from a blank row every
   session — "least typing" is the whole point. We look at the single most
   recent session that has this exercise logged, take its filtered (real)
   sets, and use whatever sat at the same set index as a starting point for
   the new set. The exact rir/rpe values carry over as-is — if only one of
   them was filled in last time, the other one is naturally still blank. */
function findMostRecentExerciseSets(name, unilateral) {
  loadHistory();
  for (const entry of historyEntries) {
    const ex = (entry.exercises || []).find(e => sameExName(e.name, name));
    if (!ex) continue;
    const sets = (ex.sets || []).filter(s => !setLacksPerformanceData(s, unilateral));
    if (sets.length) return sets;
  }
  return null;
}
function buildPrefilledSet(name, unilateral, setIndex, fallback) {
  const rest = (fallback && fallback.rest) || settings.restDefault;
  if (!settings.autoCarry) {
    return unilateral
      ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest, media: [] }
      : { weight: '', reps: '', rir: '', rpe: '', rest, media: [] };
  }
  const priorSets = findMostRecentExerciseSets(name, unilateral);
  const prior = priorSets && priorSets[setIndex] ? priorSets[setIndex] : null;
  if (!prior) {
    return unilateral
      ? { weight: (fallback && fallback.weight) || '', repsR: '', repsL: '', rir: '', rpe: '', rest, media: [] }
      : { weight: (fallback && fallback.weight) || '', reps: '', rir: '', rpe: '', rest, media: [] };
  }
  const set = unilateral
    ? { weight: prior.weight ?? '', repsR: prior.repsR ?? '', repsL: prior.repsL ?? '', rir: prior.rir ?? '', rpe: prior.rpe ?? '', rest, media: [] }
    : { weight: prior.weight ?? '', reps: prior.reps ?? '', rir: prior.rir ?? '', rpe: prior.rpe ?? '', rest, media: [] };
  set.baseline = unilateral
    ? { weight: set.weight, repsR: set.repsR, repsL: set.repsL }
    : { weight: set.weight, reps: set.reps };
  return set;
}
/* Null (no arrow) unless both sides of the comparison are real numbers and
   actually differ — equal values, or either side blank, show nothing. */
function computeTrend(current, baseline) {
  if (baseline === undefined || baseline === null || baseline === '') return null;
  if (current === undefined || current === null || current === '') return null;
  const c = parseFloat(current), b = parseFloat(baseline);
  if (isNaN(c) || isNaN(b) || c === b) return null;
  return c > b ? 'up' : 'down';
}
function applyTrend(arrowEl, current, baseline) {
  if (!arrowEl) return;
  const trend = computeTrend(current, baseline);
  arrowEl.classList.remove('show', 'up', 'down');
  if (trend) { arrowEl.classList.add('show', trend); arrowEl.textContent = trend === 'up' ? '▲' : '▼'; }
  else { arrowEl.textContent = ''; }
}

function renderSetLog(root) {
  let ex = draft.exercises.find(e => sameExName(e.name, activeExerciseName));
  if (!ex) {
    ex = {
      name: activeExerciseName,
      unilateral: activeExerciseUnilateral,
      sets: [buildPrefilledSet(activeExerciseName, activeExerciseUnilateral, 0, { rest: settings.restDefault })]
    };
    draft.exercises.push(ex);
  }
  if (ex.unilateral === undefined) ex.unilateral = activeExerciseUnilateral;
  // Selection state is scoped to a single exercise's screen — reset it
  // whenever we land here for a different exercise than last time.
  if (setLogSelectExName !== ex.name) { setLogSelectMode = false; setLogSelected = new Set(); setLogSelectExName = ex.name; }
  const selecting = setLogSelectMode;
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>${ex.name}</div>
    <div class="section-header-row" style="justify-content:flex-end;">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="unit-toggle-btn" id="exUnitBtn" title="Switch units">${ICON_SWAP_SVG}${settings.units}</button>
        <button class="icon-square-btn danger${selecting ? ' text-mode' : ''}" id="clearExBtn" title="${selecting ? 'Cancel' : 'Select sets to delete'}">${selecting ? 'Cancel' : ICON_TRASH_SVG}</button>
      </div>
    </div>
    <div class="set-card">
      <div class="col-labels ${ex.unilateral ? 'uni' : ''}"><div>SET</div><div>Weight</div>${ex.unilateral ? '<div>Reps R</div><div>Reps L</div>' : '<div>Reps</div>'}<div>RIR</div><div>RPE</div><div></div></div>
      <div id="setsContainer"></div>
      <button class="add-set-btn" id="addSetBtn">+ Add Set</button>
    </div>
    <input type="file" id="setMediaInput" accept="image/*,video/*" multiple style="display:none;">
    ${selecting
      ? `<div class="row-inline" style="margin-top:14px;">
           <button class="btn-secondary btn-danger" id="deleteSelectedBtn" style="margin-top:0;">Delete Selected</button>
           <button class="btn-secondary btn-danger" id="deleteAllBtn" style="margin-top:0;">Delete All</button>
         </div>`
      : `<button class="btn-primary" id="doneExBtn">Done</button>`}
  `;
  renderSets(root, ex);
  root.querySelector('#backBtn').onclick = async () => {
    await pruneEmptySets(ex);
    if (ex.sets.length === 0) removeExerciseFromDraft(ex.name);
    persistDraft();
    goBack();
  };
  // The trash button just toggles select mode: tap once to enter it (camera
  // icons on each row swap for a selectable circle), tap again — now showing
  // "Cancel" — to back out without deleting anything. Actual deletion happens
  // via the Delete Selected / Delete All buttons that replace the Done
  // button while selecting. Everything else on screen stays exactly as-is.
  root.querySelector('#clearExBtn').onclick = () => {
    setLogSelectMode = !setLogSelectMode;
    setLogSelected = new Set();
    renderSetLog(root);
  };
  root.querySelector('#exUnitBtn').onclick = async () => {
    const changed = await runUnitFixFlow((factor) => {
      ex.sets.forEach(s => { if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor); });
    });
    if (changed) { persistDraft(); renderSetLog(root); }
  };
  if (selecting) {
    root.querySelector('#deleteSelectedBtn').onclick = async () => {
      if (setLogSelected.size === 0) { showToast('No sets selected'); return; }
      const n = setLogSelected.size;
      const ok = await appConfirmDelete(`Delete ${n} selected set${n > 1 ? 's' : ''}? This can't be undone.`);
      if (!ok) return;
      const idxs = Array.from(setLogSelected).sort((a, b) => b - a);
      for (const idx of idxs) {
        for (const m of (ex.sets[idx].media || [])) { await deleteMediaFile(m); }
        ex.sets.splice(idx, 1);
      }
      if (ex.sets.length === 0) {
        ex.sets.push(ex.unilateral
          ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }
          : { weight: '', reps: '', rir: '', rpe: '', rest: settings.restDefault, media: [] });
      }
      setLogSelectMode = false; setLogSelected = new Set();
      persistDraft();
      renderSetLog(root);
    };
    root.querySelector('#deleteAllBtn').onclick = async () => {
      const ok = await appConfirmDelete(`Delete all tracked sets for ${ex.name}? This can't be undone.`);
      if (!ok) return;
      for (const s of ex.sets) { for (const m of (s.media || [])) { await deleteMediaFile(m); } }
      ex.sets = [ex.unilateral
        ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }
        : { weight: '', reps: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }];
      setLogSelectMode = false; setLogSelected = new Set();
      persistDraft();
      renderSetLog(root);
    };
  }
  const addSetBtn2 = root.querySelector('#addSetBtn');
  if (addSetBtn2) addSetBtn2.onclick = () => {
    const last = ex.sets[ex.sets.length-1];
    if (last && setLacksPerformanceData(last, ex.unilateral)) {
      showToast('Log reps, RIR, or RPE for this set first');
      return;
    }
    const next = buildPrefilledSet(ex.name, ex.unilateral, ex.sets.length, { weight: last.weight, rest: last.rest });
    ex.sets.push(next);
    persistDraft();
    renderSets(root, ex);

function numOrNull(v) {

// Push one finished workout up to Supabase. Never blocks the UI — if it's
// offline or fails, the workout stays queued in 'pendingSync' and gets
// retried the next time syncPendingWorkouts() runs (e.g. next app boot).
// Guards against two overlapping syncs for the same workout (boot retry +
// online listener + a direct save can all fire close together). Without
// this, a racing delete-then-insert pair can wipe out workout_sets rows
// that the other call just inserted, leaving the parent workouts row (and
// its total_volume) intact but the sets gone — exactly the "0 Sets" bug.
// Guards against two overlapping syncs for the same workout within one tab
// (boot retry + online listener + a direct save can all fire close
// together) — but the real fix is sync_workout() itself: it runs as one
// atomic database transaction, so even two tabs or two devices on the same
// account can never interleave a partial write. Stress-tested directly
// against the DB: a hijack attempt on someone else's workout id raises and
// rolls back cleanly, and a normal sync always leaves a fully consistent
// workout+sets pair, never a partial one.
const syncingWorkoutIds = new Set();
async function syncWorkoutToCloud(log) {
  if (!account) return; // local-only mode — nothing to sync to yet
  if (syncingWorkoutIds.has(log.id)) return; // already syncing, let that one finish
  syncingWorkoutIds.add(log.id);
  try {
    const sets = [];
    (log.exercises || []).forEach(ex => {
      ex.sets.forEach((s, i) => {
        sets.push({
          exercise_name: ex.name,
          unilateral: !!ex.unilateral,
          set_index: i,
          weight: numOrNull(s.weight),
          reps: numOrNull(s.reps),
          reps_l: numOrNull(s.repsL),
          reps_r: numOrNull(s.repsR),
          rir: numOrNull(s.rir),
          rpe: numOrNull(s.rpe),
          rest_seconds: numOrNull(s.rest)
        });
      });
    });
    const { data: newUpdatedAt, error } = await supabase.rpc('sync_workout', {
      p_workout: {
        id: log.id,
        day_name: log.day,
        start_time: new Date(log.startTime).toISOString(),
        end_time: new Date(log.endTime).toISOString(),
        duration_min: log.durationMin,
        total_volume: log.totalVolume,
        bodyweight: numOrNull(log.bodyweight),
        notes: log.notes || ''
      },
      p_sets: sets
    });
    if (error) throw error;
    // Record the server's timestamp for this write, so this device knows its
    // local copy is caught up to exactly this version — anything pulled
    // later with a newer updated_at means some *other* device changed it.
    if (newUpdatedAt) await saveJSON('cloudMark:' + log.id, newUpdatedAt);

    // Success — make sure it's not sitting in the retry queue anymore.
    const pending = await loadJSON('pendingSync', []);
    const stillPending = pending.filter(id => id !== log.id);
    if (stillPending.length !== pending.length) await saveJSON('pendingSync', stillPending);
  } catch (e) {
    if (e && (e.code === 'P0002' || (e.message || '').includes('workout_tombstoned'))) {
      // Deleted from another device while this one still had it cached/pending.
      // Retrying would just fail identically forever — accept the deletion.
      deleteKey('log:' + log.id);
      deleteKey('cloudMark:' + log.id);
      const pending = await loadJSON('pendingSync', []);
      const stillPending = pending.filter(id => id !== log.id);
      if (stillPending.length !== pending.length) await saveJSON('pendingSync', stillPending);
      historyEntries = historyEntries.filter(e2 => e2.id !== log.id);
      showToast('That workout was deleted on another device');
      render();
      return;
    }
    logClientError('syncWorkoutToCloud:' + log.id, e);
    const pending = await loadJSON('pendingSync', []);
    if (!pending.includes(log.id)) { pending.push(log.id); await saveJSON('pendingSync', pending); }
  } finally {
    syncingWorkoutIds.delete(log.id);
  }
}

// Retry any workouts that failed to sync earlier (e.g. logged offline at the gym).
async function syncPendingWorkouts() {
  const pending = await loadJSON('pendingSync', []);
  for (const id of pending) {
    const log = await loadJSON('log:' + id, null);
    if (log) await syncWorkoutToCloud(log);

// Retry any cloud deletes that failed earlier (e.g. offline, or a transient
// FK error) — otherwise the orphaned cloud row just gets pulled back down
// by pullCloudWorkouts() on the next launch, undoing the delete.
async function syncPendingDeletes() {
  if (!account) return;
  const pending = await loadJSON('pendingDelete', []);
  if (!pending.length) return;
