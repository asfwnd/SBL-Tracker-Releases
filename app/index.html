  for (const id of pending) {
    try {
      const { error } = await supabase.rpc('delete_workout', { p_workout_id: id });
      if (error) throw error;
      deleteKey('cloudMark:' + id);
    } catch (e) {

// Pull down any workouts that exist in the cloud but not on this device yet
// (e.g. first login on a new phone). Never overwrites a log that already
// exists locally, so it can't clobber an in-progress local edit.
async function pullCloudWorkouts() {
  try {
    const { data: workouts, error } = await supabase
      .from('workouts')
      .select('*, workout_sets(*)')
      .eq('user_id', account.id);
    if (error) throw error;
    const pendingDeletes = await loadJSON('pendingDelete', []);
    const pendingSyncList = await loadJSON('pendingSync', []);
    let pulledAny = false;
    for (const w of (workouts || [])) {
      if (pendingDeletes.includes(w.id)) continue; // mid-delete — don't resurrect it
      if (pendingSyncList.includes(w.id)) continue; // local has an unpushed edit — don't clobber it, it'll push and set its own mark
      const localKey = 'log:' + w.id;
      const existing = await loadJSON(localKey, null);
      const cloudUpdatedAtMs = new Date(w.updated_at).getTime();
      const markKey = 'cloudMark:' + w.id;
      const mark = await loadJSON(markKey, null);
      if (existing && mark !== null && new Date(mark).getTime() >= cloudUpdatedAtMs) continue; // already caught up to this version

      const exMap = {};
      (w.workout_sets || []).sort((a, b) => a.set_index - b.set_index).forEach(s => {
        if (!exMap[s.exercise_name]) exMap[s.exercise_name] = { name: s.exercise_name, unilateral: s.unilateral, sets: [] };
        // Media never syncs to the cloud (stays device-local), so if this
        // exercise+set existed locally before, carry its media forward
        // instead of wiping it just because the numbers changed elsewhere.
        const localEx = existing && (existing.exercises || []).find(e => sameExName(e.name, s.exercise_name));
        const localSet = localEx && localEx.sets[s.set_index];
        exMap[s.exercise_name].sets.push({
          weight: s.weight, reps: s.reps, repsL: s.reps_l, repsR: s.reps_r,
          rir: s.rir, rpe: s.rpe, rest: s.rest_seconds, media: (localSet && localSet.media) || []
        });
      });

        id: w.id, date: (w.start_time || '').slice(0, 10), day: w.day_name,
        startTime: new Date(w.start_time).getTime(), endTime: new Date(w.end_time).getTime(),
        durationMin: w.duration_min, exercises: Object.values(exMap),
        totalVolume: w.total_volume, bodyweight: w.bodyweight, notes: w.notes || '',
        media: (existing && existing.media) || []

      await saveJSON(markKey, w.updated_at);

    }

    // Deletion propagation: check the tombstone table directly rather than
    // inferring from absence — a workout missing from the main select could
    // also mean a transient query hiccup, but a tombstone is unambiguous.
    const { data: tombstones, error: tErr } = await supabase
      .from('deleted_workouts')
      .select('id')
      .eq('user_id', account.id);

      const existed = localStorage.getItem('log:' + t.id) !== null;
      if (!existed) continue;
      deleteKey('log:' + t.id);
      deleteKey('cloudMark:' + t.id);

      pulledAny = true;
    }
    if (pulledAny) { await loadHistory(); await recomputeBestLiftsFromHistory(); render(); }
  } catch (e) {
    logClientError('pullCloudWorkouts', e);
  }
}

async function finishWorkout() {
  if (draft.bodyweight === undefined || draft.bodyweight === '') { showToast('Enter your bodyweight before finishing'); return; }
  const endTime = Date.now();
  const cleanExercises = draft.exercises
    .map(ex => ({ name: ex.name, unilateral: !!ex.unilateral, sets: ex.sets.filter(s => !setLacksPerformanceData(s, ex.unilateral)) }))
    .filter(ex => ex.sets.length > 0);
  if (cleanExercises.length === 0) { showToast('Log at least one set before finishing'); return; }

  await loadHistory(); // need prior sessions to compare against for the summary screen

  let totalVolume = 0;
  const prevBest = await loadJSON('bestLifts', {});
  const summary = [];
  cleanExercises.forEach(ex => {
    ex.sets.forEach(s => { totalVolume += (parseFloat(s.weight) || 0) * totalReps(s); });
    const topSet = topSetByEst(ex.sets);
    const topEst = topSet ? topSet.est : 0, topWeight = topSet ? topSet.weight : 0, topReps = topSet ? topSet.reps : 0;
    const bestKey = nameKey(ex.name);
    const hadPrevBest = prevBest[bestKey] !== undefined;
    const isPR = !hadPrevBest || topEst > prevBest[bestKey];
    if (isPR) prevBest[bestKey] = topEst;

    const sessionVol = exerciseVolume(ex.sets);
    const priorLog = historyEntries.find(e => e.exercises && e.exercises.some(x => sameExName(x.name, ex.name)));
    let status, detail;
    if (!priorLog) {
      status = 'new'; detail = 'First time logging this exercise';
    } else if (isPR) {
      status = 'pr'; detail = `New estimated 1RM: ${Math.round(topEst)}${settings.units} (${topWeight}${settings.units}×${topReps})`;
    } else {
      const priorEx = priorLog.exercises.find(x => sameExName(x.name, ex.name));
      const priorTop = topSetByEst(priorEx.sets);
      const priorTopEst = priorTop ? priorTop.est : 0;
      const priorVol = exerciseVolume(priorEx.sets);
      // e1RM (weight+reps+effort combined) drives up/down/flat, not raw
      // weight — a bigger-volume lighter set correctly beats a token single.
      status = trendStatus(priorTopEst, topEst, 1);
      const volPct = priorVol > 0 ? Math.round(((sessionVol - priorVol) / priorVol) * 100) : null;
      const volTxt = volPct === null ? '' : (Math.abs(volPct) < 1 ? ', volume steady' : `, volume ${volPct > 0 ? '+' : ''}${volPct}%`);
      if (status === 'up') detail = `Top set ${topWeight}${settings.units}×${topReps}, est. 1RM up to ${Math.round(topEst)}${settings.units} (from ${Math.round(priorTopEst)}${settings.units})${volTxt}`;
      else if (status === 'down') detail = `Top set ${topWeight}${settings.units}, est. 1RM down to ${Math.round(topEst)}${settings.units} (from ${Math.round(priorTopEst)}${settings.units})${volTxt}`;
      else detail = `Est. 1RM held at ~${Math.round(topEst)}${settings.units}${volTxt}`;
    }
    summary.push({ name: ex.name, status, detail });
  });
  await saveJSON('bestLifts', prevBest);

  const log = {
    id: uid(), date: new Date(draft.startTime).toISOString().slice(0,10),
    day: draft.day, startTime: draft.startTime, endTime,
    durationMin: Math.round((endTime - draft.startTime)/60000),
    exercises: cleanExercises, totalVolume: Math.round(totalVolume),
    bodyweight: draft.bodyweight,
    notes: draft.notes || '',
    media: ensureMediaShape(draft.media)
  };
  await saveJSON('log:' + log.id, log);
  syncWorkoutToCloud(log); // fires in background, never blocks the UI
  draft = null;
  deleteKey('draft');
  stopRestTimer();
  resetStopwatch();
  await loadHistory();
  lastSessionSummary = { day: log.day, exercises: summary, durationMin: log.durationMin, totalVolume: log.totalVolume, setCount: cleanExercises.reduce((n, ex) => n + ex.sets.length, 0) };
  navStack = [];
  goToReplace('session-summary');
}

function renderLogs(root) {

    const prevSameDay = historyEntries.slice(idx + 1).find(x => x.day === e.day);

      } else {
        // accordion — collapse any other entry that's currently open
        list.querySelectorAll('.history-body.open').forEach(el => { if (el !== body) el.classList.remove('open'); });
        list.querySelectorAll('.hd-arrow').forEach(el => { if (el !== arrow) el.textContent = '▾'; });
        if (!item.dataset.bodyBuilt) {
          item.dataset.bodyBuilt = '1';
          body.innerHTML = buildHistoryBodyHTML(e, dayMedia, hasDayMedia);
          wireHistoryExNameClicks(item);

        body.classList.add('open'); arrow.textContent = '▴'; openLogId = e.id;
        if (!item.dataset.mediaHydrated) {
          item.dataset.mediaHydrated = '1';
          // max-height transition on .history-body.open is .511s — let it
          // finish before starting decode/bridge work so the expand
          // animation itself stays smooth, instead of fighting for the
          // main thread at the exact moment it matters most.
          let fired = false;
          const go = () => { if (fired) return; fired = true; hydrateMediaEls(item); };
          body.addEventListener('transitionend', go, { once: true });
          setTimeout(go, 300); // fallback in case transitionend doesn't fire (e.g. reduced-motion)
        }
      }
    };
    list.appendChild(item);
    if (isOpen) { item.dataset.mediaHydrated = '1'; hydrateMediaEls(item); }
  });
}

function renderExerciseHistory(root) {
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Exercise History</div>
    <h1 class="big">${exerciseHistoryName}</h1>
    <div id="exHistList"></div>
  `;
  root.querySelector('#backBtn').onclick = () => goBack();
  const list = root.querySelector('#exHistList');
  const relevant = historyEntries.filter(e => e.exercises.some(ex => sameExName(ex.name, exerciseHistoryName)));
  if (relevant.length === 0) { list.innerHTML = `<div class="history-empty">No history for this exercise.</div>`; return; }

  // Find the single best set ever logged for this exercise (highest estimated
  // 1RM) so it can be called out visually below, same PR definition used on
  // the Progress screen.
  let prEntryId = null, prSetIdx = -1, prEst = -1;
  relevant.forEach(e => {
    const ex = e.exercises.find(x => sameExName(x.name, exerciseHistoryName));
    ex.sets.forEach((s, i) => {
      const w = parseFloat(s.weight) || 0;
      const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
      if (est > prEst) { prEst = est; prEntryId = e.id; prSetIdx = i; }
    });
  });

  relevant.forEach((e, idx) => {
    const ex = e.exercises.find(x => sameExName(x.name, exerciseHistoryName));
    const card = document.createElement('div');
    card.className = 'history-item';
    let compareHtml = '';
    // Only the most recent session gets a vs-last-time comparison — older
    // entries are just a record, not something to compare further back.
    if (idx === 0 && relevant.length > 1) {
      const prevEntry = relevant[1];
      const prevEx = prevEntry.exercises.find(x => sameExName(x.name, exerciseHistoryName));
      const top = topSetByEst(ex.sets), prevTop = topSetByEst(prevEx.sets);
      if (top && prevTop) {
        const estPct = prevTop.est > 0 ? ((top.est - prevTop.est) / prevTop.est) * 100 : null;
        compareHtml = `<div class="ex-hist-compare"><span class="ex-hist-compare-label">vs last time</span>${badgeFor(estPct, 'Strength')}</div>`;
      }
    }
    card.innerHTML = `<div class="ex-hist-date">${fmtFullDate(e.date)}${e.bodyweight ? ` <span class="mono" style="color:var(--text-dim); font-weight:600; font-size:13px;">· BW ${e.bodyweight}${settings.units}</span>` : ''}</div>${compareHtml}<div class="ex-hist-sets"></div>`;
    const setsWrap = card.querySelector('.ex-hist-sets');
    ex.sets.forEach((s, i) => {
      const isPR = e.id === prEntryId && i === prSetIdx;
      const row = document.createElement('div');
      row.className = 'ex-hist-set-row' + (isPR ? ' pr' : '');
      row.innerHTML = `
        <div class="ex-hist-set-line mono">${isPR ? '<span class="pr-badge">PR</span>' : ''}Set ${i+1}: ${formatSetLine(s)}</div>
        ${s.media && s.media.length ? `<div class="media-strip">${s.media.map(renderMediaItem).join('')}</div>` : ''}
      `;
      setsWrap.appendChild(row);
    });
    list.appendChild(card);
  });
  hydrateMediaEls(root);
}

// media hands control to the native file/camera picker — for video in
// particular that's a real chance of the OS reclaiming the app in the
// background — and previously the in-progress edit lived ONLY in this JS
// variable, so returning from the picker after a restart silently lost
// every unsaved change, media included. Removing media never left the
// app, so it never hit this and looked "fine" by comparison.
const EDIT_DRAFT_PREFIX = 'editDraft:';

function persistEditDraft() {

}
function renderEditLog(root) {

    // without ON DELETE CASCADE, deleting the parent row first fails and
    // leaves the workout orphaned in the cloud (which pullCloudWorkouts then
    // silently restores on the next launch). Also queue a retry on failure,
    // same pattern as the upload path, instead of just logging it.
    if (account) {
      try {
        const { error } = await supabase.rpc('delete_workout', { p_workout_id: w.id });
        if (error) throw error;
        deleteKey('cloudMark:' + w.id);
        const pendingDel = await loadJSON('pendingDelete', []);

/* ---------- unit conversion ---------- */
function convertWeightValue(val, factor) {
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  return Math.round(n * factor * 10) / 10;
}
/* Scoped unit fix — for correcting one exercise, one session, or one saved
   log when the unit toggle was mispressed, without touching the rest of
   history the way the global Settings toggle does. applyConvert(factor) is
   only invoked if the person confirms the numbers themselves are wrong and
   need recalculating; if the numbers were already correct and only the
   label was wrong, the unit flips with the data left untouched. */
async function runUnitFixFlow(applyConvert) {
  const from = settings.units;
  const to = from === 'kg' ? 'lb' : 'kg';
  const choice = await showAppConfirm(
    `Convert unit from ${from} to ${to}?`,
    [
      { label: `Yes, Change Unit and Convert Data`, value: 'convert' },
      { label: 'No, Just Change Unit', value: 'label' },
    ]
  );
  if (!choice) return false;
  if (choice === 'convert') {
    const factor = to === 'lb' ? 2.2046226218 : 1 / 2.2046226218;
    applyConvert(factor);
  }
  settings.units = to;
  await saveJSON('settings', settings);
  return true;
}
async function convertStoredUnits(oldUnit, newUnit) {
  if (!oldUnit || !newUnit || oldUnit === newUnit) return;
  const factor = newUnit === 'lb' ? 2.2046226218 : 1 / 2.2046226218;

  // Convert every saved workout log (weights, bodyweight, total volume) —
  // covers unilateral sets too, since they use the same `weight` field.
  const logKeys = listKeys('log:');
  for (const k of logKeys) {
    const log = loadJSON(k, null);
    if (!log) continue;
    if (log.bodyweight !== undefined && log.bodyweight !== '') {
      log.bodyweight = convertWeightValue(log.bodyweight, factor);
    }
    (log.exercises || []).forEach(ex => {
      (ex.sets || []).forEach(s => {
        if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor);
      });
    });
    if (typeof log.totalVolume === 'number') {
      log.totalVolume = Math.round(log.totalVolume * factor);
    }
    await saveJSON(k, log);
  }

  // Convert the cached best-lift (est. 1RM) values used for PR detection.
  const bestLifts = await loadJSON('bestLifts', {});
  Object.keys(bestLifts).forEach(name => {
    bestLifts[name] = convertWeightValue(bestLifts[name], factor);
  });
  await saveJSON('bestLifts', bestLifts);

  // Convert the in-progress draft workout, if there is one, so sets already
  // logged today (and the bodyweight field) match the new unit right away.
  if (draft) {
    if (draft.bodyweight !== undefined && draft.bodyweight !== '') {
      draft.bodyweight = convertWeightValue(draft.bodyweight, factor);
    }
    (draft.exercises || []).forEach(ex => {
      (ex.sets || []).forEach(s => {
        if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor);
      });
    });
    await saveJSON('draft', draft);
  }

  historyEntries = []; // force a fresh reload from the converted logs
}

        const dump = JSON.parse(ev.target.result);
        for (const k of Object.keys(dump)) { localStorage.setItem(k, dump[k]); }
        // Force every restored workout to re-sync, regardless of what the
        // source device's pendingSync/cloudMark state said — those are
        // meaningless once this data lands under (possibly) a different
        // account or a stale sync state. See comment above.
        const restoredLogIds = Object.keys(dump).filter(k => k.startsWith('log:')).map(k => k.slice(4));
        if (restoredLogIds.length) {
          const pending = await loadJSON('pendingSync', []);
          const merged = Array.from(new Set([...pending, ...restoredLogIds]));
          await saveJSON('pendingSync', merged);
        }
        showToast('Restored — reloading');
        setTimeout(() => boot(), 800);
      } catch (err) { showToast('Invalid backup file'); }
    };
    reader.readAsText(file);
  };
}

/* ---------- floating rest timer widget ----------
   Lives outside #app so render() never touches or destroys it — it stays
   on screen and keeps ticking no matter what screen you navigate to,
   including settings, login, etc. Drag it anywhere; tap (without dragging)
   to open the control panel. rwPos/rwOpen/rwFab/rwPanelEl are declared
   with the rest of the global state near the top of the file. */
function rwClamp() {
  const w = window.innerWidth, h = window.innerHeight;
  const size = 52;
  rwPos.x = Math.min(Math.max(rwPos.x, 8), w - size - 8);
  rwPos.y = Math.min(Math.max(rwPos.y, 8), h - size - 8);
}
function rwApplyPos(x, y) {
  if (!rwFab) return;
  rwFab.style.left = x + 'px';
  rwFab.style.top = y + 'px';
}
function rwClampAndApply() {
  if (!rwFab) return;
  rwClamp();
  rwApplyPos(rwPos.x, rwPos.y);
}
/* Smooth, low-friction "puck on a powdered board" glide: while dragging, the
   FAB doesn't jump straight to the pointer — it eases toward it every frame,
   so it always trails a touch behind the finger instead of feeling rigidly
   pinned to it. rwRenderX/Y is the on-screen position; rwPos is the target
   the finger is dragging toward. */
let rwRenderX = null, rwRenderY = null, rwGlideFrame = null, rwGliding = false;
function rwStepGlide() {
  const lerp = 0.22;
  rwRenderX += (rwPos.x - rwRenderX) * lerp;
  rwRenderY += (rwPos.y - rwRenderY) * lerp;
  rwApplyPos(rwRenderX, rwRenderY);
  if (rwGliding || Math.abs(rwPos.x - rwRenderX) > 0.3 || Math.abs(rwPos.y - rwRenderY) > 0.3) {
    rwGlideFrame = requestAnimationFrame(rwStepGlide);
  } else {
    rwRenderX = rwPos.x; rwRenderY = rwPos.y;
    rwApplyPos(rwRenderX, rwRenderY);
    rwGlideFrame = null;
  }
}
function rwStartGlide() {
  if (rwRenderX === null) { rwRenderX = rwPos.x; rwRenderY = rwPos.y; }
  if (!rwGlideFrame) rwGlideFrame = requestAnimationFrame(rwStepGlide);
}
function rwStopGlide() {
  rwGliding = false;
  if (rwGlideFrame) { cancelAnimationFrame(rwGlideFrame); rwGlideFrame = null; }
  rwRenderX = rwPos.x; rwRenderY = rwPos.y;
}
/* Snaps the FAB to whichever horizontal edge is closer once a drag ends —
   crossing the midpoint of the screen sends it to the opposite edge, the
   same way chat-head style floating buttons behave. */
/* Throwing the FAB used to just drop it wherever the finger let go — no
   carry-through, so a real flick barely moved it. This gives it momentum:
   it launches at the speed of the last bit of the drag and decelerates
   like something sliding across a surface — fast at first, then tapering
   off to a stop — before snapping to whichever edge it lands nearest. */
let rwFlingFrame = null;
function rwCancelFling() {
  if (rwFlingFrame) { cancelAnimationFrame(rwFlingFrame); rwFlingFrame = null; }
}
function rwStartFling(vx, vy, startedLeft) {
  rwCancelFling();
  // vx/vy come in as px/ms; scale to px/frame at a nominal 60fps for the loop below,
  // then knock it down hard — a straight 1:1 translation of flick speed felt way too fast.
  // Snappy launch — most of the flick's actual speed carries through — but
  // heavier friction so it dies out quickly instead of drifting.
  let velX = vx * 16 * 0.6, velY = vy * 16 * 0.6;
  const friction = 0.86; // per-frame decay — sharper taper, stops in a beat
  const minVel = 0.4; // px/frame — below this it's effectively stopped
  function step() {
    rwPos.x += velX; rwPos.y += velY;
    const beforeX = rwPos.x, beforeY = rwPos.y;
    rwClamp();
    // Hitting a wall kills velocity on that axis instead of pinning it there
    // at full speed forever.
    if (rwPos.x !== beforeX) velX = 0;
    if (rwPos.y !== beforeY) velY = 0;
    rwRenderX = rwPos.x; rwRenderY = rwPos.y;
    rwApplyPos(rwRenderX, rwRenderY);
    if (rwOpen) rwPositionPanel();
    velX *= friction; velY *= friction;
    if (Math.abs(velX) > minVel || Math.abs(velY) > minVel) {
      rwFlingFrame = requestAnimationFrame(step);
    } else {
      rwFlingFrame = null;
      rwSnapToEdge(startedLeft);
      saveJSON('restWidgetPos', { x: rwPos.x, y: rwPos.y });
    }
  }
  rwFlingFrame = requestAnimationFrame(step);
}
/* Estimates release velocity from the tail of the drag (samples from the
   last ~100ms) rather than the whole gesture, so a flick-then-hold-still
   correctly reads as "no throw" instead of averaging in the fast part. */
function rwComputeVelocity(samples) {
  if (samples.length < 2) return { vx: 0, vy: 0 };
  const last = samples[samples.length - 1];
  let ref = samples[0];
  for (let i = samples.length - 2; i >= 0; i--) {
    if (last.t - samples[i].t <= 100) ref = samples[i]; else break;
  }
  const dt = last.t - ref.t;
  if (dt <= 0) return { vx: 0, vy: 0 };
  return { vx: (last.x - ref.x) / dt, vy: (last.y - ref.y) / dt };
}
function rwSnapToEdge(startedLeft) {
  if (!rwFab) return;
  const w = window.innerWidth, h = window.innerHeight;
  const size = 52;
  const center = rwPos.x + size / 2;
  const thirdMark = startedLeft ? w / 3 : (w * 2) / 3;
  const targetX = (center < thirdMark) ? 8 : (w - size - 8);
  rwPos.x = targetX;
  rwPos.y = Math.min(Math.max(rwPos.y, 8), h - size - 8);
  rwFab.classList.add('rw-snapping');
  rwClampAndApply();
  rwRenderX = rwPos.x; rwRenderY = rwPos.y;
  if (rwOpen) rwPositionPanel();
  setTimeout(() => { if (rwFab) rwFab.classList.remove('rw-snapping'); }, 260);
}

function rwFabLabel() {
  if (restEndTime != null || restPaused) {
    const m = Math.max(0, Math.floor(restRemaining/60));
    const s = Math.max(0, restRemaining%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }
  if (swStartTimestamp != null || swElapsedMs > 0) {
    return formatStopwatch(currentStopwatchMs());
  }
  return null;
}

/* Only show the floating rest-timer/stopwatch FAB while a workout is
   actively being tracked (i.e. a draft session exists) — never during
   onboarding/auth, and never on home/settings/logs/etc. once there's no
   active session. It stays visible across any screen as long as tracking
   is in progress, and disappears the moment the session ends (Finish
   Tracking) or the in-progress draft is otherwise cleared. */
function updateRestWidgetVisibility() {
  const container = document.getElementById('restWidget');
  if (!container) return;
  const shouldShow = !!draft;
  if (!shouldShow) {
    if (typeof rwOpen !== 'undefined' && rwOpen) rwClosePanel();
    container.classList.add('rw-widget-hidden');
  } else {
    container.classList.remove('rw-widget-hidden');
  }
}

function updateRestWidgetUI() {
  if (!rwFab) return;
  const label = rwFabLabel();
  rwFab.innerHTML = label ? label : `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2h6M12 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  if (rwOpen) rwRenderPanel();
}

function rwRenderPanel() {
  if (!rwPanelEl) return;
  const modeToggle = `
    <div class="rw-mode-toggle">
      <button class="rw-mode-btn ${rwMode === 'timer' ? 'active' : ''}" id="rwModeTimerBtn">Timer</button>
      <button class="rw-mode-btn ${rwMode === 'stopwatch' ? 'active' : ''}" id="rwModeStopwatchBtn">Stopwatch</button>
    </div>`;
  if (rwMode === 'stopwatch') {
    const swRunning = swStartTimestamp != null;
    rwPanelEl.classList.remove('rw-paused-state');
    rwPanelEl.innerHTML = `
      <div class="rw-panel-header">
        <span class="rw-panel-title">Stopwatch</span>
        <button class="rw-panel-close" id="rwCloseBtn">&times;</button>
      </div>
      ${modeToggle}
      <div class="rw-display" id="rwDisplay">${formatStopwatch(currentStopwatchMs())}</div>
      <div class="rw-btn-row">
        <button class="rw-btn rw-btn-primary" id="rwActionBtn">${swRunning ? 'Pause' : 'Start'}</button>
        <button class="rw-btn rw-btn-ghost" id="rwResetBtn">Reset</button>
      </div>
    `;
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    swBoundEls = swBoundEls.filter(el => el !== displayEl && el.isConnected);
    swBoundEls.push(displayEl);
    rwPanelEl.querySelector('#rwActionBtn').onclick = () => {
      if (swRunning) pauseStopwatch(); else startStopwatch();
      rwRenderPanel();
    };
    rwPanelEl.querySelector('#rwResetBtn').onclick = () => {
      resetStopwatch();
      rwRenderPanel();
    };
  } else {
    const running = restEndTime != null;
    const idleOrStopped = !running && !restPaused;
    const actionLabel = running ? 'Pause' : (restPaused ? 'Resume' : 'Start');
    rwPanelEl.classList.toggle('rw-paused-state', restPaused);
    rwPanelEl.innerHTML = `
      <div class="rw-panel-header">
        <span class="rw-panel-title">Rest Timer</span>
        <button class="rw-panel-close" id="rwCloseBtn">&times;</button>
      </div>
      ${modeToggle}
      <div class="rw-display" id="rwDisplay">--:--</div>
      <div class="rw-dur-row">
        <button class="rw-dur-btn" id="rwDurMinus">&minus;</button>
        <input type="number" class="rw-dur-input" id="rwDurInput" value="${restDuration}">
        <button class="rw-dur-btn" id="rwDurPlus">+</button>
      </div>
      <div class="rw-btn-row">
        <button class="rw-btn rw-btn-primary" id="rwActionBtn">${actionLabel}</button>
        <button class="rw-btn rw-btn-ghost" id="rwResetBtn">Reset</button>
      </div>
    `;
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    restBoundEls = restBoundEls.filter(el => el !== displayEl && el.isConnected);
    restBoundEls.push(displayEl);
    updateRestDisplay();
    if (idleOrStopped) displayEl.textContent = '--:--';
    rwPanelEl.querySelector('#rwDurMinus').onclick = () => {
      const inp = rwPanelEl.querySelector('#rwDurInput');
      inp.value = Math.max(5, (parseInt(inp.value,10) || restDuration) - 15);
    };
    rwPanelEl.querySelector('#rwDurPlus').onclick = () => {
      const inp = rwPanelEl.querySelector('#rwDurInput');
      inp.value = (parseInt(inp.value,10) || restDuration) + 15;
    };
    rwPanelEl.querySelector('#rwActionBtn').onclick = () => {
      ensureAudioCtx();
      requestNotifPermission();
      if (running) { pauseRestTimer(); }
      else if (restPaused) { resumeRestTimer(); }
      else {
        const secs = parseInt(rwPanelEl.querySelector('#rwDurInput').value, 10) || restDuration;
        settings.restDefault = secs;
        saveJSON('settings', settings);
        startRestTimer(secs);
      }
      rwRenderPanel();
    };
    rwPanelEl.querySelector('#rwResetBtn').onclick = () => {
      stopRestTimer();
      rwRenderPanel();
    };
  }
  rwPanelEl.querySelector('#rwCloseBtn').onclick = () => rwClosePanel();
  rwPanelEl.querySelector('#rwModeTimerBtn').onclick = () => {
    if (rwMode === 'timer') return;
    rwMode = 'timer';
    saveJSON('rwMode', rwMode);
    rwRenderPanel();
  };
  rwPanelEl.querySelector('#rwModeStopwatchBtn').onclick = () => {
    if (rwMode === 'stopwatch') return;
    rwMode = 'stopwatch';
    saveJSON('rwMode', rwMode);
    rwRenderPanel();
  };
}

function rwPositionPanel() {
  if (!rwPanelEl || !rwFab) return;
  const w = window.innerWidth, h = window.innerHeight;
  const panelW = 220, panelH = 260;
  const fabRect = { left: rwPos.x, top: rwPos.y, size: 52 };
  let left = fabRect.left + fabRect.size + 12;
  if (left + panelW > w - 8) left = fabRect.left - panelW - 12;
  if (left < 8) left = Math.min(Math.max(fabRect.left, 8), w - panelW - 8);
  let top = fabRect.top;
  if (top + panelH > h - 8) top = Math.max(8, h - panelH - 8);
  rwPanelEl.style.left = left + 'px';
  rwPanelEl.style.top = top + 'px';
}

function rwOpenPanel() {
  rwOpen = true;
  rwPanelEl = document.createElement('div');
  rwPanelEl.className = 'rw-panel';
  document.getElementById('restWidget').appendChild(rwPanelEl);
  rwRenderPanel();
  rwPositionPanel();
  setTimeout(() => document.addEventListener('pointerdown', rwOutsideClick), 0);
}
function rwOutsideClick(e) {
  if (rwPanelEl && !rwPanelEl.contains(e.target) && !(rwFab && rwFab.contains(e.target))) rwClosePanel();
}
function rwClosePanel() {
  rwOpen = false;
  document.removeEventListener('pointerdown', rwOutsideClick);
  if (rwPanelEl) {
    const displayEl = rwPanelEl.querySelector('#rwDisplay');
    restBoundEls = restBoundEls.filter(el => el.isConnected && el !== displayEl);
    swBoundEls = swBoundEls.filter(el => el.isConnected && el !== displayEl);
    rwPanelEl.remove();
    rwPanelEl = null;
  }
}

function initRestWidget() {
  const container = document.getElementById('restWidget');
  const savedPos = loadJSON('restWidgetPos', null);
  if (savedPos && typeof savedPos.x === 'number' && typeof savedPos.y === 'number') rwPos = savedPos;
  else { rwPos = { x: window.innerWidth - 66, y: window.innerHeight - 220 }; }

  rwFab = document.createElement('button');
  rwFab.className = 'rw-fab';
  rwFab.setAttribute('aria-label', 'Rest timer');
  container.appendChild(rwFab);

  rwClampAndApply();
  updateRestWidgetUI();

  let dragging = false, moved = false, startX = 0, startY = 0, origX = 0, origY = 0;
  let rwMoveSamples = [];
  rwFab.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    origX = rwPos.x; origY = rwPos.y;
    rwCancelFling();
    rwMoveSamples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
    rwFab.setPointerCapture(e.pointerId);
    rwFab.classList.add('rw-dragging');
  });
  rwFab.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (moved) {
      rwPos.x = origX + dx; rwPos.y = origY + dy;
      rwClamp();
      // Track the finger directly while dragging — no lag here. The eased
      // glide is reserved for after release (fling/edge-snap), so it
      // doesn't fall behind mid-drag and then jump to catch up.
      rwStopGlide();
      rwApplyPos(rwPos.x, rwPos.y);
      if (rwOpen) rwPositionPanel();
      rwMoveSamples.push({ x: e.clientX, y: e.clientY, t: performance.now() });
      if (rwMoveSamples.length > 8) rwMoveSamples.shift();
    }
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    rwFab.classList.remove('rw-dragging');
    if (moved) {
      rwStopGlide();
      const startedLeft = (origX + 23) < window.innerWidth / 2;
      const { vx, vy } = rwComputeVelocity(rwMoveSamples);
      if (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05) {
        rwStartFling(vx, vy, startedLeft);
      } else {
        rwSnapToEdge(startedLeft);
        saveJSON('restWidgetPos', { x: rwPos.x, y: rwPos.y });
      }
    } else {
      rwStopGlide();
      if (rwOpen) rwClosePanel(); else rwOpenPanel();
    }
  };
  rwFab.addEventListener('pointerup', endDrag);
  rwFab.addEventListener('pointercancel', endDrag);

  let rwResizeDebounce = null;
  window.addEventListener('resize', () => {
    clearTimeout(rwResizeDebounce);
    rwResizeDebounce = setTimeout(() => { rwClampAndApply(); if (rwOpen) rwPositionPanel(); }, 200);
  });

  // Restore any timer that was running or paused before the app closed.
  const saved = loadJSON('restTimer', null);
  if (saved) {
    restDuration = saved.duration || settings.restDefault || 120;
    if (saved.paused) {
      restPaused = true;
      restRemaining = saved.remaining || 0;
      updateRestDisplay();
      updateRestWidgetUI();
    } else if (saved.endTime && saved.endTime > Date.now()) {
      restEndTime = saved.endTime;
      restAlarmFired = false;
      tickRestTimer();
      restInterval = setInterval(tickRestTimer, 250);
    } else {
      deleteKey('restTimer');
    }
  } else {
    restDuration = settings.restDefault || 120;
  }

  // Restore any stopwatch that was running or paused before the app closed.
  const savedSw = loadJSON('stopwatch', null);
  if (savedSw) {
    swElapsedMs = savedSw.elapsedMs || 0;
    if (savedSw.startTimestamp) {
      swStartTimestamp = savedSw.startTimestamp;
      swInterval = setInterval(updateStopwatchDisplay, 250);
      updateStopwatchDisplay();
    }
  }
  updateRestWidgetUI();
  updateRestWidgetVisibility();
}

/* ---------- boot ---------- */
initRestWidget();
boot();
// Instant press feedback for icon buttons — CSS :active can lag on touch
// devices (browsers wait a beat to rule out a scroll gesture), so we flip
// a class ourselves on pointerdown, which always fires immediately.
const ICON_BTN_SELECTOR = '.icon-square-btn, .icon-edit-btn, .gear-btn, .lightbox-close, .back-btn';
document.addEventListener('pointerdown', (e) => {
  const btn = e.target.closest(ICON_BTN_SELECTOR);
  if (btn) btn.classList.add('is-pressed');
}, true);
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  document.addEventListener(evt, () => {
    document.querySelectorAll('.is-pressed').forEach(el => el.classList.remove('is-pressed'));
  }, true);
});
</script>
</body>
</html>
