  // elsewhere / blurring the field) doesn't always fire a blur event, so the
  // input can stay focused with the keyboard hidden. Force a real blur once
  // we detect that, so focus state always matches keyboard visibility.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const fullHeight = window.innerHeight;
    const onVVResizeNew = () => {
      if (vv.height > fullHeight * 0.85 && document.activeElement === newExInput) newExInput.blur();
    };
    vv.addEventListener('resize', onVVResizeNew);
  }
  // Whether to re-focus after Add (for quick multi-add) depends on whether
  // the keyboard was actually still open right before the tap. mousedown
  // fires before the browser shifts focus to the button, so this is the
  // last point where activeElement still reflects the pre-click state —
  // by the time the click handler runs, focus has already moved to the
  // button regardless of whether the keyboard was open or closed.
  let wasInputFocused = false;
  newExBtn.addEventListener('mousedown', () => { wasInputFocused = document.activeElement === newExInput; });
  newExBtn.addEventListener('touchstart', () => { wasInputFocused = document.activeElement === newExInput; });
  newExBtn.onclick = () => {
    const input = newExInput;
    const val = input.value.trim();
    if (!val) return;
    if (list.some(other => sameExName(other.name, val))) {
      showToast(`${val} is already in this day's list`);
      return;
    }
    const entry = { name: val, unilateral: newUniToggle.classList.contains('on') };
    list.push(entry);
    persistEditList();
    captureNewExerciseIfUnknown(val, entry.unilateral, categoriesForDay(editingDay)[0]);
    const item = buildItem(entry);
    item.classList.add('item-entering');
    editList.appendChild(item);
    item.addEventListener('animationend', () => item.classList.remove('item-entering'), { once: true });
    input.value = '';
    newUniToggle.classList.remove('on');
    if (wasInputFocused) input.focus();
  };
}

/* Touch/mouse drag reordering for a vertical list of .list-item rows, driven
   by a .drag-handle inside each row. `list` is the backing array (same order
   as the DOM children); it is mutated in place and `onDrop` is called once
   the reorder is committed. Rows are shifted with CSS transforms while
   dragging (no DOM moves) and the array + DOM are only reconciled on
   release, so it stays smooth and simple. */
function makeReorderable(container, list, onDrop) {
  let dragEl = null, dragHandle = null, startY = 0, startTop = 0, rowSpacing = 0;
  let order = null, dragPos = null, dragOriginalIdx = null, dragItems = null;

  // Delegated listener on the container itself, rather than one listener
  // per row bound at setup time with that row's index frozen into a
  // closure. The old per-row binding went stale the moment the list
  // changed shape (add/delete/reorder) — rows kept firing with whatever
  // index they happened to have when they were first built, so drags
  // could move the wrong row, drag two rows in tandem, or (for any row
  // added after initial render, e.g. via "+ Add exercise") do nothing at
  // all because it never got a listener in the first place. Delegating to
  // the container means every row — old or newly added — is draggable,
  // and looking the index up fresh in onPointerDown means it's always
  // correct for the list's current, actual order.
  container.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if (!handle || !container.contains(handle)) return;
    const item = handle.closest('.list-item');
    if (!item || item.parentElement !== container) return;
    const idx = Array.from(container.children).indexOf(item);
    if (idx === -1) return;
    onPointerDown(e, item, handle, idx);
  });

  function onPointerDown(e, item, handle, idx) {
    e.preventDefault();
    const items = Array.from(container.children);
    if (items.length < 2) return;
    dragEl = item;
    dragHandle = handle;
    dragOriginalIdx = idx;
    order = items.map((_, i) => i);
    dragItems = items;
    dragPos = idx;
    const rect = item.getBoundingClientRect();
    startTop = rect.top;
    startY = e.clientY;
    rowSpacing = items.length > 1
      ? Math.abs(items[1].getBoundingClientRect().top - items[0].getBoundingClientRect().top)
      : rect.height + 15;
    dragEl.classList.add('dragging');
    dragEl.style.position = 'relative';
    dragEl.style.zIndex = '20';
    dragEl.style.transition = 'none';
    try { dragHandle.setPointerCapture(e.pointerId); } catch (err) {}
    dragHandle.addEventListener('pointermove', onPointerMove);
    dragHandle.addEventListener('pointerup', onPointerUp);
    dragHandle.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (!dragEl) return;
    const deltaY = e.clientY - startY;
    dragEl.style.transform = `translateY(${deltaY}px) scale(1.03)`;
    const items = Array.from(container.children);
    const targetPos = Math.max(0, Math.min(items.length - 1, dragOriginalIdx + Math.round(deltaY / rowSpacing)));
    if (targetPos !== dragPos) {
      order.splice(dragPos, 1);
      order.splice(targetPos, 0, dragOriginalIdx);
      dragPos = targetPos;
      items.forEach((el, originalIdx) => {
        if (el === dragEl) return;
        const newPos = order.indexOf(originalIdx);
        const offset = (newPos - originalIdx) * rowSpacing;
        el.style.transition = 'transform 0.38s cubic-bezier(0.22,1,0.36,1)';
        el.style.transform = `translateY(${offset}px)`;
      });
    }
  }

  function onPointerUp(e) {
    if (!dragEl) return;
    dragHandle.removeEventListener('pointermove', onPointerMove);
    dragHandle.removeEventListener('pointerup', onPointerUp);
    dragHandle.removeEventListener('pointercancel', onPointerUp);
    try { dragHandle.releasePointerCapture(e.pointerId); } catch (err) {}
    const reordered = order.map(origIdx => list[origIdx]);
    list.length = 0;
    list.push(...reordered);
    const settleEl = dragEl;
    const finalOrder = order, finalItems = dragItems;

    // FLIP "First": where every row is actually sitting on screen right
    // now (the dragged row mid-pointer-follow, the rest already nudged
    // into their target slots via transform).
    const firstRects = new Map();
    finalItems.forEach(el => firstRects.set(el, el.getBoundingClientRect()));

    // Do the real reorder immediately — no more waiting 460ms while rows
    // sit with stale transforms.
    finalItems.forEach(el => { el.style.transition = 'none'; el.style.transform = ''; });
    finalOrder.forEach(origIdx => container.appendChild(finalItems[origIdx]));

    // FLIP "Last" vs "First": each row now naturally sits in its real new
    // slot. Instantly (no transition) offset it back to where it visually
    // was a moment ago, then release that offset with a transition next
    // frame — this reads as one continuous slide into place instead of a
    // snap-back followed by an unanimated jump.
    finalItems.forEach(el => {
      const last = el.getBoundingClientRect();
      const first = firstRects.get(el);
      const dy = first.top - last.top;
      el.style.transform = dy ? `translateY(${dy}px)` : '';
    });
    void container.offsetHeight; // force reflow so the instant offset above paints first

    finalItems.forEach(el => {
      el.style.transition = el === settleEl
        ? 'transform 0.46s cubic-bezier(0.34,1.56,0.64,1)'
        : 'transform 0.38s cubic-bezier(0.22,1,0.36,1)';
      el.style.transform = '';
    });
    settleEl.classList.remove('dragging');

    dragEl = null; dragHandle = null; order = null; dragPos = null; dragOriginalIdx = null;
    setTimeout(() => {
      settleEl.style.position = '';
      settleEl.style.zIndex = '';
      settleEl.style.transition = '';
      settleEl.style.transform = '';
      finalItems.forEach(el => { el.style.transition = ''; el.style.transform = ''; });
      onDrop();
    }, 460);
  }
}

/* Drag reordering for a wrapping grid of circular swatches (Settings >
   Appearance palette). Unlike makeReorderable above this isn't a single
   column, so instead of tracking one offset axis it lifts the dragged
   swatch to `position: fixed` and follows the pointer directly; whenever
   the pointer crosses into a neighboring swatch's box, that swatch swaps
   DOM position with it (FLIP-animated), so the grid re-wraps live as you
   drag. Only active while `container` has the 'editing' class — callers
   gate that by only invoking the drag start when paletteEditMode is on. */
function makeGridReorderable(container, onReorder) {
  let dragEl = null, pointerId = null, offsetX = 0, offsetY = 0;

  container.addEventListener('pointerdown', (e) => {
    if (!container.classList.contains('editing')) return;
    if (e.target.closest('.swatch-del-btn')) return; // let the delete badge handle its own tap
    const swatch = e.target.closest('.palette-swatch');
    if (!swatch || swatch.dataset.locked || swatch.parentElement !== container) return;
    e.preventDefault();
    dragEl = swatch;
    pointerId = e.pointerId;
    const rect = swatch.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    swatch.style.position = 'fixed';
    swatch.style.left = rect.left + 'px';
    swatch.style.top = rect.top + 'px';
    swatch.style.width = rect.width + 'px';
    swatch.style.height = rect.height + 'px';
    swatch.style.zIndex = '50';
    swatch.style.transition = 'none';
    swatch.classList.remove('editing-jiggle');
    swatch.classList.add('dragging');
    try { swatch.setPointerCapture(pointerId); } catch (err) {}
    swatch.addEventListener('pointermove', onMove);
    swatch.addEventListener('pointerup', onUp);
    swatch.addEventListener('pointercancel', onUp);
  });

  function onMove(e) {
    if (!dragEl) return;
    dragEl.style.left = (e.clientX - offsetX) + 'px';
    dragEl.style.top = (e.clientY - offsetY) + 'px';
    const cx = e.clientX, cy = e.clientY;
    const siblings = Array.from(container.querySelectorAll('.palette-swatch')).filter(el => el !== dragEl && !el.dataset.locked);
    for (const sib of siblings) {
      const r = sib.getBoundingClientRect();
      if (cx <= r.left || cx >= r.right || cy <= r.top || cy >= r.bottom) continue;
      const firstRects = new Map();
      Array.from(container.children).forEach(el => { if (el !== dragEl) firstRects.set(el, el.getBoundingClientRect()); });
      const dragIsAfter = !!(sib.compareDocumentPosition(dragEl) & Node.DOCUMENT_POSITION_FOLLOWING);
      container.insertBefore(dragEl, dragIsAfter ? sib : sib.nextSibling);
      Array.from(container.children).forEach(el => {
        if (el === dragEl) return;
        const first = firstRects.get(el);
        if (!first) return;
        const last = el.getBoundingClientRect();
        const dx = first.left - last.left, dy = first.top - last.top;
        if (!dx && !dy) return;
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 0.28s var(--ease-glide)';
          el.style.transform = '';
        });
      });
      break;
    }
  }

  function onUp(e) {
    if (!dragEl) return;
    const settleEl = dragEl;
    settleEl.removeEventListener('pointermove', onMove);
    settleEl.removeEventListener('pointerup', onUp);
    settleEl.removeEventListener('pointercancel', onUp);
    try { settleEl.releasePointerCapture(pointerId); } catch (err) {}
    const beforeRect = settleEl.getBoundingClientRect();
    settleEl.style.position = '';
    settleEl.style.left = '';
    settleEl.style.top = '';
    settleEl.style.width = '';
    settleEl.style.height = '';
    settleEl.style.zIndex = '';
    const afterRect = settleEl.getBoundingClientRect();
    const dx = beforeRect.left - afterRect.left, dy = beforeRect.top - afterRect.top;
    settleEl.style.transition = 'none';
    settleEl.style.transform = (dx || dy) ? `translate(${dx}px, ${dy}px)` : '';
    void settleEl.offsetHeight; // force reflow so the instant offset above paints first
    settleEl.style.transition = 'transform 0.4s var(--ease-bounce)';
    settleEl.style.transform = '';
    dragEl = null;
    const newOrder = Array.from(container.querySelectorAll('.palette-swatch')).map(el => el.dataset.swatchId).filter(Boolean);
    setTimeout(() => {
      settleEl.style.transition = '';
      settleEl.classList.remove('dragging');
      settleEl.classList.add('editing-jiggle');
      onReorder(newOrder);
    }, 400);
  }
}

/* ---------- set logging ---------- */
/* ---------- carry-over prefill + progress arrows ----------
   Finding the exact numbers a lifter used last time (and letting them just
   overwrite what changed) beats re-typing everything from a blank row every
   session — "least typing" is the whole point. We look at the single most
   recent session that has this exercise logged, take its filtered (real)
   sets, and use whatever sat at the same set index as a starting point for
   the new set. The exact rir/rpe values carry over as-is — if only one of
   them was filled in last time, the other one is naturally still blank. */
function findMostRecentExerciseSets(name, unilateral) {
  loadHistory();
  for (const entry of historyEntries) {
    const ex = (entry.exercises || []).find(e => sameExName(e.name, name));
    if (!ex) continue;
    const sets = (ex.sets || []).filter(s => !setLacksPerformanceData(s, unilateral));
    if (sets.length) return sets;
  }
  return null;
}
function buildPrefilledSet(name, unilateral, setIndex, fallback) {
  const rest = (fallback && fallback.rest) || settings.restDefault;
  if (!settings.autoCarry) {
    return unilateral
      ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest, media: [] }
      : { weight: '', reps: '', rir: '', rpe: '', rest, media: [] };
  }
  const priorSets = findMostRecentExerciseSets(name, unilateral);
  // Carry on from last week's final set once this week runs longer than
  // last week did — an exact index match would leave set 4 baseline-less
  // if last week stopped at 3, even though set 3's numbers are still the
  // right thing to compare against.
  const prior = priorSets && priorSets.length
    ? priorSets[Math.min(setIndex, priorSets.length - 1)]
    : null;
  if (!prior) {
    return unilateral
      ? { weight: (fallback && fallback.weight) || '', repsR: '', repsL: '', rir: '', rpe: '', rest, media: [] }
      : { weight: (fallback && fallback.weight) || '', reps: '', rir: '', rpe: '', rest, media: [] };
  }
  const set = unilateral
    ? { weight: prior.weight ?? '', repsR: prior.repsR ?? '', repsL: prior.repsL ?? '', rir: prior.rir ?? '', rpe: prior.rpe ?? '', rest, media: [] }
    : { weight: prior.weight ?? '', reps: prior.reps ?? '', rir: prior.rir ?? '', rpe: prior.rpe ?? '', rest, media: [] };
  set.baseline = unilateral
    ? { weight: set.weight, repsR: set.repsR, repsL: set.repsL, rir: set.rir, rpe: set.rpe }
    : { weight: set.weight, reps: set.reps, rir: set.rir, rpe: set.rpe };
  return set;
}
/* The old per-field arrows compared weight-vs-weight and reps-vs-reps in
   isolation — 25x9 vs last week's 20x10 showed weight UP but reps DOWN,
   even though 25x9 is a clearly bigger lift. That's not how progress
   actually gets judged: powerlifting/strength-coaching tools (RP, Boostcamp,
   Juggernaut) score a set by its estimated 1RM, which is the one number
   that already fuses weight, reps, and effort (RIR/RPE) into a single
   comparable strength figure — same formula estimate1RM() already uses for
   the exercise-history PR trend. Both arrows on a row now report that same
   single verdict instead of two numbers that can (and did) disagree. */
function estSetTrend(set, baseline) {
  if (!baseline) return null;
  const curW = parseFloat(set.weight) || 0;
  const curReps = effectiveReps(set);
  const baseW = parseFloat(baseline.weight) || 0;
  const baseReps = effectiveReps(baseline);
  if (!curW || !curReps || !baseW || !baseReps) return null;
  const curEst = estimate1RM(curW, curReps, set.rir, set.rpe);
  const baseEst = estimate1RM(baseW, baseReps, baseline.rir, baseline.rpe);
  if (!curEst || !baseEst) return null;
  // Deadzone matches badgeFor()'s ~1% — plate-math/rounding noise on an
  // essentially-unchanged set shouldn't flip an arrow either direction.
  if (Math.abs((curEst - baseEst) / baseEst) < 0.01) return null;
  return curEst > baseEst ? 'up' : 'down';
}
function applySetTrend(arrowEls, trend) {
  arrowEls.forEach(el => {
    if (!el) return;
    el.classList.remove('show', 'up', 'down');
    if (trend) { el.classList.add('show', trend); el.textContent = trend === 'up' ? '▲' : '▼'; }
    else el.textContent = '';
  });
}

function renderSetLog(root) {
  let ex = draft.exercises.find(e => sameExName(e.name, activeExerciseName));
  if (!ex) {
    ex = {
      name: activeExerciseName,
      unilateral: activeExerciseUnilateral,
      sets: [buildPrefilledSet(activeExerciseName, activeExerciseUnilateral, 0, { rest: settings.restDefault })]
    };
    draft.exercises.push(ex);
  }
  if (ex.unilateral === undefined) ex.unilateral = activeExerciseUnilateral;
  // Selection state is scoped to a single exercise's screen — reset it
  // whenever we land here for a different exercise than last time.
  if (setLogSelectExName !== ex.name) { setLogSelectMode = false; setLogSelected = new Set(); setLogSelectExName = ex.name; }
  const selecting = setLogSelectMode;
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>${ex.name}</div>
    <div class="section-header-row" style="justify-content:flex-end;">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="unit-toggle-btn" id="exUnitBtn" title="Switch units for this exercise only">${ICON_SWAP_SVG}${exerciseUnit(ex.name)}</button>
        <button class="icon-square-btn danger${selecting ? ' text-mode' : ''}" id="clearExBtn" title="${selecting ? 'Cancel' : 'Select sets to delete'}">${selecting ? 'Cancel' : ICON_TRASH_SVG}</button>
      </div>
    </div>
    <div class="set-card">
      <div class="col-labels ${ex.unilateral ? 'uni' : ''}"><div>SET</div><div>Weight</div>${ex.unilateral ? '<div>Reps R</div><div>Reps L</div>' : '<div>Reps</div>'}<div>RIR</div><div>RPE</div><div></div></div>
      <div id="setsContainer"></div>
      <button class="add-set-btn" id="addSetBtn">+ Add Set</button>
    </div>
    <input type="file" id="setMediaInput" accept="image/*,video/*" multiple style="display:none;">
    ${selecting
      ? `<div class="row-inline" style="margin-top:14px;">
           <button class="btn-secondary btn-danger" id="deleteSelectedBtn" style="margin-top:0;">Delete Selected</button>
           <button class="btn-secondary btn-danger" id="deleteAllBtn" style="margin-top:0;">Delete All</button>
         </div>`
      : `<button class="btn-primary" id="doneExBtn">Done</button>`}
  `;
  renderSets(root, ex);
  root.querySelector('#backBtn').onclick = async () => {
    await pruneEmptySets(ex);
    if (ex.sets.length === 0) removeExerciseFromDraft(ex.name);
    persistDraft();
    goBack();
  };
  // The trash button just toggles select mode: tap once to enter it (camera
  // icons on each row swap for a selectable circle), tap again — now showing
  // "Cancel" — to back out without deleting anything. Actual deletion happens
  // via the Delete Selected / Delete All buttons that replace the Done
  // button while selecting. Everything else on screen stays exactly as-is.
  root.querySelector('#clearExBtn').onclick = () => {
    setLogSelectMode = !setLogSelectMode;
    setLogSelected = new Set();
    renderSetLog(root);
  };
  root.querySelector('#exUnitBtn').onclick = async () => {
    const changed = await convertExerciseUnit(ex.name);
    if (changed) { persistDraft(); renderSetLog(root); }
  };
  if (selecting) {
    root.querySelector('#deleteSelectedBtn').onclick = async () => {
      if (setLogSelected.size === 0) { showToast('No sets selected'); return; }
      const n = setLogSelected.size;
      const ok = await appConfirmDelete(`Delete ${n} selected set${n > 1 ? 's' : ''}? This can't be undone.`);
      if (!ok) return;
      const idxs = Array.from(setLogSelected).sort((a, b) => b - a);
      for (const idx of idxs) {
        for (const m of (ex.sets[idx].media || [])) { await deleteMediaFile(m); }
        ex.sets.splice(idx, 1);
      }
      if (ex.sets.length === 0) {
        ex.sets.push(ex.unilateral
          ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }
          : { weight: '', reps: '', rir: '', rpe: '', rest: settings.restDefault, media: [] });
      }
      setLogSelectMode = false; setLogSelected = new Set();
      persistDraft();
      renderSetLog(root);
    };
    root.querySelector('#deleteAllBtn').onclick = async () => {
      const ok = await appConfirmDelete(`Delete all tracked sets for ${ex.name}? This can't be undone.`);
      if (!ok) return;
      for (const s of ex.sets) { for (const m of (s.media || [])) { await deleteMediaFile(m); } }
      ex.sets = [ex.unilateral
        ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }
        : { weight: '', reps: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }];
      setLogSelectMode = false; setLogSelected = new Set();
      persistDraft();
      renderSetLog(root);
    };
  }
  const addSetBtn2 = root.querySelector('#addSetBtn');
  if (addSetBtn2) addSetBtn2.onclick = () => {
    const last = ex.sets[ex.sets.length-1];
    if (last && setLacksPerformanceData(last, ex.unilateral)) {
      showToast('Log reps, RIR, or RPE for this set first');
      return;
    }
    const next = buildPrefilledSet(ex.name, ex.unilateral, ex.sets.length, { weight: last.weight, rest: last.rest });
    ex.sets.push(next);
    persistDraft();
    renderSets(root, ex);
  };
  let pendingSetIndex = null;
  root.querySelector('#setMediaInput').onchange = async (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    if (!files.length || pendingSetIndex === null) return;
    const set = ex.sets[pendingSetIndex];
    if (!set.media) set.media = [];
    for (const file of files) {
      const isVideo = file.type.startsWith('video/');
      try {
        const ref = await persistMediaFile(file, (written, total) => {
          showProgressToast((isVideo ? 'Saving video… ' : 'Saving photo… ') + Math.round(written / total * 100) + '%');
        });
        set.media.push(ref);
      } catch (err) { console.error('persistMediaFile failed (active set)', err); showToast('Could not save file: ' + (err && err.message ? err.message : err)); }
      finally { hideProgressToast(); }
    }
    persistDraft();
    renderSets(root, ex);
  };
  root._triggerSetMedia = (i) => { pendingSetIndex = i; root.querySelector('#setMediaInput').click(); };
  const doneExBtn = root.querySelector('#doneExBtn');
  if (doneExBtn) doneExBtn.onclick = async () => {
    await pruneEmptySets(ex);
    if (ex.sets.length === 0) {
      removeExerciseFromDraft(ex.name);
      persistDraft();
      goBack();
      return;
    }
    ex.done = true;
    ex.lastTouched = Date.now();
    persistDraft();
    if (settings.autoQueueExercises) {
      const next = nextQueuedExercise(currentDay, ex.name);
      if (next) {
        activeExerciseName = next.name;
        activeExerciseUnilateral = !!next.unilateral;
        pendingAnim = { type: 'slide-forward' };
        goToReplace('set-log');
        return;
      }
    }
    goBack();
  };
}
/* A set only "counts" once it has some performance data on it — reps (or
   reps per side for unilateral moves), RIR, or RPE. Weight alone (e.g. just
   pre-filled from the previous set, or typed in ahead of the lift) isn't a
   logged set yet, so Add Set refuses to stack another blank row on top of
   one until at least one of those fields is filled in. */
function setLacksPerformanceData(set, unilateral) {
  const isEmpty = (v) => v === '' || v === undefined || v === null;
  const repsEmpty = unilateral
    ? isEmpty(set.repsR) && isEmpty(set.repsL)
    : isEmpty(set.reps);
  return repsEmpty && isEmpty(set.rir) && isEmpty(set.rpe);
}
/* True once an exercise has at least one set with real performance data
   logged on it (see setLacksPerformanceData) — used to decide whether it
   counts as "in progress"/"done" for the exercise-list sorting + markers,
   and whether it should be saved at all when the workout is finished. */
function exerciseHasLoggedData(ex) {
  return !!(ex && ex.sets && ex.sets.some(s => !setLacksPerformanceData(s, ex.unilateral)));
}
/* Strips out any set that never got real performance data (weight typed in
   alone doesn't count) — called whenever the user leaves an exercise's
   screen, so a blank/half-filled row never lingers or gets saved. Any media
   attached to a stripped set is deleted along with it. */
async function pruneEmptySets(ex) {
  const kept = [];
  const removed = [];
  for (const s of (ex.sets || [])) {
    if (setLacksPerformanceData(s, ex.unilateral)) removed.push(s); else kept.push(s);
  }
  for (const s of removed) {
    for (const m of (s.media || [])) { await deleteMediaFile(m); }
  }
  ex.sets = kept;
}
/* Removes an exercise entry from the in-progress draft entirely — used once
   pruning leaves it with zero real sets, so an exercise nobody actually
   logged anything for doesn't linger as a phantom "touched" entry. */
function removeExerciseFromDraft(name) {
  if (!draft || !draft.exercises) return;
  const idx = draft.exercises.findIndex(e => sameExName(e.name, name));
  if (idx !== -1) draft.exercises.splice(idx, 1);
}
function renderSets(root, ex) {
  const container = root.querySelector('#setsContainer');
  container.innerHTML = '';
  ex.sets.forEach((set, i) => {
    if (!set.media) set.media = [];
    if (set.rpe === undefined) set.rpe = '';
    const row = document.createElement('div');
    row.className = 'set-row' + (ex.unilateral ? ' uni' : '');
    const repsInputs = ex.unilateral
      ? `<input class="mono rl" type="number" placeholder="0" value="${set.repsR}">
         <input class="mono rr2" type="number" placeholder="0" value="${set.repsL}">`
      : `<input class="mono r" type="number" placeholder="0" value="${set.reps}">`;
    const checked = setLogSelectMode && setLogSelected.has(i);
    // One trend arrow per row, on the set number — used to sit duplicated
    // on top of both the weight AND reps fields, but both copies always
    // showed the identical verdict anyway (see estSetTrend below), so it
    // was just the same information twice. One arrow on the set number
    // reads as "this set, overall" instead of implying weight and reps
    // are being judged separately.
    const numCell = `<div class="set-num mono set-cell-trend">${i+1}<span class="trend-arrow" data-trend="set"></span></div>`;
    const actionCell = setLogSelectMode
      ? `<button class="set-select-circle ${checked ? 'checked' : ''}" data-select-set title="Select this set"></button>`
      : `<button class="set-media-btn ${set.media.length ? 'has-media' : ''}" data-set-media title="Attach photo or video">${ICON_CAMERA_SVG}${set.media.length ? '<span class="dot"></span>' : ''}</button>`;
    row.innerHTML = `
      ${numCell}
      <input class="mono w" type="number" step="0.5" placeholder="0" value="${set.weight}">
      ${repsInputs}
      <input class="mono rr" type="number" placeholder="—" value="${set.rir}">
      <input class="mono rp" type="number" step="0.5" placeholder="—" value="${set.rpe}">
      ${actionCell}
    `;
    // Tapping into a field with a carried-over value selects the existing
    // text immediately — type the new number and it just replaces what was
    // there instead of needing to hold-select or backspace it out first.
    row.querySelectorAll('input[type="number"]').forEach(inp => { inp.onfocus = (e) => e.target.select(); });
    const baseline = set.baseline || {};
    const setArrow = row.querySelector('[data-trend="set"]');
    const refreshTrend = () => applySetTrend([setArrow], estSetTrend(set, baseline));
    refreshTrend();
    row.querySelector('.w').oninput = (e) => {
      set.weight = e.target.value; ex.lastTouched = Date.now(); persistDraftDebounced();
      refreshTrend();
    };
    // Auto-start arming: comparing against the live previous value (the old
    // "wasEmpty" check) can't tell a fresh entry from an edit once a reps
    // field already holds something — the onfocus handler above selects the
    // existing text, so typing over a carried-over/already-entered value
    // replaces it in a single oninput event and never passes through an
    // empty intermediate state for that check to catch. Arm explicitly on
    // focus instead (every time the field is entered, whatever it holds),
    // and fire auto-start once on the very next change, then disarm — so
    // re-typing a value still starts the timer, but further keystrokes
    // while still editing that same value don't restart it repeatedly.

async function checkDayRolloverOnResume() {
  if (!draft || !draft.startTime) return;
  const draftDateStr = new Date(draft.startTime).toISOString().slice(0, 10);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (draftDateStr === todayStr) return;
  if (screen !== 'home' && screen !== 'logs') return;
  await autoFinishStaleDraft();
  render();
}

/* ---------- cloud sync ---------- */
function numOrNull(v) {
  if (v === '' || v === undefined || v === null) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

// Push one finished workout up to Supabase. Never blocks the UI — if it's
// offline or fails, the workout stays queued in 'pendingSync' and gets
// retried the next time syncPendingWorkouts() runs (e.g. next app boot).
// Guards against two overlapping syncs for the same workout (boot retry +
// online listener + a direct save can all fire close together). Without
// this, a racing delete-then-insert pair can wipe out workout_sets rows
// that the other call just inserted, leaving the parent workouts row (and
// its total_volume) intact but the sets gone — exactly the "0 Sets" bug.
// Guards against two overlapping syncs for the same workout within one tab
// (boot retry + online listener + a direct save can all fire close
// together) — but the real fix is sync_workout() itself: it runs as one
// atomic database transaction, so even two tabs or two devices on the same
// account can never interleave a partial write. Stress-tested directly
// against the DB: a hijack attempt on someone else's workout id raises and
// rolls back cleanly, and a normal sync always leaves a fully consistent
// workout+sets pair, never a partial one.
const syncingWorkoutIds = new Set();
// IDs just written to localStorage by a backup restore. A tombstone hit on
// one of these means "this workout was deleted at some point before the
// backup was taken (or since)", not "another device deleted it just now" —
// the two cases share the same P0002 error but need different handling,
// otherwise every restored workout that was ever deleted gets silently
// wiped straight back out during the post-restore sync pass.
const restoredLogIds = new Set();
async function syncWorkoutToCloud(log) {
  if (!account) return; // local-only mode — nothing to sync to yet
  if (syncingWorkoutIds.has(log.id)) return; // already syncing, let that one finish
  syncingWorkoutIds.add(log.id);
  try {
    const sets = [];
    (log.exercises || []).forEach(ex => {
      ex.sets.forEach((s, i) => {
        sets.push({
          exercise_name: ex.name,
          unilateral: !!ex.unilateral,
          set_index: i,
          weight: numOrNull(s.weight),
          reps: numOrNull(s.reps),
          reps_l: numOrNull(s.repsL),
          reps_r: numOrNull(s.repsR),
          rir: numOrNull(s.rir),
          rpe: numOrNull(s.rpe),
          rest_seconds: numOrNull(s.rest)
        });
      });
    });
    const { data: newUpdatedAt, error } = await supabase.rpc('sync_workout', {
      p_workout: {
        id: log.id,
        day_name: log.day,
        start_time: new Date(log.startTime).toISOString(),
        end_time: new Date(log.endTime).toISOString(),
        duration_min: log.durationMin,
        total_volume: log.totalVolume,
        bodyweight: numOrNull(log.bodyweight),
        notes: log.notes || ''
      },
      p_sets: sets
    });
    if (error) throw error;
    // Record the server's timestamp for this write, so this device knows its
    // local copy is caught up to exactly this version — anything pulled
    // later with a newer updated_at means some *other* device changed it.
    if (newUpdatedAt) await saveJSON('cloudMark:' + log.id, newUpdatedAt);

    // Success — make sure it's not sitting in the retry queue anymore.
    const pending = await loadJSON('pendingSync', []);
    const stillPending = pending.filter(id => id !== log.id);
    if (stillPending.length !== pending.length) await saveJSON('pendingSync', stillPending);
  } catch (e) {
    if (e && (e.code === 'P0002' || (e.message || '').includes('workout_tombstoned'))) {
      const pending = await loadJSON('pendingSync', []);
      const stillPending = pending.filter(id => id !== log.id);
      if (stillPending.length !== pending.length) await saveJSON('pendingSync', stillPending);
      if (restoredLogIds.has(log.id)) {
        // This ID came from a backup restore, not live use. The tombstone
        // means it was deleted (on any device) at some point before this
        // restore — the local copy the user just restored is a stale
        // resurrection of already-deleted data, not new work to protect.
        // Leave it in localStorage as local-only (not synced, not deleted)
        // instead of wiping it silently and flashing a toast per workout.
        restoredLogIds.delete(log.id);
        return;
      }
      // Deleted from another device while this one still had it cached/pending.
      // Retrying would just fail identically forever — accept the deletion.
      deleteKey('log:' + log.id);
      deleteKey('cloudMark:' + log.id);
      historyEntries = historyEntries.filter(e2 => e2.id !== log.id);
      showToast('That workout was deleted on another device');
      render();
      return;
    }
    logClientError('syncWorkoutToCloud:' + log.id, e);
    const pending = await loadJSON('pendingSync', []);
    if (!pending.includes(log.id)) { pending.push(log.id); await saveJSON('pendingSync', pending); }
  } finally {
    syncingWorkoutIds.delete(log.id);
  }
}

// Retry any workouts that failed to sync earlier (e.g. logged offline at the gym).
async function syncPendingWorkouts() {
  const pending = await loadJSON('pendingSync', []);
  for (const id of pending) {
    const log = await loadJSON('log:' + id, null);
    if (log) await syncWorkoutToCloud(log);
  }
}

// Retry any cloud deletes that failed earlier (e.g. offline, or a transient
// FK error) — otherwise the orphaned cloud row just gets pulled back down
// by pullCloudWorkouts() on the next launch, undoing the delete.
async function syncPendingDeletes() {
  if (!account) return;
  const pending = await loadJSON('pendingDelete', []);
  if (!pending.length) return;
  const stillPending = [];
  for (const id of pending) {
    try {
      const { error } = await supabase.rpc('delete_workout', { p_workout_id: id });
      if (error) throw error;
      deleteKey('cloudMark:' + id);
    } catch (e) {
      logClientError('retryCloudDelete:' + id, e);
      stillPending.push(id);
    }
  }
  if (stillPending.length !== pending.length) await saveJSON('pendingDelete', stillPending);
}

// Fires the moment the device regains connectivity (not just on the next
// app boot) so anything logged offline — e.g. mid-workout at the gym with
// no signal — gets pushed up right away instead of waiting for the user to
// relaunch the app. Registered once per app session.
let onlineSyncListenerAttached = false;
function ensureOnlineSyncListener() {
  if (onlineSyncListenerAttached || typeof window === 'undefined') return;
  onlineSyncListenerAttached = true;
  window.addEventListener('online', () => { runBackOnlineSync(); });
}
// Only shows the banner when there's actually something queued from being
// offline — reconnecting with nothing pending stays silent. Stays up for
// the whole push, not a fixed delay, since a slow reconnect (e.g. one bar
// of signal at the gym) can take a while to actually finish uploading.
async function runBackOnlineSync() {
  const [pendingWorkouts, pendingDeletes, pendingAppState, pendingExercises] = await Promise.all([
    loadJSON('pendingSync', []),
    loadJSON('pendingDelete', []),
    loadJSON('pendingAppState', {}),
    loadJSON('pendingExerciseInserts', [])
  ]);
  const hasPending = pendingWorkouts.length > 0 || pendingDeletes.length > 0 || Object.keys(pendingAppState).length > 0 || pendingExercises.length > 0;
  if (!hasPending) return;
  backOnlineBannerActive = true;
  if (screen === 'home') render();
  try {
    await Promise.all([syncPendingWorkouts(), syncPendingDeletes(), syncPendingAppState(), syncPendingExerciseInserts()]);
  } finally {
    backOnlineBannerActive = false;
    if (screen === 'home') render();
  }
}

// Pull down any workouts that exist in the cloud but not on this device yet
// (e.g. first login on a new phone). Never overwrites a log that already
// exists locally, so it can't clobber an in-progress local edit.
async function pullCloudWorkouts() {
  try {
    const { data: workouts, error } = await supabase
      .from('workouts')
      .select('*, workout_sets(*)')
      .eq('user_id', account.id);
    if (error) throw error;
    const pendingDeletes = await loadJSON('pendingDelete', []);
    const pendingSyncList = await loadJSON('pendingSync', []);
    let pulledAny = false;
    for (const w of (workouts || [])) {
      if (pendingDeletes.includes(w.id)) continue; // mid-delete — don't resurrect it
      if (pendingSyncList.includes(w.id)) continue; // local has an unpushed edit — don't clobber it, it'll push and set its own mark
      const localKey = 'log:' + w.id;
      const existing = await loadJSON(localKey, null);
      const cloudUpdatedAtMs = new Date(w.updated_at).getTime();
      const markKey = 'cloudMark:' + w.id;
      const mark = await loadJSON(markKey, null);
      if (existing && mark !== null && new Date(mark).getTime() >= cloudUpdatedAtMs) continue; // already caught up to this version

      const exMap = {};
      (w.workout_sets || []).sort((a, b) => a.set_index - b.set_index).forEach(s => {
        if (!exMap[s.exercise_name]) exMap[s.exercise_name] = { name: s.exercise_name, unilateral: s.unilateral, sets: [] };
        // Media never syncs to the cloud (stays device-local), so if this
        // exercise+set existed locally before, carry its media forward
        // instead of wiping it just because the numbers changed elsewhere.
        const localEx = existing && (existing.exercises || []).find(e => sameExName(e.name, s.exercise_name));
        const localSet = localEx && localEx.sets[s.set_index];
        const repsFields = s.unilateral ? { repsL: s.reps_l, repsR: s.reps_r } : { reps: s.reps };
        exMap[s.exercise_name].sets.push({
          weight: s.weight, ...repsFields,
          rir: s.rir, rpe: s.rpe, rest: s.rest_seconds, media: (localSet && localSet.media) || []
        });
      });
      const log = {
        id: w.id, date: (w.start_time || '').slice(0, 10), day: w.day_name,
        startTime: new Date(w.start_time).getTime(), endTime: new Date(w.end_time).getTime(),
        durationMin: w.duration_min, exercises: Object.values(exMap),
        totalVolume: w.total_volume, bodyweight: w.bodyweight, notes: w.notes || '',
        media: (existing && existing.media) || []
      };
      await saveJSON(localKey, log);
      await saveJSON(markKey, w.updated_at);
      pulledAny = true;
    }

    // Deletion propagation: check the tombstone table directly rather than
    // inferring from absence — a workout missing from the main select could
    // also mean a transient query hiccup, but a tombstone is unambiguous.
    const { data: tombstones, error: tErr } = await supabase
      .from('deleted_workouts')
      .select('id')
      .eq('user_id', account.id);
    if (tErr) throw tErr;
    for (const t of (tombstones || [])) {
      if (pendingSyncList.includes(t.id)) continue; // unpushed local edit — let it push first, it'll get tombstone-rejected and clean itself up then
      const existed = localStorage.getItem('log:' + t.id) !== null;
      if (!existed) continue;
      deleteKey('log:' + t.id);
      deleteKey('cloudMark:' + t.id);
      historyEntries = historyEntries.filter(e => e.id !== t.id);
      pulledAny = true;
    }
    // Only re-render if we're actually sitting on a screen this data feeds —
    // same guard style as the other background-sync call sites above
    // (`if (screen === 'home') render();`). This used to call render()
    // unconditionally, which meant a workout syncing in from another device
    // could force a full #app rebuild out from under whatever screen the
    // person happened to be on — e.g. mid-type in Settings or Edit
    // Exercises — for no benefit, since those screens don't show workout
    // history anyway.
    const WORKOUT_DATA_SCREENS = ['home', 'logs', 'workout-detail', 'exercise-history', 'progress'];
    if (pulledAny) {
      await loadHistory();
      await recomputeBestLiftsFromHistory();
      if (WORKOUT_DATA_SCREENS.includes(screen)) render();
    }
  } catch (e) {
    logClientError('pullCloudWorkouts', e);
  }
}

async function finishWorkout() {
  if (draft.bodyweight === undefined || draft.bodyweight === '') { showToast('Enter your bodyweight before finishing'); return; }
  const endTime = Date.now();
  const cleanExercises = draft.exercises
    .map(ex => ({ name: ex.name, unilateral: !!ex.unilateral, sets: ex.sets.filter(s => !setLacksPerformanceData(s, ex.unilateral)) }))
    .filter(ex => ex.sets.length > 0);
  if (cleanExercises.length === 0) { showToast('Log at least one set before finishing'); return; }

  await loadHistory(); // need prior sessions to compare against for the summary screen

  const prevBest = await loadJSON('bestLifts', {});
  const summary = [];
  cleanExercises.forEach(ex => {
    const exU = exerciseUnit(ex.name);
    const topSet = topSetByEst(ex.sets);
    const topEst = topSet ? topSet.est : 0, topWeight = topSet ? topSet.weight : 0, topReps = topSet ? topSet.reps : 0;
    const bestKey = nameKey(ex.name);
    const hadPrevBest = prevBest[bestKey] !== undefined;
    const isPR = !hadPrevBest || topEst > prevBest[bestKey];
    if (isPR) prevBest[bestKey] = topEst;

    const sessionVol = exerciseVolume(ex.sets);
    const priorLog = historyEntries.find(e => e.exercises && e.exercises.some(x => sameExName(x.name, ex.name)));
    let status, detail;
    if (!priorLog) {
      status = 'new'; detail = 'First time logging this exercise';
    } else if (isPR) {
      status = 'pr'; detail = `New estimated 1RM: ${Math.round(topEst)}${exU} (${topWeight}${exU}×${topReps})`;
    } else {
      const priorEx = priorLog.exercises.find(x => sameExName(x.name, ex.name));
      const priorTop = topSetByEst(priorEx.sets);
      const priorTopEst = priorTop ? priorTop.est : 0;
      const priorVol = exerciseVolume(priorEx.sets);
      // e1RM (weight+reps+effort combined) drives up/down/flat, not raw
      // weight — a bigger-volume lighter set correctly beats a token single.
      status = trendStatus(priorTopEst, topEst, 1);
      const volPct = priorVol > 0 ? Math.round(((sessionVol - priorVol) / priorVol) * 100) : null;
      const volTxt = volPct === null ? '' : (Math.abs(volPct) < 1 ? ', volume steady' : `, volume ${volPct > 0 ? '+' : ''}${volPct}%`);
      if (status === 'up') detail = `Top set ${topWeight}${exU}×${topReps}, est. 1RM up to ${Math.round(topEst)}${exU} (from ${Math.round(priorTopEst)}${exU})${volTxt}`;
      else if (status === 'down') detail = `Top set ${topWeight}${exU}, est. 1RM down to ${Math.round(topEst)}${exU} (from ${Math.round(priorTopEst)}${exU})${volTxt}`;
      else detail = `Est. 1RM held at ~${Math.round(topEst)}${exU}${volTxt}`;
    }
    summary.push({ name: ex.name, status, detail });
  });
  await saveJSON('bestLifts', prevBest);

  const log = {
    id: uid(), date: new Date(draft.startTime).toISOString().slice(0,10),
    day: draft.day, startTime: draft.startTime, endTime,
    durationMin: Math.round((endTime - draft.startTime)/60000),
    exercises: cleanExercises, totalVolume: sessionTotalVolume(cleanExercises),
    bodyweight: draft.bodyweight,
    notes: draft.notes || '',
    media: ensureMediaShape(draft.media)
  };
  await saveJSON('log:' + log.id, log);
  syncWorkoutToCloud(log); // fires in background, never blocks the UI
  draft = null;
  deleteKey('draft');
  stopRestTimer();
  resetStopwatch();
  await loadHistory();
  lastSessionSummary = { day: log.day, exercises: summary, durationMin: log.durationMin, totalVolume: log.totalVolume, setCount: cleanExercises.reduce((n, ex) => n + ex.sets.length, 0) };
  navStack = [];
  goToReplace('session-summary');
}

/* ---------- logs ---------- */
async function loadHistory() {
  try {
    const keys = listKeys('log:');
    const entries = [];
    for (const k of keys) {
      const v = loadJSON(k, null);
      if (v) entries.push(v);
    }
    entries.sort((a,b) => b.startTime - a.startTime);
    historyEntries = entries;
  } catch (e) {
    historyEntries = historyEntries || [];
  }
}
/* bestLifts (per-exercise all-time PR est. 1RM) used to be built ONLY
   incrementally, one call per finished live session — so an imported
   backup, or a fresh pull from another device, never touched it. Result:
   right after importing months of real history, the very next session you
   finish would show every exercise as a false "New PR" / "New exercise"
   because bestLifts was still empty, even though the full history was
   sitting right there in historyEntries. This derives bestLifts from
   scratch off the actual historical data (every set, every session) —
   independent of import order, sync order, or which device logged what. */
async function recomputeBestLiftsFromHistory() {
  const best = {};
  historyEntries.forEach(entry => {
    (entry.exercises || []).forEach(ex => {
      const key = nameKey(ex.name);
      (ex.sets || []).filter(hasSetData).forEach(s => {
        const w = parseFloat(s.weight) || 0;
        const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
        if (!best[key] || est > best[key]) best[key] = est;
      });
    });
  });
  await saveJSON('bestLifts', best);
}
function renderMediaItem(item) {

  const playBadge = item.type === 'video' ? `<div class="thumb-play-badge">▶</div>` : '';
  if (item.idbKey) {
    return item.type === 'photo'
      ? `<div class="log-media-thumb" data-media-idx="${idx}"><img data-media-key="${item.idbKey}"></div>`
      : `<div class="log-media-thumb" data-media-idx="${idx}"><video data-media-key="${item.idbKey}" muted playsinline preload="metadata"></video>${playBadge}</div>`;
  }

    return item.type === 'photo'
      ? `<div class="log-media-thumb" data-media-idx="${idx}"><img data-media-fspath="${item.path}" data-media-fsdir="${item.dir || 'DATA'}"></div>`
      : `<div class="log-media-thumb" data-media-idx="${idx}"><video data-media-fspath="${item.path}" data-media-fsdir="${item.dir || 'DATA'}" muted playsinline preload="metadata"></video>${playBadge}</div>`;
  }
  if (!src) return `<div class="log-media-tag">${item.type === 'video' ? '🎥' : '🖼️'} ${item.name || 'media'} (unavailable)</div>`;
  if (item.type === 'photo') return `<div class="log-media-thumb" data-media-idx="${idx}"><img src="${src}"></div>`;

}
/* Editable variant of a set's media strip — thumbnails plus a delete-x on

    addBtn.className = 'add-media-btn';

}
function fmtRestShort(secs) {
  secs = parseInt(secs, 10) || 0;
  if (secs <= 0) return '';
  const m = Math.floor(secs / 60), s = secs % 60;
  if (m > 0) return s > 0 ? `${m}m ${s}s` : `${m}m`;
  return `${s}s`;
}
/* Shared line formatter for a single logged set — used anywhere a set needs

  const nz = (v) => (v === undefined || v === null || v === '') ? '?' : v;
  const nzWeight = (v) => (v === undefined || v === null || v === '') ? 0 : v;
  const repsTxt = (s.repsR !== undefined || s.repsL !== undefined)
    ? `R${nz(s.repsR)} / L${nz(s.repsL)}`
    : nz(s.reps);
  const unit = exName ? exerciseUnit(exName) : settings.units;
  const parts = [`${nzWeight(s.weight)} ${unit} × ${repsTxt}`];
  const effort = [];
  if (s.rir !== '' && s.rir !== undefined && s.rir !== null) effort.push(`${s.rir} RIR`);
  if (s.rpe !== '' && s.rpe !== undefined && s.rpe !== null) effort.push(`${s.rpe} RPE`);

      const pctTxt = pct === null ? '' : ` (${pct >= 0 ? '+' : ''}${Math.round(pct * 10) / 10}%)`;

    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>History</div>
    <h1 class="big">Your logs</h1>
    <div id="logsList"></div>
  `;
  root.querySelector('#backBtn').onclick = () => goBack();

  historyEntries.forEach((e, idx) => {

    const dayMedia = ensureMediaShape(e.media);

    // Prefer the precise start/end timestamps for a mm:ss reading; fall back
    // to durationMin (minute precision, but always populated — it's the
    // same field the Home and Workout Detail screens already show as
    // "Duration") for any entry where those timestamps aren't usable, e.g.
    // pulled from the cloud with a null end_time.
    let elapsedTxt = '—';
    if (e.endTime && e.startTime && e.endTime > e.startTime) {
      elapsedTxt = formatStopwatch(e.endTime - e.startTime);
    } else if (typeof e.durationMin === 'number' && e.durationMin > 0) {
      elapsedTxt = formatStopwatch(e.durationMin * 60000);
    }
    item.innerHTML = `
      <div class="history-head">
        <div class="hd-left"><div class="hd-date">${fmtLogTitle(e.date, e.day)}</div>${e.bodyweight ? `<div class="hd-meta mono">BW ${e.bodyweight}${settings.units}</div>` : ''}</div>
        <div class="hd-right">
          <button class="icon-edit-btn" data-log-edit="${e.id}" title="Edit">${ICON_EDIT_SVG}</button>
          <div class="hd-arrow" style="color:var(--text-dim);">${isOpen?'▴':'▾'}</div>
        </div>
      </div>
      <div class="hd-stats">
        <div class="hd-stat"><span class="hd-stat-val hd-volume mono">${e.totalVolume}${settings.units}</span><span class="hd-stat-lbl">Volume</span></div>
        <div class="hd-stat"><span class="hd-stat-val hd-sets mono">${setCount}</span><span class="hd-stat-lbl">Sets</span></div>
        <div class="hd-stat"><span class="hd-stat-val hd-elapsed mono">${elapsedTxt}</span><span class="hd-stat-lbl">Elapsed</span></div>
      </div>
      <div class="history-body ${isOpen?'open':''}">${isOpen ? buildHistoryBodyHTML(e, dayMedia, hasDayMedia) : ''}</div>`;
    if (isOpen) { item.dataset.bodyBuilt = '1'; wireHistoryExNameClicks(item); }
    item.querySelector('[data-log-edit]').onclick = (ev) => {
      ev.stopPropagation();
      editLogId = e.id;
      goTo('edit-log');
    };
    item.querySelector('.history-head').onclick = () => {
      const body = item.querySelector('.history-body');
      const arrow = item.querySelector('.hd-arrow');
      const nowOpen = body.classList.contains('open');
      if (nowOpen) {
        body.classList.remove('open'); arrow.textContent = '▾'; openLogId = null;
      } else {
        // accordion — collapse any other entry that's currently open
        list.querySelectorAll('.history-body.open').forEach(el => { if (el !== body) el.classList.remove('open'); });
        list.querySelectorAll('.hd-arrow').forEach(el => { if (el !== arrow) el.textContent = '▾'; });
        if (!item.dataset.bodyBuilt) {
          item.dataset.bodyBuilt = '1';
          body.innerHTML = buildHistoryBodyHTML(e, dayMedia, hasDayMedia);
          wireHistoryExNameClicks(item);
        }
        body.classList.add('open'); arrow.textContent = '▴'; openLogId = e.id;
        if (!item.dataset.mediaHydrated) {
          item.dataset.mediaHydrated = '1';
          // max-height transition on .history-body.open is .511s — let it
          // finish before starting decode/bridge work so the expand
          // animation itself stays smooth, instead of fighting for the
          // main thread at the exact moment it matters most.
          let fired = false;
          const go = () => { if (fired) return; fired = true; hydrateMediaEls(item); };
          body.addEventListener('transitionend', go, { once: true });
          setTimeout(go, 300); // fallback in case transitionend doesn't fire (e.g. reduced-motion)
        }
      }
    };
    list.appendChild(item);
    if (isOpen) { item.dataset.mediaHydrated = '1'; hydrateMediaEls(item); }
  });
}

function renderExerciseHistory(root) {
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Exercise History</div>
    <h1 class="big">${exerciseHistoryName}</h1>
    <div id="exHistList"></div>
  `;
  root.querySelector('#backBtn').onclick = () => goBack();
  const list = root.querySelector('#exHistList');
  const relevant = historyEntries.filter(e => e.exercises.some(ex => sameExName(ex.name, exerciseHistoryName)));
  if (relevant.length === 0) { list.innerHTML = `<div class="history-empty">No history for this exercise.</div>`; return; }

  // Find the single best set ever logged for this exercise (highest estimated
  // 1RM) so it can be called out visually below, same PR definition used on
  // the Progress screen.
  let prEntryId = null, prSetIdx = -1, prEst = -1;
  relevant.forEach(e => {
    const ex = e.exercises.find(x => sameExName(x.name, exerciseHistoryName));
    ex.sets.forEach((s, i) => {
      const w = parseFloat(s.weight) || 0;
      const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
      if (est > prEst) { prEst = est; prEntryId = e.id; prSetIdx = i; }
    });
  });

  relevant.forEach((e, idx) => {
    const ex = e.exercises.find(x => sameExName(x.name, exerciseHistoryName));
    const card = document.createElement('div');
    card.className = 'history-item';
    let compareHtml = '';
    // Only the most recent session gets a vs-last-time comparison — older
    // entries are just a record, not something to compare further back.
    if (idx === 0 && relevant.length > 1) {
      const prevEntry = relevant[1];
      const prevEx = prevEntry.exercises.find(x => sameExName(x.name, exerciseHistoryName));
      const top = topSetByEst(ex.sets), prevTop = topSetByEst(prevEx.sets);
      if (top && prevTop) {
        const estPct = prevTop.est > 0 ? ((top.est - prevTop.est) / prevTop.est) * 100 : null;
        compareHtml = `<div class="ex-hist-compare"><span class="ex-hist-compare-label">vs last time</span>${badgeFor(estPct, 'Strength')}</div>`;
      }
    }
    card.innerHTML = `<div class="ex-hist-date">${fmtFullDate(e.date)}${e.bodyweight ? ` <span class="mono" style="color:var(--text-dim); font-weight:600; font-size:13px;">· BW ${e.bodyweight}${settings.units}</span>` : ''}</div>${compareHtml}<div class="ex-hist-sets"></div>`;
    const setsWrap = card.querySelector('.ex-hist-sets');
    ex.sets.forEach((s, i) => {
      const isPR = e.id === prEntryId && i === prSetIdx;
      const row = document.createElement('div');
      row.className = 'ex-hist-set-row' + (isPR ? ' pr' : '');
      row.innerHTML = `
        <div class="ex-hist-set-line mono">${isPR ? '<span class="pr-badge">PR</span>' : ''}Set ${i+1}: ${formatSetLine(s, exerciseHistoryName)}</div>
        ${s.media && s.media.length ? `<div class="media-strip">${s.media.map(renderMediaItem).join('')}</div>` : ''}
      `;
      setsWrap.appendChild(row);
    });
    list.appendChild(card);
  });
  hydrateMediaEls(root);
}

/* ---------- edit / delete past logs ---------- */
// Edit-log changes are now mirrored to localStorage (same pattern as the
// tracking `draft`) so they survive an Android WebView restart. Picking
// media hands control to the native file/camera picker — for video in
// particular that's a real chance of the OS reclaiming the app in the
// background — and previously the in-progress edit lived ONLY in this JS
// variable, so returning from the picker after a restart silently lost
// every unsaved change, media included. Removing media never left the
// app, so it never hit this and looked "fine" by comparison.
const EDIT_DRAFT_PREFIX = 'editDraft:';
let editLogWorkingCopy = null;
function persistEditDraft() {
  if (editLogWorkingCopy) saveJSON(EDIT_DRAFT_PREFIX + editLogWorkingCopy.id, editLogWorkingCopy);
}
function renderEditLog(root) {
  const log = historyEntries.find(e => e.id === editLogId);
  if (!log) { goBack('logs'); return; }
  if (!editLogWorkingCopy || editLogWorkingCopy.id !== editLogId) {
    const saved = loadJSON(EDIT_DRAFT_PREFIX + editLogId, null);
    editLogWorkingCopy = saved || JSON.parse(JSON.stringify(log));
  }
  const w = editLogWorkingCopy;
  if (editLogSelectWid !== w.id) { editLogSelectExIdx = null; editLogSelected = new Set(); editLogSelectWid = w.id; }
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Edit workout</div>
    <div class="section-header-row">
      <h1 class="big">${fmtFullDate(w.date)}</h1>
      <button class="unit-toggle-btn" id="logUnitBtn" title="Switch units">${ICON_SWAP_SVG}${settings.units}</button>
    </div>
    <div class="section-label">Bodyweight (${settings.units})</div>
    <div class="field-block"><input type="number" step="0.1" id="bwInput" value="${w.bodyweight ?? ''}"></div>
    <div id="exEditList"></div>
    <input type="file" id="editMediaInput" accept="image/*,video/*" multiple style="display:none;">
    <button class="btn-primary" id="saveEditBtn" style="margin-top:14px;">Save Changes</button>
    <button class="btn-secondary btn-danger" id="deleteWholeBtn" style="margin-top:10px;">Delete Entire Workout</button>
  `;
  root.querySelector('#backBtn').onclick = () => { editLogWorkingCopy = null; goBack(); };
  root.querySelector('#logUnitBtn').onclick = async () => {
    const changed = await runUnitFixFlow((factor) => {
      if (w.bodyweight !== undefined && w.bodyweight !== '') w.bodyweight = convertWeightValue(w.bodyweight, factor);
      (w.exercises || []).forEach(ex => {
        (ex.sets || []).forEach(s => { if (s.weight !== undefined && s.weight !== '') s.weight = convertWeightValue(s.weight, factor); });
      });
    });
    if (changed) { persistEditDraft(); renderEditLog(root); }
  };
  root.querySelector('#bwInput').onchange = (e) => { w.bodyweight = e.target.value; persistEditDraft(); };
  let pendingMediaSet = null; // set object the next file picker result should attach to
  root.querySelector('#editMediaInput').onchange = async (e) => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    // Snapshot now, synchronously — pendingMediaSet can get reassigned by a
    // second "add media" click on a different exercise while this file is
    // still writing (writes can take a while, see the timeout/queue notes
    // on persistMediaFile). Reading pendingMediaSet after an await would
    // silently attach this file to whatever exercise was clicked most
    // recently, not the one that was actually selected for.
    const targetSet = pendingMediaSet;
    if (!files.length || !targetSet) return;
    if (!targetSet.media) targetSet.media = [];
    for (const file of files) {
      const isVideo = file.type.startsWith('video/');
      try {
        const ref = await persistMediaFile(file, (written, total) => {
          showProgressToast((isVideo ? 'Saving video… ' : 'Saving photo… ') + Math.round(written / total * 100) + '%');
        });
        targetSet.media.push(ref);
      } catch (err) { console.error('persistMediaFile failed (edit log)', err); showToast('Could not save file: ' + (err && err.message ? err.message : err)); }
      finally { hideProgressToast(); }
    }
    persistEditDraft();
    renderEditLog(root);
  };
  const exList = root.querySelector('#exEditList');
  w.exercises.forEach((ex, exIdx) => {
    const selecting = editLogSelectExIdx === exIdx;
    const block = document.createElement('div');
    block.className = 'hex';
    block.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <div class="hex-name" style="cursor:default;">${ex.name}</div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="icon-edit-btn danger${selecting ? ' text-mode' : ''}" data-del-ex title="${selecting ? 'Cancel' : 'Select sets to delete'}">${selecting ? 'Cancel' : ICON_TRASH_SVG}</button>
        </div>
      </div>
      <div class="col-labels ${ex.unilateral ? 'uni' : ''}"><div>SET</div><div>Weight</div>${ex.unilateral ? '<div>Reps R</div><div>Reps L</div>' : '<div>Reps</div>'}<div>RIR</div><div>RPE</div><div></div></div>
      <div class="setsEditContainer"></div>
    `;
    const setsWrap = block.querySelector('.setsEditContainer');
    ex.sets.forEach((s, sIdx) => {
      const row = document.createElement('div');
      row.className = 'set-row' + (ex.unilateral ? ' uni' : '');
      if (!s.media) s.media = [];
      const checked = selecting && editLogSelected.has(sIdx);
      const numCell = `<div class="set-num">${sIdx+1}</div>`;
      const actionCell = selecting
        ? `<button class="set-select-circle ${checked ? 'checked' : ''}" data-select-set title="Select this set"></button>`
        : `<button class="set-media-btn ${s.media.length ? 'has-media' : ''}" data-set-media title="Attach photo or video">${ICON_CAMERA_SVG}${s.media.length ? '<span class="dot"></span>' : ''}</button>`;
      row.innerHTML = `
        ${numCell}
        <input type="number" step="0.5" data-f="weight" value="${s.weight ?? ''}">
        ${ex.unilateral
          ? `<input type="number" data-f="repsR" value="${s.repsR ?? ''}"><input type="number" data-f="repsL" value="${s.repsL ?? ''}">`
          : `<input type="number" data-f="reps" value="${s.reps ?? ''}">`}
        <input type="number" step="0.5" data-f="rir" value="${s.rir ?? ''}">
        <input type="number" step="0.5" data-f="rpe" value="${s.rpe ?? ''}">
        ${actionCell}
      `;
      row.querySelectorAll('input[data-f]').forEach(inp => {
        inp.onchange = () => { s[inp.dataset.f] = inp.value; persistEditDraft(); };
      });
      if (selecting) {
        row.querySelector('[data-select-set]').onclick = (e) => {
          if (editLogSelected.has(sIdx)) editLogSelected.delete(sIdx); else editLogSelected.add(sIdx);
          e.currentTarget.classList.toggle('checked');
        };
      } else {
        row.querySelector('[data-set-media]').onclick = () => {
          pendingMediaSet = s;
          root.querySelector('#editMediaInput').click();
        };
      }
      setsWrap.appendChild(row);
      const mediaStrip = renderEditableMediaStrip(s.media, { noAdd: true });
      if (mediaStrip) {
        mediaStrip.style.margin = '4px 0 12px 0';
        mediaStrip.querySelectorAll('[data-rm-media]').forEach(btn => {
          btn.onclick = async () => {
            const idx = parseInt(btn.dataset.rmMedia, 10);
            const ok = await appConfirmDelete('Remove this media?');
            if (!ok) return;
            const item = s.media[idx];
            if (item) await deleteMediaFile(item); // free the underlying file/blob, not just the reference
            s.media.splice(idx, 1);
            persistEditDraft();
            renderEditLog(root);
          };
        });
        setsWrap.appendChild(mediaStrip);
      }
    });
    const addSetBtn = document.createElement('button');
    addSetBtn.className = 'add-set-btn';
    addSetBtn.textContent = '+ Add Set';
    addSetBtn.onclick = () => {
      const last = ex.sets[ex.sets.length - 1];
      if (last && setLacksPerformanceData(last, ex.unilateral)) {
        showToast('Log reps, RIR, or RPE for this set first');
        return;
      }
      const carryFrom = (settings.autoCarry && last) ? last : null;
      const next = ex.unilateral
        ? { weight: carryFrom ? carryFrom.weight : '', repsR: '', repsL: '', rir: '', rpe: '', rest: carryFrom ? carryFrom.rest : settings.restDefault, media: [] }
        : { weight: carryFrom ? carryFrom.weight : '', reps: '', rir: '', rpe: '', rest: carryFrom ? carryFrom.rest : settings.restDefault, media: [] };
      ex.sets.push(next);
      persistEditDraft();
      renderEditLog(root);
    };
    block.appendChild(addSetBtn);
    // The trash button just toggles select mode: tap once to enter it (camera
    // icons on each row swap for a selectable circle), tap again — now
    // showing "Cancel" — to back out without deleting anything. Actual
    // deletion happens via the Delete Selected / Delete All row below.
    block.querySelector('[data-del-ex]').onclick = () => {
      editLogSelectExIdx = selecting ? null : exIdx;
      editLogSelected = new Set();
      renderEditLog(root);
    };
    if (selecting) {
      const delRow = document.createElement('div');
      delRow.className = 'row-inline';
      delRow.style.marginTop = '10px';
      delRow.innerHTML = `
        <button class="btn-secondary btn-danger" style="margin-top:0;">Delete Selected</button>
        <button class="btn-secondary btn-danger" style="margin-top:0;">Delete Exercise</button>
      `;
      const [delSelBtn, delAllBtn] = delRow.querySelectorAll('button');
      delSelBtn.onclick = async () => {
        if (editLogSelected.size === 0) { showToast('No sets selected'); return; }
        const n = editLogSelected.size;
        const wholeExercise = n >= ex.sets.length;
        const ok = await appConfirmDelete(wholeExercise
          ? `Delete ${ex.name} from this workout? This can't be undone.`
          : `Delete ${n} selected set${n > 1 ? 's' : ''}? This can't be undone.`);
        if (!ok) return;
        const idxs = Array.from(editLogSelected).sort((a, b) => b - a);
        for (const idx of idxs) {
          for (const m of (ex.sets[idx].media || [])) { await deleteMediaFile(m); }
          ex.sets.splice(idx, 1);
        }
        editLogSelectExIdx = null; editLogSelected = new Set();
        if (ex.sets.length === 0) w.exercises.splice(exIdx, 1);
        persistEditDraft();
        renderEditLog(root);
      };
      delAllBtn.onclick = async () => {
        const ok = await appConfirmDelete(`Delete ${ex.name} from this workout? This can't be undone.`);
        if (!ok) return;
        for (const s2 of ex.sets) { for (const m of (s2.media || [])) { await deleteMediaFile(m); } }
        w.exercises.splice(exIdx, 1);
        editLogSelectExIdx = null; editLogSelected = new Set();
        persistEditDraft();
        renderEditLog(root);
      };
      block.appendChild(delRow);
    }
    exList.appendChild(block);
  });

  // Add a new exercise to this historic workout.
  const addExWrap = document.createElement('div');
  addExWrap.className = 'row-inline';
  addExWrap.style.marginTop = '4px';
  addExWrap.style.marginBottom = '22px';
  addExWrap.innerHTML = `
    <div class="ex-ac-wrap">
      <input type="text" id="newLogExInput" placeholder="+ Add exercise" autocomplete="off">
      <div class="ex-ac-dropdown" id="newLogExDropdown" style="display:none;"></div>
    </div>
  `;
  exList.appendChild(addExWrap);
  const newLogExInput = addExWrap.querySelector('#newLogExInput');
  const dropdown = addExWrap.querySelector('#newLogExDropdown');
  const knownExercises = collectKnownExercisesFull();
  function renderDropdown() {
    const q = newLogExInput.value.trim().toLowerCase();
    const matches = (q ? knownExercises.filter(k => k.name.toLowerCase().includes(q)) : knownExercises).slice(0, 40);
    if (matches.length === 0) {
      dropdown.innerHTML = `<div class="ex-ac-empty">${q ? 'No matching exercise found' : 'Nothing tracked yet'}</div>`;
    } else {
      dropdown.innerHTML = matches.map(k =>
        `<div class="ex-ac-item" data-name="${k.name.replace(/"/g,'&quot;')}" data-uni="${k.unilateral ? '1' : '0'}">${k.name}${k.unilateral ? '<span class="uni-tag">UNI</span>' : ''}</div>`
      ).join('');
    }
    dropdown.style.display = 'block';
    dropdown.querySelectorAll('.ex-ac-item[data-name]').forEach(item => {
      item.onclick = () => {
        const name = item.dataset.name;
        const uni = item.dataset.uni === '1';
        if (w.exercises.some(ex => sameExName(ex.name, name))) {
          showToast(`${name} is already in this workout`);
          return;
        }
        w.exercises.push({
          name, unilateral: uni,
          sets: [ uni
            ? { weight: '', repsR: '', repsL: '', rir: '', rpe: '', rest: settings.restDefault, media: [] }
            : { weight: '', reps: '', rir: '', rpe: '', rest: settings.restDefault, media: [] } ]
        });
        persistEditDraft();
        renderEditLog(root);
      };
    });
  }
  newLogExInput.addEventListener('focus', renderDropdown);
  newLogExInput.addEventListener('input', renderDropdown);
  newLogExInput.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });

  // General media for the day — not tied to any specific set.
  w.media = ensureMediaShape(w.media);
  const dayMediaLabel = document.createElement('div');
  dayMediaLabel.className = 'section-label';
  dayMediaLabel.textContent = 'General media for this workout';
  exList.appendChild(dayMediaLabel);
  const dayMediaStrip = renderEditableMediaStrip(w.media.items);
  dayMediaStrip.querySelectorAll('[data-rm-media]').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.rmMedia, 10);
      const ok = await appConfirmDelete('Remove this media?');
      if (!ok) return;
      const item = w.media.items[idx];
      if (item) await deleteMediaFile(item);
      w.media.items.splice(idx, 1);
      persistEditDraft();
      renderEditLog(root);
    };
  });
  dayMediaStrip.querySelector('[data-add-media]').onclick = () => {
    pendingMediaSet = { media: w.media.items };
    root.querySelector('#editMediaInput').click();
  };
  exList.appendChild(dayMediaStrip);

  reuseCachedMediaEls(root);
  hydrateMediaEls(root);
  root.querySelector('#saveEditBtn').onclick = async () => {
    w.totalVolume = sessionTotalVolume(w.exercises);
    await saveJSON('log:' + w.id, w);
    syncWorkoutToCloud(w);
    const idx = historyEntries.findIndex(e => e.id === w.id);
    if (idx !== -1) historyEntries[idx] = w;
    deleteKey(EDIT_DRAFT_PREFIX + w.id);
    editLogWorkingCopy = null;
    showToast('Workout updated');
    goBack();
  };
  root.querySelector('#deleteWholeBtn').onclick = async () => {
    const ok = await appConfirmDelete("Delete this entire workout? This can't be undone.");
    if (!ok) return;
    deleteKey('log:' + w.id);
    deleteKey(EDIT_DRAFT_PREFIX + w.id);
    historyEntries = historyEntries.filter(e => e.id !== w.id);
    editLogWorkingCopy = null;
    showToast('Workout deleted');
    goBack();
    // Child rows must go first — workout_sets has a FK back to workouts, and
    // without ON DELETE CASCADE, deleting the parent row first fails and
    // leaves the workout orphaned in the cloud (which pullCloudWorkouts then
    // silently restores on the next launch). Also queue a retry on failure,
    // same pattern as the upload path, instead of just logging it.
    if (account) {
      try {
        const { error } = await supabase.rpc('delete_workout', { p_workout_id: w.id });
        if (error) throw error;
        deleteKey('cloudMark:' + w.id);
        const pendingDel = await loadJSON('pendingDelete', []);
        const stillPendingDel = pendingDel.filter(id => id !== w.id);
        if (stillPendingDel.length !== pendingDel.length) await saveJSON('pendingDelete', stillPendingDel);
      } catch (e) {
        logClientError('deleteWholeWorkout:' + w.id, e);
        const pendingDel = await loadJSON('pendingDelete', []);
        if (!pendingDel.includes(w.id)) { pendingDel.push(w.id); await saveJSON('pendingDelete', pendingDel); }
      }
    }
  };
}

/* ---------- progress ---------- */
function renderProgress(root) {
  root.innerHTML = `
    <div class="eyebrow"><button class="back-btn" id="backBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Progress</div>
    <h1 class="big">Your numbers</h1>
    <div id="progContent"></div>
  `;
  root.querySelector('#backBtn').onclick = () => goBack();
  const content = root.querySelector('#progContent');
  if (historyEntries.length === 0) { content.innerHTML = `<div class="history-empty">Log a few workouts to see progress here.</div>`; return; }

  const workoutCount = historyEntries.length;
  const lifetimeVolume = historyEntries.reduce((a,e)=>a+e.totalVolume,0);
  const avgDuration = Math.round(historyEntries.reduce((a,e)=>a+e.durationMin,0)/workoutCount);
  const now = Date.now();
  const weekVolume = historyEntries.filter(e => now - e.startTime < 7*86400000).reduce((a,e)=>a+e.totalVolume,0);
  const monthVolume = historyEntries.filter(e => now - e.startTime < 30*86400000).reduce((a,e)=>a+e.totalVolume,0);

  const prMap = {};
  historyEntries.forEach(e => e.exercises.forEach(ex => ex.sets.forEach(s => {
    const w=parseFloat(s.weight)||0;
    const est = estimate1RM(w, effectiveReps(s), s.rir, s.rpe);
    const key = nameKey(ex.name);
    if (!prMap[key] || est > prMap[key].est) prMap[key] = { est, weight:w, set:s, bw:e.bodyweight, name: ex.name };
  })));

  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="sv mono">${workoutCount}</div><div class="sk">Workouts</div></div>
      <div class="stat-box"><div class="sv mono">${avgDuration}m</div><div class="sk">Avg. length</div></div>
