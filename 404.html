<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — SBL Tracker</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07100f">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #07100f;
    --teal: #14f0cc;
    --text: #eaf3f1;
    --text-dim: #6f8987;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .code {
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--teal);
    text-shadow: 0 0 20px rgba(20,240,204,0.35);
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    margin: 0 0 12px;
    line-height: 1.15;
  }
  p {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 420px;
    margin: 0 0 32px;
  }
  a.home {
    display: inline-block;
    padding: 13px 28px;
    border-radius: 999px;
    background: var(--teal);
    color: #06201c;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
  }
  a.home:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page went missing<br>mid-set.</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="home" href="/">Back to SBL Tracker</a>
</body>
</html>
